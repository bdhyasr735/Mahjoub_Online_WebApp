# apps/services/collection_queries.graphql

# ============================================
# 9. استعلام جلب جميع المجموعات
# ============================================
query FindAllCollections {
  findAllCollections {
    success
    message
    data {
      qid
      title
    }
  }
}

# ============================================
# 10. استعلام جلب مجموعة بواسطة QID
# ============================================
query FindCollectionByQid($id: ID!) {
  findCollectionByQid(id: $id) {
    success
    message
    data {
      qid
      title
      description
      handle
      image {
        id
        url
        altText
        width
        height
      }
      productsCount
      isActive
      isFeatured
      createdAt
      updatedAt
    }
  }
}

# ============================================
# 11. استعلام جلب منتجات مجموعة معينة
# ============================================
query FindAllProductsForCollection($id: ID!) {
  findAllProductsForCollection(id: $id) {
    success
    message
    data {
      id
      qid
      name
      description
      price
      compareAtPrice
      currency
      sku
      quantity
      status
      isActive
      isAvailable
      mainImage {
        id
        url
        altText
        width
        height
      }
      images {
        id
        url
        altText
        width
        height
        position
      }
      variants {
        id
        sku
        price
        compareAtPrice
        quantity
        isAvailable
        image {
          url
          altText
        }
        inventory {
          quantity
          available
        }
      }
      category {
        id
        name
        handle
      }
      brand {
        id
        name
        logo {
          url
        }
      }
      ratings {
        average
        count
      }
      inventory {
        quantity
        available
      }
    }
  }
}
