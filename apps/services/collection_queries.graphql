# ============================================
# استعلامات المجموعات - Collection Queries
# ============================================

# 1. جلب جميع المجموعات
query FindAllCollections {
  findAllCollections {
    id
    qid
    name
    description
    handle
    image {
      id
      url
      altText
      width
      height
    }
    productsCount
    isActive
    isFeatured
    createdAt
    updatedAt
    
    products {
      id
      qid
      name
      description
      price
      compareAtPrice
      mainImage {
        url
        altText
      }
      images {
        url
        altText
      }
      variants {
        id
        price
        sku
        quantity
      }
    }
  }
}

# 2. جلب مجموعة بواسطة QID
query FindCollectionByQid($id: ID!) {
  findCollectionByQid(id: $id) {
    id
    qid
    name
    description
    handle
    image {
      id
      url
      altText
      width
      height
    }
    productsCount
    isActive
    isFeatured
    createdAt
    updatedAt
    
    products {
      id
      qid
      name
      description
      price
      compareAtPrice
      mainImage {
        url
        altText
      }
      variants {
        id
        price
        sku
        quantity
      }
    }
  }
}

# 3. جلب منتجات مجموعة معينة
query FindAllProductsForCollection($id: ID!) {
  findAllProductsForCollection(id: $id) {
    id
    qid
    name
    description
    price
    compareAtPrice
    currency
    sku
    quantity
    status
    isActive
    isAvailable
    
    mainImage {
      id
      url
      altText
      width
      height
    }
    
    images {
      id
      url
      altText
      width
      height
      position
    }
    
    variants {
      id
      sku
      price
      compareAtPrice
      quantity
      isAvailable
      image {
        url
        altText
      }
      inventory {
        quantity
        available
      }
    }
    
    category {
      id
      name
      handle
    }
    
    brand {
      id
      name
      logo {
        url
      }
    }
    
    ratings {
      average
      count
    }
    
    inventory {
      quantity
      available
    }
  }
}

# 4. جلب المجموعات المميزة
query FindFeaturedCollections {
  findFeaturedCollections {
    id
    qid
    name
    description
    handle
    image {
      url
      altText
    }
    productsCount
    isFeatured
  }
}

# 5. جلب المجموعات النشطة
query FindActiveCollections {
  findActiveCollections {
    id
    qid
    name
    description
    handle
    image {
      url
      altText
    }
    productsCount
    isActive
    createdAt
  }
}
