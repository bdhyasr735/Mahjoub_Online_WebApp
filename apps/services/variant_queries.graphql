# ============================================
# 5. استعلام جلب جميع المتغيرات لمنتج
# ============================================
query FindAllVariantsByProductId($productId: ID!) {
  findAllVariantsByProductId(productId: $productId) {
    id
    qid
    sku
    barcode
    price
    compareAtPrice
    costPerItem
    quantity
    weight
    weightUnit
    position
    isActive
    isAvailable
    options {
      id
      name
      value
      position
    }
    image {
      id
      url
      altText
      width
      height
    }
    inventory {
      id
      quantity
      available
      reserved
      location
      warehouse
    }
    product {
      id
      qid
      name
      mainImage {
        url
        altText
      }
    }
  }
}

