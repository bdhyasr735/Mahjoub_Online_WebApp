# ============================================================
# ✅ استعلام الخيارات (Options) الوحيد المدعوم
# ============================================================

query FindAllOptionsForProduct($qid: String!) {
    findAllOptionsForProduct(qid: $qid) {
        data {
            qid
            name
            values {
                option
                label
                sortOrder
            }
        }
    }
}

