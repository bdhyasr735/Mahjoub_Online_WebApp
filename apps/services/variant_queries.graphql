# ============================================
# 7. استعلام جلب خيار بواسطة QID
# ============================================
query FindOptionByQid($qid: String!) {
  findOptionByQid(qid: $qid) {
    id
    qid
    name
    position
    values {
      id
      value
      position
      hexCode
      image {
        url
        altText
      }
    }
  }
}

# ============================================
# 8. استعلام جلب جميع خيارات المنتج
# ============================================
query FindAllOptionsForProduct($qid: String!) {
  findAllOptionsForProduct(qid: $qid) {
    id
    qid
    name
    position
    values {
      id
      value
      position
      hexCode
      image {
        url
        altText
      }
    }
  }
}
