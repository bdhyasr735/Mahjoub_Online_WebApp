# 📂 apps/services/orders_queries.graphql

# ============================================================
# ✅ استعلامات الطلبات (Orders Queries)
# ============================================================

query FindAllOrders($input: FindAllOrdersInput) {
    findAllOrders(input: $input) {
        data {
            _id
            orderNumber
            type
            totalPrice
            isPaid
            createdAt
            status {
                _id
                title
                code
            }
            account {
                type
                account {
                    fullname
                }
            }
            items {
                productId
                quantity
                price
                productData {
                    title
                    sku
                }
            }
        }
        pagination {
            totalItems
            totalPages
            currentPage
            limit
            hasNextPage
        }
    }
}

query FindOrderById($id: ID!) {
    findOrderById(id: $id) {
        _id
        orderNumber
        type
        totalPrice
        isPaid
        createdAt
        status {
            _id
            title
            code
        }
        account {
            type
            account {
                fullname
            }
        }
        items {
            productId
            quantity
            price
            productData {
                title
                sku
            }
        }
    }
}

# ============================================================
# 🔄 التحويرات (Mutations) المدعومة للطلبات
# ============================================================

mutation CreateOrder($input: OrderInput!) {
    createOrder(input: $input) {
        _id
        totalPrice
        status
    }
}

mutation UpdateOrderStatus($id: ID!, $status: String!) {
    updateOrderStatus(id: $id, status: $status) {
        _id
        status
        updatedAt
    }
}

mutation DeleteOrder($id: ID!) {
    deleteOrder(id: $id)
}
