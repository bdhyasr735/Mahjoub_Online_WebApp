query FindAllOrders($page: Int, $limit: Int) {
    findAllOrders(page: $page, limit: $limit) {
        data {
            _id
            type
            totalPrice
            isPaid
            createdAt
            status {
                code
                title
            }
            account {
                account {
                    fullname
                }
            }
            items {
                productId
                quantity
                price
                productData {
                    title
                    price
                    image {
                        fileUrl
                    }
                }
            }
        }
        pagination {
            totalItems
            totalPages
            currentPage
            limit
            hasNextPage
        }
    }
}

query FindOrderById($id: ID!) {
    findOrderById(id: $id) {
        data {
            _id
            type
            totalPrice
            isPaid
            createdAt
            status {
                code
                title
            }
            account {
                account {
                    fullname
                }
            }
            items {
                productId
                quantity
                price
                productData {
                    title
                    price
                    image {
                        fileUrl
                    }
                }
            }
        }
    }
}

mutation DeleteOrder($id: ID!) {
    deleteOrder(id: $id)
}
