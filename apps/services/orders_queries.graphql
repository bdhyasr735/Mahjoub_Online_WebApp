"""
خدمة الطلبات - Order Service Queries (نسخة متطابقة مع Sandbox)
"""

# ============================================================
# ✅ استعلامات الطلبات
# ============================================================

query GetOrdersByIds($ids: [ID!], $input: FindAllOrdersInput) {
    getOrdersByIds(ids: $ids, input: $input) {
        data {
            _id
            totalPrice
            status
            createdAt
            items {
                productQid
                quantity
                price
            }
        }
        pagination {
            totalItems
            totalPages
            currentPage
            limit
            hasNextPage
        }
    }
}

query GetOrder($id: ID!) {
    getOrdersByIds(ids: [$id]) {
        data {
            _id
            totalPrice
            status
            createdAt
            items {
                productQid
                quantity
                price
            }
        }
    }
}

# ============================================================
# 🔄 التحويرات (Mutations) المدعومة للطلبات
# ============================================================

mutation CreateOrder($input: OrderInput!) {
    createOrder(input: $input) {
        _id
        totalPrice
        status
    }
}

mutation UpdateOrderStatus($id: ID!, $status: String!) {
    updateOrderStatus(id: $id, status: $status) {
        _id
        status
        updatedAt
    }
}

mutation DeleteOrder($id: ID!) {
    deleteOrder(id: $id)
}
