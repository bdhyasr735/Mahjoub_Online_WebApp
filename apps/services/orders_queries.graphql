# ============================================================
# 📂 apps/services/orders_queries.graphql
# ============================================================
# جميع استعلامات الطلبات (Orders) مع استخدام Fragments
# لتجنب التكرار وتسهيل الصيانة.
# ============================================================

# ============================================================
# 1. FRAGMENTS (أجزاء مشتركة)
# ============================================================

# ------------------------------------------------------------
# 1.1 ملخص الطلب (للجوائب والقوائم السريعة)
# ------------------------------------------------------------
fragment OrderSummary on Order {
  _id
  type
  totalPrice
  isPaid
  createdAt
  status {
    code
    title
  }
  account {
    account {
      fullname
    }
  }
  items {
    productId
    quantity
    price
    productData {
      title
      price
      image {
        fileUrl
      }
      images {
        fileUrl
      }
    }
  }
}

# ------------------------------------------------------------
# 1.2 الطلب الكامل (كل التفاصيل للصفحة الواحدة)
# ------------------------------------------------------------
fragment OrderFull on Order {
  _id
  status {
    _id
    title
    code
  }
  COD
  type
  currency {
    _id
    title
    currencyCode
    currencySymbol
  }
  freeze
  totalPrice
  totalPriceWithTax
  priceWithShipping
  shippingPrice
  handel
  taxAmount
  taxType
  taxValue
  taxLines {
    title
    amountType
    value
    amount
    base
  }
  paymentMethod {
    _id
    payment {
      _id
      key
      descreption
      installed
      enable
      deleted
      schema
      createdAt
      updatedAt
      icon
      iconUrl
      needConfig
      methods
      name
      instructions
      id
    }
    enable
    unable
    action
    install
    deleted
    complete
    createdAt
    updatedAt
    data
  }
  market {
    _id
    app
    title
    status
    countryIds {
      _id
      name
      image {
        image
        imageUrl
      }
      code
      continent
      capital
      active
      deleted
      phonekey
    }
    countryCodes
    targetCurrency {
      _id
      title
      currencyCode
      currencySymbol
    }
    targetCurrencyId {
      _id
      title
      currencyCode
      currencySymbol
    }
    targetCurrencyCode
    enableRounding
    localCurrencies
    fxMode
    exchangeRate
    providerName
    lastUpdated
    history {
      rate
      updatedAt
    }
    createdAt
    updatedAt
  }
  marketSnapshot
  shippingAddress {
    _id
    country {
      _id
      name
      code
      continent
      capital
      active
      deleted
      phonekey
    }
    city {
      _id
      name
      description
      active
      deleted
      isSelected
      createdAt
    }
    street
    neighborhood
    zipCode
    description
    device
    deleted
    createdAt
    updatedAt
  }
  app
  isPaid
  isFastOrder
  createdAt
  salesLead {
    _id
    firstName
    lastName
    district
    street
    phone1
    phone2
    email
  }
  account {
    _id
    app
    account {
      _id
      fullname
      phone
      type
      verified
      blocked
      blockedReason
      status
      avatarUrl
      createdAt
      updatedAt
    }
    verified
    blocked
    orderCount
    lastSeen
    createdAt
    updatedAt
  }
  items {
    _id
    orderId
    productId
    variantId
    productData {
      title
      slug
      app
      image {
        _id
        fileUrl
      }
      price
    }
    variantData {
      price
      compareAtPrice
      options {
        _id
        option {
          _id
          name
          type
          product
        }
        label
        sortOrder
      }
    }
    quantity
    weight
    price
    compareAtPrice
    totalPrice
    totalCompareAtPrice
    totalSavings
  }
}

# ============================================================
# 2. QUERIES (الاستعلامات)
# ============================================================

# ------------------------------------------------------------
# 2.1 استعلام أساسي (ملخص) - يعيد الحقول مباشرة
#    يقابل الاستعلام الأول في مشاركتك
# ------------------------------------------------------------
query FindOrderByIdBasic($id: ID!) {
  findOrderById(id: $id) {
    ...OrderSummary
  }
}

# ------------------------------------------------------------
# 2.2 استعلام مفصل (كامل) - يعيد { data, success, message }
#    يقابل الجزء الأول من الاستعلام الثاني في مشاركتك
# ------------------------------------------------------------
query FindOrderByIdFull($id: ID!) {
  findOrderById(id: $id) {
    data {
      ...OrderFull
    }
    success
    message
  }
}

# ------------------------------------------------------------
# 2.3 جلب قائمة الطلبات (ملخص مع Pagination)
#    يقابل الاستعلام الثالث (FindAllOrders) في مشاركتك
# ------------------------------------------------------------
query FindAllOrdersBasic($input: FindAllOrdersInput!) {
  findAllOrders(input: $input) {
    data {
      ...OrderSummary
    }
    pagination {
      totalItems
      totalPages
      currentPage
      limit
      hasNextPage
    }
  }
}

# ------------------------------------------------------------
# 2.4 جلب قائمة الطلبات (كامل مع Success و Pagination)
#    يقابل الجزء الثاني من الاستعلام الثاني في مشاركتك
# ------------------------------------------------------------
query FindAllOrdersFull($input: FindAllOrdersInput!) {
  findAllOrders(input: $input) {
    success
    data {
      ...OrderFull
    }
    pagination {
      totalItems
      totalPages
      currentPage
      limit
      hasNextPage
    }
  }
}

# ------------------------------------------------------------
# 2.5 جلب طلبات متعددة بواسطة IDs (كامل مع Pagination)
#    يقابل الجزء الثالث من الاستعلام الثاني في مشاركتك
# ------------------------------------------------------------
query GetOrdersByIdsFull($input: FindOrdersByIdsInput!) {
  getOrdersByIds(input: $input) {
    success
    data {
      ...OrderFull
    }
    pagination {
      totalItems
      hasPreviousPage
      totalPages
      currentPage
      limit
      hasNextPage
    }
  }
}

# ------------------------------------------------------------
# 2.6 الاستعلام المُجمَّع (الاستعلام الضخم الأصلي)
#    يجلب البيانات الثلاث معاً في طلب واحد،
#    مع الحفاظ على نفس أسماء المتغيرات الأصلية
#    (للتوافق مع الكود القديم إن احتجت)
# ------------------------------------------------------------
query GetOrdersAggregated(
  $findOrderByIdId: ID!,
  $findAllOrdersInput2: FindAllOrdersInput,
  $getOrdersByIdsInput2: FindOrdersByIdsInput!
) {
  findOrderById(id: $findOrderByIdId) {
    data {
      ...OrderFull
    }
    success
    message
  }
  findAllOrders(input: $findAllOrdersInput2) {
    success
    data {
      ...OrderFull
    }
    pagination {
      totalItems
      totalPages
      currentPage
      limit
      hasNextPage
    }
  }
  getOrdersByIds(input: $getOrdersByIdsInput2) {
    success
    data {
      ...OrderFull
    }
    pagination {
      totalItems
      hasPreviousPage
      totalPages
      currentPage
      limit
      hasNextPage
    }
  }
}
