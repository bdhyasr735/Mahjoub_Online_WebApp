"""
خدمة الطلبات - Order Service Queries (نسخة متطابقة 100% مع السكيما)
"""

# ============================================================
# ✅ استعلامات الطلبات
# ============================================================

query FindAllOrders($input: FindAllOrdersInput) {
    findAllOrders(input: $input) {
        data {
            _id
            totalPrice
            status {
                _id
                title
                code
            }
            isPaid
            account {
                name
            }
            createdAt
            items {
                productId
                quantity
                price
            }
        }
        pagination {
            totalItems
            totalPages
            currentPage
            limit
            hasNextPage
        }
    }
}

query FindOrderById($id: ID!) {
    findOrderById(id: $id) {
        _id
        totalPrice
        status {
            _id
            title
            code
        }
        isPaid
        account {
            name
        }
        createdAt
        items {
            productId
            quantity
            price
        }
    }
}

# ============================================================
# 🔄 التحويرات (Mutations) المدعومة للطلبات
# ============================================================

mutation CreateOrder($input: OrderInput!) {
    createOrder(input: $input) {
        _id
        totalPrice
        status
    }
}

mutation UpdateOrderStatus($id: ID!, $status: String!) {
    updateOrderStatus(id: $id, status: $status) {
        _id
        status
        updatedAt
    }
}

mutation DeleteOrder($id: ID!) {
    deleteOrder(id: $id)
}
