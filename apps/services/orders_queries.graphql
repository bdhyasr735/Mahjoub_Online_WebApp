"""
خدمة الطلبات - Order Service Queries (نسخة مصححة)
"""

# ============================================================
# ✅ استعلامات الطلبات
# ============================================================

query GetOrder($qid: ID!) {
    order(qid: $qid) {
        _id
        totalPrice
        status
        createdAt
        items {
            productQid
            quantity
            price
        }
    }
}

query FindAllOrders($input: FindAllOrdersInput) {
    findAllOrders(input: $input) {
        data {
            _id
            totalPrice
            status
            createdAt
            items {
                productQid
                quantity
                price
            }
        }
        pagination {
            totalItems
            totalPages
            currentPage
            limit
            hasNextPage
        }
    }
}

# ============================================================
# 🔄 التحويرات (Mutations) المدعومة للطلبات
# ============================================================

mutation CreateOrder($input: OrderInput!) {
    createOrder(input: $input) {
        _id
        totalPrice
        status
    }
}

mutation UpdateOrderStatus($qid: ID!, $status: String!) {
    updateOrderStatus(qid: $qid, status: $status) {
        _id
        status
        updatedAt
    }
}

mutation DeleteOrder($qid: ID!) {
    deleteOrder(qid: $qid)
}
