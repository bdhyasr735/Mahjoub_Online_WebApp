# 📂 apps/services/orders_queries.graphql

# ============================================================
# ✅ 1. استعلام جلب كافة الطلبات (FindAllOrders)
# ============================================================
query FindAllOrders($input: FindAllOrdersInput) {
    findAllOrders(input: $input) {
        data {
            _id
            type
            totalPrice
            isPaid
            createdAt
            status {
                _id
                title
                code
            }
            account {
                account {
                    fullname
                }
            }
            items {
                productId
                quantity
                price
                productData {
                    title
                    slug
                }
            }
        }
        pagination {
            totalItems
            totalPages
            currentPage
            limit
            hasNextPage
        }
    }
}

# ============================================================
# 🔍 2. استعلام تفاصيل طلب محدد لبطاقة العرض (FindOrderById)
# ============================================================
query FindOrderById($id: ID!) {
    findOrderById(id: $id) {
        data {
            _id
            type
            COD
            isPaid
            isFastOrder
            createdAt
            totalPrice
            totalPriceWithTax
            shippingPrice
            taxAmount
            status {
                _id
                title
                code
            }
            currency {
                currencyCode
                currencySymbol
            }
            shippingAddress {
                street
                neighborhood
                description
                city {
                    name
                }
                country {
                    name
                }
            }
            salesLead {
                firstName
                lastName
                phone1
                phone2
                email
            }
            account {
                account {
                    fullname
                    phone
                    avatarUrl
                }
            }
            items {
                _id
                productId
                quantity
                price
                totalPrice
                productData {
                    title
                    slug
                    image {
                        fileUrl
                    }
                }
            }
        }
        success
        message
    }
}

# ============================================================
# 🔄 3. التحويرات (Mutations) المدعومة للطلبات
# ============================================================

# تغيير حالة الطلب
mutation ChangeOrderStatus($id: ID!, $status: String!) {
    changeOrderStatus(id: $id, status: $status) {
        _id
        status {
            _id
            code
            title
        }
    }
}

# إنشاء طلب جديد
mutation CreateOrder($input: OrderInput!) {
    createOrder(input: $input) {
        _id
        totalPrice
    }
}

# حذف طلب
mutation DeleteOrder($id: ID!) {
    deleteOrder(id: $id)
}
