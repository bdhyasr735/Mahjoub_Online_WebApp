# ============================================
# 3. استعلام جلب حالة المنتج
# ============================================
query FindProductStatus {
  findProductStatus {
    id
    qid
    name
    status
    isActive
    isAvailable
    isPublished
    isDraft
    isArchived
    createdAt
    updatedAt
  }
}

# ============================================
# 4. استعلام جلب المنتجات الأكثر مشاهدة
# ============================================
query FindTopViewedProducts {
  FindTopViewedProducts {
    id
    qid
    name
    price
    compareAtPrice
    views
    mainImage {
      url
      altText
    }
    ratings {
      average
      count
    }
  }
}

# ============================================
# 5. تعديل بيانات منتج (Mutation)
# ============================================
mutation UpdateProduct($input: UpdateProductInput!) {
  updateProduct(input: $input) {
    id
    qid
    name
    description
    price
    compareAtPrice
    costPerItem
    status
    isActive
    isAvailable
    quantity
    sku
    barcode
    updatedAt
  }
}
