# 3. جلب حالة المنتج
query FindProductStatus {
  findProductStatus {
    id
    qid
    name
    status
    isActive
    isAvailable
    isPublished
    isDraft
    isArchived
    createdAt
    updatedAt
  }
}

# 4. جلب المنتجات الأكثر مشاهدة
query FindTopViewedProducts {
  FindTopViewedProducts {
    id
    qid
    name
    price
    compareAtPrice
    views
    mainImage {
      url
      altText
    }
    ratings {
      average
      count
    }
  }
}

# 5. جلب جميع المتغيرات لمنتج
query FindAllVariantsByProductId($productId: ID!) {
  findAllVariantsByProductId(productId: $productId) {
    id
    qid
    sku
    barcode
    price
    compareAtPrice
    costPerItem
    quantity
    weight
    weightUnit
    position
    isActive
    isAvailable
    
    options {
      id
      name
      value
      position
    }
    
    image {
      id
      url
      altText
      width
      height
    }
    
    inventory {
      id
      quantity
      available
      reserved
      location
      warehouse
    }
    
    product {
      id
      qid
      name
      mainImage {
        url
        altText
      }
    }
  }
}

