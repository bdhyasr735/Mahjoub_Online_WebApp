<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محجوب أونلاين | البوابة السيادية الإدارية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a0b2e 0%, #0d0517 100%);
        }
        .royal-glow {
            box-shadow: 0 0 25px rgba(99, 44, 143, 0.4);
        }
        .gold-border {
            border-color: #D4AF37;
        }
        .gold-text {
            color: #D4AF37;
        }
        .gold-bg {
            background-color: #D4AF37;
        }
        .gold-hover:hover {
            background-color: #c19b2e;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Brand Header / Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-[#632C8F]/20 border-2 gold-border mb-4 royal-glow">
                <i class="fas fa-shield-alt text-4xl gold-text"></i>
            </div>
            <h1 class="text-3xl font-black text-white tracking-wide">محجوب أونلاين</h1>
            <p class="text-sm text-purple-300 mt-1 font-semibold">بوابة القيادة السيادية الإدارية</p>
        </div>

        <!-- Login Card -->
        <div class="bg-[#150824]/90 backdrop-blur-md rounded-2xl p-8 border border-purple-900/50 royal-glow">
            
            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-6 p-4 rounded-xl text-sm font-semibold flex items-center gap-3 {% if category == 'danger' or category == 'error' %}bg-red-500/10 border border-red-500/30 text-red-400{% else %}bg-green-500/10 border border-green-500/30 text-green-400{% endif %}">
                            <i class="fas {% if category == 'danger' or category == 'error' %}fa-exclamation-circle{% else %}fa-check-circle{% endif %} text-lg"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Dynamic Error Alert Box (for AJAX) -->
            <div id="error-alert" class="hidden mb-6 p-4 rounded-xl text-sm font-semibold flex items-center gap-3 bg-red-500/10 border border-red-500/30 text-red-400">
                <i class="fas fa-exclamation-circle text-lg"></i>
                <span id="error-message"></span>
            </div>

            <!-- Login Form -->
            <form id="login-form" method="POST" class="space-y-6">
                <!-- CSRF Token if needed, handled globally or via header -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div>
                    <label class="block text-xs font-bold text-purple-200 uppercase tracking-wider mb-2">اسم المستخدم الإداري</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-purple-400">
                            <i class="fas fa-user-shield"></i>
                        </span>
                        <input type="text" id="username" name="username" required autocomplete="username"
                            class="w-full pr-12 pl-4 py-3 bg-[#0d0517] border border-purple-900/60 rounded-xl text-white placeholder-purple-500/50 focus:outline-none focus:border-[#D4AF37] transition-all font-medium text-sm"
                            placeholder="أدخل اسم المستخدم">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-purple-200 uppercase tracking-wider mb-2">كلمة المرور</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-purple-400">
                            <i class="fas fa-key"></i>
                        </span>
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                            class="w-full pr-12 pl-12 py-3 bg-[#0d0517] border border-purple-900/60 rounded-xl text-white placeholder-purple-500/50 focus:outline-none focus:border-[#D4AF37] transition-all font-medium text-sm"
                            placeholder="••••••••">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 left-0 pl-4 flex items-center text-purple-400 hover:text-white transition-colors">
                            <i id="toggle-icon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full py-3.5 gold-bg text-[#1a0b2e] font-black rounded-xl gold-hover transition-all shadow-lg flex items-center justify-center gap-2 text-base tracking-wide">
                    <span>تسجيل الدخول السيادي</span>
                    <i class="fas fa-arrow-left text-sm"></i>
                </button>
            </form>
        </div>

        <!-- Footer Note -->
        <div class="text-center mt-6">
            <p class="text-xs text-purple-400/70 font-medium">منصة محجوب أونلاين © جميع الحقوق محفوظة</p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggle-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // AJAX Form Submission to prevent 400 errors and handle JSON/Redirect gracefully
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const csrfToken = document.querySelector('input[name="csrf_token"]').value;
            const errorAlert = document.getElementById('error-alert');
            const errorMessage = document.getElementById('error-message');
            const submitBtn = document.getElementById('submit-btn');

            errorAlert.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

            try {
                const response = await fetch(window.location.href, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken,
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ username, password })
                });

                const contentType = response.headers.get("content-type");
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    const data = await response.json();
                    if (response.ok && data.success) {
                        window.location.href = data.redirect_url || '/dashboard';
                    } else {
                        errorMessage.textContent = data.message || 'حدث خطأ أثناء تسجيل الدخول';
                        errorAlert.classList.remove('hidden');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<span>تسجيل الدخول السيادي</span><i class="fas fa-arrow-left text-sm"></i>';
                    }
                } else {
                    // If server returned HTML (standard form submission fallback)
                    window.location.reload();
                }
            } catch (err) {
                errorMessage.textContent = 'تعذر الاتصال بالخادم، يرجى المحاولة لاحقاً';
                errorAlert.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>تسجيل الدخول السيادي</span><i class="fas fa-arrow-left text-sm"></i>';
            }
        });
    </script>
</body>
</html>
