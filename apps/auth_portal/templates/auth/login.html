<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البوابة السيادية الإدارية | محجوب أونلاين</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: {
                            900: '#1a0b2e',
                            800: '#32145a',
                            700: '#570575',
                            600: '#632C8F',
                        },
                        gold: {
                            500: '#D4AF37',
                            600: '#b89728',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a0b2e 0%, #32145a 50%, #000000 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-royal-900/80 backdrop-blur-md border border-gold-500/30 rounded-2xl shadow-2xl p-8 text-white relative overflow-hidden">
        
        <!-- تأثير جمالي علوي -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-gold-500 to-transparent"></div>

        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gold-500 mb-2">البوابة السيادية للإدارة</h1>
            <p class="text-xs text-gray-300">محجوب أونلاين - منطقة آمنة ومحمية</p>
        </div>

        <!-- رسالة التنبيه -->
        <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm border"></div>

        <!-- نموذج تسجيل الدخول -->
        <form id="login-form" onsubmit="handleLogin(event)">
            
            <!-- الخطوة الأولى: بيانات الدخول -->
            <div id="step-credentials" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-gold-500 mb-2">اسم المستخدم الإداري</label>
                    <input type="text" id="username" required 
                        class="w-full px-4 py-3 bg-black/40 border border-royal-600 rounded-xl focus:outline-none focus:border-gold-500 text-white placeholder-gray-500 transition"
                        placeholder="أدخل اسم المستخدم">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gold-500 mb-2">كلمة المرور المشفرة</label>
                    <input type="password" id="password" required 
                        class="w-full px-4 py-3 bg-black/40 border border-royal-600 rounded-xl focus:outline-none focus:border-gold-500 text-white placeholder-gray-500 transition"
                        placeholder="••••••••••••">
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full py-3 px-4 bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-600 hover:to-gold-500 text-royal-900 font-bold rounded-xl shadow-lg transition transform active:scale-95">
                    التحقق من البيانات
                </button>
            </div>

            <!-- الخطوة الثانية: رمز التحقق الثنائي OTP -->
            <div id="step-otp" class="space-y-5 hidden">
                <div class="text-center">
                    <p class="text-sm text-gray-300 mb-4">تم إرسال رمز التحقق السيادي (OTP)، يرجى إدخاله للمتابعة.</p>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gold-500 mb-2">رمز التحقق (OTP)</label>
                    <input type="text" id="otp_code" maxlength="6"
                        class="w-full px-4 py-3 bg-black/40 border border-royal-600 rounded-xl focus:outline-none focus:border-gold-500 text-center text-2xl tracking-widest text-gold-500 placeholder-gray-600 transition"
                        placeholder="123456">
                </div>

                <button type="submit" id="otp-btn"
                    class="w-full py-3 px-4 bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-600 hover:to-gold-500 text-royal-900 font-bold rounded-xl shadow-lg transition transform active:scale-95">
                    تأكيد المصادقة والدخول
                </button>
            </div>

        </form>

        <div class="mt-8 text-center text-[10px] text-gray-500">
            جميع الحقوق محفوطة لمنصة محجوب أونلاين السيادية &copy; 2026
        </div>
    </div>

    <script>
        let currentStep = 'credentials';
        let cachedUsername = '';

        async function handleLogin(event) {
            event.preventDefault();
            const alertBox = document.getElementById('alert-box');
            alertBox.classList.add('hidden');

            if (currentStep === 'credentials') {
                cachedUsername = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const btn = document.getElementById('submit-btn');
                
                btn.disabled = true;
                btn.innerText = 'جاري التحقق...';

                try {
                    const response = await fetch(window.location.pathname, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ step: 'credentials', username: cachedUsername, password: password })
                    });
                    
                    const data = await response.json();

                    if (response.ok && data.status === 'require_otp') {
                        document.getElementById('step-credentials').classList.add('hidden');
                        document.getElementById('step-otp').classList.remove('hidden');
                        currentStep = 'verify_otp';
                        showAlert(data.message, 'success');
                    } else {
                        showAlert(data.message || 'حدث خطأ في بيانات الدخول.', 'error');
                    }
                } catch (err) {
                    showAlert('تعذر الاتصال بالخادم السيادي.', 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'التحقق من البيانات';
                }

            } else if (currentStep === 'verify_otp') {
                const otpCode = document.getElementById('otp_code').value;
                const btn = document.getElementById('otp-btn');

                btn.disabled = true;
                btn.innerText = 'جاري المصادقة...';

                try {
                    const response = await fetch(window.location.pathname, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ step: 'verify_otp', username: cachedUsername, otp_code: otpCode })
                    });

                    const data = await response.json();

                    if (response.ok && data.status === 'success') {
                        showAlert(data.message, 'success');
                        setTimeout(() => {
                            window.location.href = data.redirect;
                        }, 1000);
                    } else {
                        showAlert(data.message || 'رمز التحقق غير صحيح.', 'error');
                    }
                } catch (err) {
                    showAlert('تعذر الاتصال بالخادم السيادي.', 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'تأكيد المصادقة والدخول';
                }
            }
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alert-box');
            alertBox.classList.remove('hidden', 'bg-emerald-950/80', 'border-emerald-500', 'text-emerald-300', 'bg-rose-950/80', 'border-rose-500', 'text-rose-300');
            
            if (type === 'success') {
                alertBox.classList.add('bg-emerald-950/80', 'border-emerald-500', 'text-emerald-300');
            } else {
                alertBox.classList.add('bg-rose-950/80', 'border-rose-500', 'text-rose-300');
            }
            alertBox.innerText = message;
        }
    </script>
</body>
</html>
