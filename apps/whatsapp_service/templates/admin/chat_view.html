<!-- Chat View Jinja2 Component -->
<div class="flex-1 flex overflow-hidden w-full h-full">
  <!-- Contacts list sidebar -->
  <div class="w-80 bg-white border-l border-slate-200 flex flex-col shrink-0">
    <div class="p-4 border-b border-slate-100 flex items-center justify-between">
      <h2 class="text-sm font-bold text-slate-800">محادثات العملاء النشطة</h2>
      <button class="bg-emerald-600 text-white text-xs px-2.5 py-1.5 rounded-lg font-bold">
        + محادثة جديدة
      </button>
    </div>
    <div class="flex-1 overflow-y-auto divide-y divide-slate-100">
      {% for contact in contacts|default([]) %}
      <div class="p-4 hover:bg-slate-50 cursor-pointer">
        <div class="flex justify-between font-bold text-sm text-slate-900">
          <span>{{ contact.name }}</span>
          <span class="text-xs text-slate-400 font-mono">{{ contact.phone }}</span>
        </div>
        <p class="text-xs text-slate-500 truncate mt-1">{{ contact.last_message }}</p>
      </div>
      {% else %}
      <div class="p-8 text-center text-slate-400 text-xs">لا توجد محادثات نشطة حالياً</div>
      {% endfor %}
    </div>
  </div>

  <!-- Messages conversation canvas -->
  <div class="flex-1 flex flex-col bg-slate-50">
    <div class="flex-1 p-6 overflow-y-auto flex flex-col gap-4">
      <div class="text-center">
        <span class="text-xs bg-slate-200 text-slate-600 px-3 py-1 rounded-full">اليوم</span>
      </div>
      <!-- Messages stream rendered here -->
    </div>
    <div class="p-4 bg-white border-t border-slate-200 flex gap-2">
      <input type="text" placeholder="اكتب رسالتك للعميل هنا..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs">
      <button class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-xl text-xs font-bold">إرسال</button>
    </div>
  </div>
</div>
