<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>محجوب أونلاين - لوحة إدارة ومحادثات واتساب</title>
    <meta name="description" content="لوحة تحكم وإدارة واتساب لمنصة محجوب أونلاين مع Meta Cloud API و Flask" />
    
    <!-- الأيقونة -->
    <link rel="icon" type="image/webp" href="https://cdn.qumra.cloud/media/67f7f6d5f0b82f44a47bf845/1770229315912-117966978.webp" />
    
    <!-- الخطوط (Tajawal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (عبر CDN للسرعة الفورية) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              royal: {
                DEFAULT: '#570575',
                dark: '#1a0b2e',
                light: '#632C8F',
              },
              gold: '#D4AF37'
            },
            fontFamily: {
              sans: ['Tajawal', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- HTMX للتفاعل السريع واللحظي -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  </head>
  
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white h-screen overflow-hidden flex flex-col font-sans">

    <!-- شريط العلوى (Header) لهوية محجوب أونلاين -->
    <header class="bg-[#1a0b2e] border-b border-[#570575]/40 text-white px-6 py-3 flex items-center justify-between shadow-md">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#570575] to-[#D4AF37] flex items-center justify-center font-black text-white shadow-inner">
          م
        </div>
        <div>
          <h1 class="font-extrabold text-base tracking-wide text-white">محجوب أونلاين</h1>
          <span class="text-[11px] text-[#D4AF37] font-medium">نظام إدارة محادثات واتساب الذكي</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs text-slate-300">متصل بـ Meta Cloud API</span>
      </div>
    </header>

    <!-- الحاوية الأساسية للوحة التحكم -->
    <main class="flex-1 overflow-hidden">
      <!-- هنا يتم حقن محتوى لوحة المحادثات عبر قالب جينجا أو HTMX -->
      <div id="root" class="h-full w-full flex">
        {% block content %}{% endblock %}
      </div>
    </main>

  </body>
</html>
