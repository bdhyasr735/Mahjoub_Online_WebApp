<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز المراسلات والدعم | منصة محجوب أونلاين</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-100 h-screen overflow-hidden flex" dir="rtl">

  <!-- القائمة الجانبية (Sidebar) على اليمين بلون مستوحى من هويتك البنفسجية -->
  <aside class="w-20 bg-[#1a0b2e] border-l border-purple-900/50 flex flex-col items-center py-6 gap-8 shrink-0 shadow-lg">
    <!-- الشعار -->
    <div class="w-12 h-12 rounded-xl bg-white/10 p-1 flex items-center justify-center border border-[#D4AF37]/30 shadow-sm overflow-hidden">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQCm47_tKjb9Qhn6mPX1sd0qGSuGPXs8R8TgcOWlnf5AnEjRUps" alt="محجوب أونلاين" class="w-full h-full object-contain">
    </div>
    
    <!-- الأيقونات الثلاث -->
    <nav class="flex flex-col gap-4 w-full px-3">
      <!-- المحادثات المباشرة -->
      <a href="{{ url_for('whatsapp_service.chat_dashboard') }}" title="المحادثات المباشرة" class="p-3 rounded-2xl transition-all flex items-center justify-center {{ 'bg-[#570575] text-white shadow-md border border-[#D4AF37]/30' : 'text-purple-300 hover:bg-purple-900/50 hover:text-white' }}">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
      </a>
      
      <!-- سجل الرسائل -->
      <a href="{{ url_for('whatsapp_service.logs_dashboard') }}" title="سجل الرسائل" class="p-3 rounded-2xl transition-all flex items-center justify-center {{ 'bg-[#570575] text-white shadow-md border border-[#D4AF37]/30' : 'text-purple-300 hover:bg-purple-900/50 hover:text-white' }}">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
      </a>
      
      <!-- إعدادات الربط -->
      <a href="{{ url_for('whatsapp_service.settings_dashboard') }}" title="إعدادات الربط" class="p-3 rounded-2xl transition-all flex items-center justify-center {{ 'bg-[#570575] text-white shadow-md border border-[#D4AF37]/30' : 'text-purple-300 hover:bg-purple-900/50 hover:text-white' }}">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
      </a>
    </nav>
  </aside>

  <!-- المحتوى الرئيسي -->
  <main class="flex-1 h-full overflow-hidden flex flex-col">
    {% if active_tab == 'chat' %}
      {% include 'admin/chat_view.html' %}
    {% elif active_tab == 'logs' %}
      {% include 'admin/logs_view.html' %}
    {% elif active_tab == 'settings' %}
      {% include 'admin/settings_view.html' %}
    {% endif %}
  </main>

</body>
</html>
