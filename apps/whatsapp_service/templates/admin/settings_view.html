<!-- Settings View Jinja2 Component -->
<div class="max-w-4xl mx-auto w-full p-6 space-y-6 overflow-auto">
  <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs">
    <h2 class="text-base font-bold text-slate-900"><i class="fas fa-plug ml-2"></i>إعدادات ربط Meta WhatsApp Cloud API</h2>
    <p class="text-xs text-slate-500 mt-1">تكوين المتغيرات ورابط الـ Webhook الخاص بمتجر محجوب أونلاين</p>
  </div>

  <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs space-y-5">
    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1.5">Webhook Callback URL:</label>
      <input type="text" readonly value="{{ request.host_url }}admin/whatsapp/webhook" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 font-mono text-xs text-emerald-800" dir="ltr">
      <p class="text-[10px] text-slate-400 mt-1">يجب إدخال هذا الرابط في لوحة مطوري ميتا</p>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1.5">Verify Token:</label>
      <input type="text" readonly value="{{ config.get('WHATSAPP_VERIFY_TOKEN', 'mahgoob_webhook_secret_2026') }}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 font-mono text-xs text-emerald-800" dir="ltr">
      <p class="text-[10px] text-slate-400 mt-1">رمز التحقق المستخدم في مرحلة Handshake</p>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1.5">رقم الهاتف المرتبط:</label>
      <input type="text" readonly value="{{ config.get('WHATSAPP_PHONE_NUMBER_ID', '+966 50 000 0000') }}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 font-mono text-xs text-slate-700" dir="ltr">
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1.5">حالة الربط:</label>
      <span class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700">
        <span class="w-2 h-2 ml-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
        متصل بـ Meta Cloud API
      </span>
    </div>

    <div class="border-t border-slate-100 pt-4 mt-2">
      <p class="text-[10px] text-slate-400">
        <i class="fas fa-info-circle ml-1"></i> 
        للتأكد من صحة الإعدادات، تأكد من تفعيل الـ Webhook في 
        <a href="https://developers.facebook.com/apps/" target="_blank" class="text-emerald-600 hover:underline">لوحة مطوري ميتا</a>
      </p>
    </div>
  </div>
</div>
