<div class="flex-1 flex flex-col h-full bg-white p-6 overflow-y-auto">
  <h3 class="font-bold text-sm text-slate-900 mb-2">إعدادات ربط Meta WhatsApp API</h3>
  <p class="text-xs text-slate-500 mb-6">قم بإدارة وتحديث بيانات الاعتماد الخاصة بحساب الأعمال على ميتا.</p>
  
  <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 max-w-xl">
    <!-- ✅ نموذج POST عادي (بدون AJAX) -->
    <form action="{{ url_for('whatsapp_service.settings_view') }}" method="POST">
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-700 mb-1">Phone Number ID</label>
        <input type="text" name="whatsapp_phone_number_id" value="{{ settings.phone_number_id if settings else '' }}" placeholder="أدخل معرّف رقم الهاتف" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-600 font-mono" dir="ltr">
      </div>
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-700 mb-1">WhatsApp Business Account ID</label>
        <input type="text" name="whatsapp_business_account_id" value="{{ settings.business_account_id if settings else '' }}" placeholder="أدخل معرّف حساب النشاط التجاري" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-600 font-mono" dir="ltr">
      </div>
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-700 mb-1">API Version</label>
        <input type="text" name="whatsapp_api_version" value="{{ settings.api_version if settings else 'v21.0' }}" placeholder="v21.0" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-600 font-mono" dir="ltr">
      </div>
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-700 mb-1">Access Token (Permanent / Temporary)</label>
        <textarea name="whatsapp_token" rows="3" placeholder="أدخل رمز الوصول" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-600 font-mono leading-relaxed" dir="ltr">{{ settings.access_token if settings else '' }}</textarea>
      </div>
      <div class="flex items-center gap-3">
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition-colors">حفظ الإعدادات</button>
      </div>
    </form>
  </div>
</div>
