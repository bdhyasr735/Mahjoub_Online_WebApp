<div class="flex-1 flex flex-col h-full bg-white p-6 overflow-y-auto">
  <h3 class="font-bold text-sm text-slate-900 mb-2">إعدادات ربط Meta WhatsApp API</h3>
  <p class="text-xs text-slate-500 mb-6">قم بإدخال بيانات الاعتماد الخاصة بحساب الأعمال على ميتا.</p>
  <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 max-w-xl">
    <form onsubmit="event.preventDefault(); alert('تم حفظ الإعدادات بنجاح');">
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-700 mb-1">Phone Number ID</label>
        <input type="text" name="phone_number_id" placeholder="أدخل معرّف رقم الهاتف" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-600">
      </div>
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-700 mb-1">WhatsApp Business Account ID</label>
        <input type="text" name="business_account_id" placeholder="أدخل معرّف حساب النشاط التجاري" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-600">
      </div>
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-700 mb-1">Access Token (Permanent / Temporary)</label>
        <textarea name="access_token" rows="3" placeholder="أدخل رمز الوصول" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-600"></textarea>
      </div>
      <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition-colors">حفظ الإعدادات</button>
    </form>
  </div>
</div>
