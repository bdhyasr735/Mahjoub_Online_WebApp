<!-- Settings View Jinja2 Component -->
<div class="max-w-4xl mx-auto w-full p-6 space-y-6">
  
  <!-- Title Section -->
  <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs flex items-center justify-between">
    <div>
      <h2 class="text-base font-bold text-slate-900">إعدادات ربط Meta WhatsApp Cloud API</h2>
      <p class="text-xs text-slate-500 mt-1">تكوين المتغيرات ورابط الـ Webhook الخاص بمنصة محجوب أونلاين</p>
    </div>
    <!-- API Connection Status -->
    <div class="flex items-center gap-2">
      {% if is_connected %}
        <span class="px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold">متصل بـ Meta API</span>
      {% else %}
        <span class="px-3 py-1.5 rounded-full bg-red-100 text-red-700 text-xs font-bold">غير متصل بـ Meta API</span>
      {% endif %}
    </div>
  </div>

  <!-- Settings Form -->
  <form action="{{ url_for('whatsapp_service.settings_save') }}" method="POST" class="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs space-y-4">
    
    <!-- Webhook & Verify Token (Read-Only) -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Webhook Callback URL:</label>
        <div class="flex gap-2">
          <input type="text" readonly value="{{ request.host_url }}whatsapp/webhook" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 font-mono text-xs text-emerald-800" dir="ltr">
          <button type="button" onclick="navigator.clipboard.writeText('{{ request.host_url }}whatsapp/webhook')" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 rounded-xl text-xs">نسخ</button>
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Verify Token:</label>
        <div class="flex gap-2">
          <input type="text" readonly value="{{ config.get('WHATSAPP_VERIFY_TOKEN', 'mahgoob_webhook_secret_2026') }}" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 font-mono text-xs text-emerald-800" dir="ltr">
          <button type="button" onclick="navigator.clipboard.writeText('{{ config.get('WHATSAPP_VERIFY_TOKEN', '') }}')" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 rounded-xl text-xs">نسخ</button>
        </div>
      </div>
    </div>

    <hr class="border-slate-100">

    <!-- API Config Fields (Editable) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Phone Number ID:</label>
        <input type="text" name="phone_number_id" value="{{ config.get('WHATSAPP_PHONE_NUMBER_ID', '') }}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 font-mono text-xs text-slate-800" dir="ltr" placeholder="1234567890">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Business Account ID:</label>
        <input type="text" name="business_account_id" value="{{ config.get('WHATSAPP_BUSINESS_ACCOUNT_ID', '') }}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 font-mono text-xs text-slate-800" dir="ltr" placeholder="1234567890">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Phone Number (+9665...):</label>
        <input type="text" name="whatsapp_phone_number" value="{{ config.get('WHATSAPP_PHONE_NUMBER', '') }}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 font-mono text-xs text-slate-800" dir="ltr" placeholder="+9665000000">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">API Version:</label>
        <input type="text" name="api_version" value="{{ config.get('WHATSAPP_API_VERSION', 'v21.0') }}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 font-mono text-xs text-slate-800" dir="ltr" placeholder="v21.0">
      </div>
      <div class="md:col-span-2">
        <label class="block text-xs font-bold text-slate-700 mb-1">Access Token (Secret):</label>
        <input type="password" name="access_token" value="{{ config.get('WHATSAPP_ACCESS_TOKEN', '') }}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 font-mono text-xs text-slate-800" dir="ltr" placeholder="EAAG...">
      </div>
    </div>

    <!-- Save Button -->
    <div class="pt-4 border-t border-slate-100 flex justify-end">
      <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-xl text-xs font-bold shadow-sm transition-colors">
        حفظ الإعدادات وتحديث الحالة
      </button>
    </div>
  </form>

</div>
