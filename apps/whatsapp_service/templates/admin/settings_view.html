<!-- إعدادات ربط Meta API (Settings View) -->
<div class="max-w-4xl mx-auto w-full p-6 space-y-6" dir="rtl">
  
  <!-- ترويسة الصفحة -->
  <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-xl bg-purple-50 text-[#570575] flex items-center justify-center font-bold text-xl border border-purple-100">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
      </div>
      <div>
        <h2 class="text-base font-bold text-slate-900">إعدادات ربط WhatsApp Cloud API</h2>
        <p class="text-xs text-slate-500 mt-0.5">إدارة بيانات التوثيق، رموز الوصول (Access Token)، ورابط الـ Webhook الخاص بمتجر محجوب أونلاين</p>
      </div>
    </div>
  </div>

  <!-- نموذج الإعدادات -->
  <form action="{{ url_for('whatsapp_service.save_settings') }}" method="POST" class="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs space-y-5">
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- معرف الهاتف (Phone Number ID) -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">معرف رقم الهاتف (Phone Number ID)</label>
        <input type="text" name="phone_number_id" value="{{ settings.phone_number_id|default('') }}" placeholder="مثال: 10495829..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#570575] font-mono">
      </div>

      <!-- معرف الحساب التجاري (WABA ID) -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">معرف الحساب التجاري (WhatsApp Business Account ID)</label>
        <input type="text" name="waba_id" value="{{ settings.waba_id|default('') }}" placeholder="مثال: 10293847..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#570575] font-mono">
      </div>
    </div>

    <!-- رمز الوصول الدائم أو المؤقت (Access Token) -->
    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1.5">رمز الوصول (Permanent Access Token)</label>
      <textarea name="access_token" rows="3" placeholder="EAAG..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#570575] font-mono">{{ settings.access_token|default('') }}</textarea>
    </div>

    <!-- رابط الـ Webhook ورمز التحقق -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 pt-2 border-t border-slate-100">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">رابط الـ Webhook (Callback URL)</label>
        <input type="text" readonly value="https://mahjoub-online.com/api/whatsapp/webhook" class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-500 font-mono cursor-not-allowed">
        <span class="text-[10px] text-slate-400 mt-1 block">قم بنسخ هذا الرابط ووضعه في لوحة مطوري ميتا (Meta Developers).</span>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">رمز التحقق (Verify Token)</label>
        <input type="text" name="verify_token" value="{{ settings.verify_token|default('mahjoub_secure_verify_token') }}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#570575] font-mono">
      </div>
    </div>

    <!-- زر الحفظ -->
    <div class="pt-4 flex justify-end border-t border-slate-100">
      <button type="submit" class="bg-[#570575] text-white px-6 py-2.5 rounded-xl text-xs font-bold hover:bg-[#1a0b2e] transition-colors shadow-md">
        حفظ إعدادات الربط
      </button>
    </div>

  </form>
</div>
