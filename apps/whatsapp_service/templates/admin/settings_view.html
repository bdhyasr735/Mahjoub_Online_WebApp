<!-- Settings View Jinja2 Component -->
<div class="max-w-4xl mx-auto w-full p-6 space-y-6">
  <!-- Header Card -->
  <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs flex items-center justify-between">
    <div>
      <h2 class="text-base font-bold text-slate-900">إعدادات ربط واتساب (WhatsApp API Settings)</h2>
      <p class="text-xs text-slate-500 mt-0.5">إدارة مفاتيح الربط وتوكن المصادقة الخاص بواجهة برمجة تطبيقات واتساب لمتجر محجوب أونلاين</p>
    </div>
    <div class="p-3 bg-purple-50 text-purple-700 rounded-xl">
      <i class="fas fa-cog text-xl"></i>
    </div>
  </div>

  <!-- Settings Form Card -->
  <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs">
    <form method="POST" action="{{ url_for('whatsapp_service.settings_dashboard') }}" class="space-y-5">
      
      <!-- Phone Number ID -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">معرف رقم الهاتف (Phone Number ID)</label>
        <input type="text" name="phone_number_id" value="{{ settings.phone_number_id|default('') }}" placeholder="مثال: 105938492810234" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-mono outline-none focus:border-purple-600 transition">
        <p class="text-[11px] text-slate-400 mt-1">المعرف الخاص برقم الهاتف المسجل في لوحة تحكم Meta Developer (تم ربطه بمتغيرات البيئة تلقائياً).</p>
      </div>

      <!-- WhatsApp Business Account ID (WABA ID) -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">معرف حساب تجارة واتساب (WABA ID)</label>
        <input type="text" name="whatsapp_business_id" value="{{ settings.whatsapp_business_id|default('') }}" placeholder="مثال: 112233445566778" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-mono outline-none focus:border-purple-600 transition">
      </div>

      <!-- Access Token -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">رمز الدائم للوصول (Permanent Access Token)</label>
        <textarea name="access_token" rows="3" placeholder="EAAG..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-mono outline-none focus:border-purple-600 transition">{{ settings.access_token|default('') }}</textarea>
        <p class="text-[11px] text-slate-400 mt-1">رمز المصادقة طويل الأجل المستخدم لإرسال الرسائل عبر الـ API.</p>
      </div>

      <!-- Webhook Verify Token -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">رمز التحقق من الـ Webhook (Verify Token)</label>
        <input type="text" name="verify_token" value="{{ settings.verify_token|default('mahjoub_secure_webhook_token') }}" placeholder="mahjoub_secure_verify_token" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-mono outline-none focus:border-purple-600 transition">
      </div>

      <!-- Submit Button -->
      <div class="pt-4 border-t border-slate-100 flex justify-end">
        <button type="submit" class="bg-purple-700 hover:bg-purple-800 text-white px-6 py-2.5 rounded-xl text-xs font-bold transition shadow-xs flex items-center gap-2">
          <i class="fas fa-save"></i>
          حفظ التغييرات وإحداث التفعيل
        </button>
      </div>

    </form>
  </div>
</div>
