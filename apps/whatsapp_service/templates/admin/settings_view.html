<!-- coding: utf-8 -->
<!-- 📂 apps/whatsapp_service/templates/admin/settings_view.html -->

<div class="max-w-4xl mx-auto w-full p-6 space-y-6 overflow-y-auto">
  
  <!-- رأس صفحة الإعدادات -->
  <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs flex items-center justify-between">
    <div>
      <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
        <span>إعدادات ربط Meta WhatsApp Cloud API</span>
        <span class="text-[10px] bg-amber-50 text-amber-800 font-mono px-2 py-0.5 rounded-full border border-amber-200">Configuration</span>
      </h2>
      <p class="text-xs text-slate-500 mt-1">تكوين المتغيرات ورابط الـ Webhook الخاص بمتجر محجوب أونلاين</p>
    </div>
  </div>

  <!-- صندوق الإعدادات والمتغيرات -->
  <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs space-y-5">
    
    <!-- رابط الـ Webhook -->
    <div class="space-y-1.5">
      <label class="block text-xs font-bold text-slate-700 flex items-center justify-between">
        <span>Webhook Callback URL (رابط المستقبل):</span>
        <span class="text-[10px] text-emerald-600 font-normal">مطلوب إدخاله في لوحة مطوري ميتا</span>
      </label>
      <div class="relative flex items-center">
        <input type="text" readonly value="{{ request.host_url.rstrip('/') }}/admin/whatsapp/webhook" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-mono text-xs text-emerald-800 focus:outline-none" dir="ltr">
        <button onclick="navigator.clipboard.writeText(this.previousElementSibling.value); alert('تم نسخ الرابط بنجاح!');" class="absolute left-2 bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold transition">
          <i class="fas fa-copy ml-1"></i> نسخ
        </button>
      </div>
    </div>

    <!-- رمز التحقق (Verify Token) -->
    <div class="space-y-1.5">
      <label class="block text-xs font-bold text-slate-700 flex items-center justify-between">
        <span>Verify Token (رمز التحقق الأمني):</span>
        <span class="text-[10px] text-slate-400 font-normal">متطابق مع ملفات البيئة .env</span>
      </label>
      <div class="relative flex items-center">
        <input type="text" readonly value="{{ config.get('WHATSAPP_VERIFY_TOKEN', 'mahgoob_webhook_secret_2026') }}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-mono text-xs text-emerald-800 focus:outline-none" dir="ltr">
        <button onclick="navigator.clipboard.writeText(this.previousElementSibling.value); alert('تم نسخ رمز التحقق بنجاح!');" class="absolute left-2 bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold transition">
          <i class="fas fa-copy ml-1"></i> نسخ
        </button>
      </div>
    </div>

    <!-- حالة الاتصال وبيانات الاعتماد الحالية -->
    <div class="pt-4 border-t border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-1">
        <span class="text-[11px] text-slate-400 font-bold block">معرف رقم الهاتف (Phone Number ID)</span>
        <span class="text-xs font-mono font-bold text-slate-800">مُكوّن عبر المتغيرات البيئية (Env)</span>
      </div>
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-1">
        <span class="text-[11px] text-slate-400 font-bold block">إصدار واجهة البرمجة (API Version)</span>
        <span class="text-xs font-mono font-bold text-slate-800">v20.0 (مدعوم سحابياً)</span>
      </div>
    </div>

  </div>
</div>
