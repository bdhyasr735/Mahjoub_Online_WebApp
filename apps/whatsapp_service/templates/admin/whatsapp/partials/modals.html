<!-- نافذة البروفايل (تعديل بيانات العميل) -->
<div id="profilePanel" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center">
  <div class="bg-white rounded-2xl w-96 p-6 shadow-2xl border border-slate-200 animate-fadeIn">
    <h3 class="font-bold text-sm text-slate-900 mb-4">تعديل بيانات العميل</h3>
    <form action="{{ url_for('whatsapp_service.start_new_chat') }}" method="POST">
      <div class="mb-3">
        <label class="block text-xs font-bold text-slate-700 mb-1">اسم العميل</label>
        <input type="text" name="name" value="{{ selected_contact.name if selected_contact else '' }}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-600 transition-all">
      </div>
      <div class="mb-3">
        <label class="block text-xs font-bold text-slate-700 mb-1">رقم الهاتف</label>
        <input type="text" name="phone" value="{{ selected_contact.phone if selected_contact else '' }}" required dir="ltr" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-600 transition-all">
      </div>
      <div class="flex items-center justify-end gap-2">
        <button type="button" onclick="document.getElementById('profilePanel').classList.add('hidden')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-1.5 rounded-xl text-xs font-medium transition-colors">إلغاء</button>
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-1.5 rounded-xl text-xs font-bold transition-colors">حفظ التعديلات</button>
      </div>
    </form>
  </div>
</div>

<!-- نافذة محادثة جديدة -->
<div id="newChatModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center">
  <div class="bg-white rounded-2xl w-96 p-6 shadow-2xl border border-slate-200 animate-fadeIn">
    <h3 class="font-bold text-sm text-slate-900 mb-4">بدء محادثة جديدة</h3>
    <form action="{{ url_for('whatsapp_service.start_new_chat') }}" method="POST">
      <div class="mb-3">
        <label class="block text-xs font-bold text-slate-700 mb-1">رقم الهاتف (مع رمز الدولة)</label>
        <input type="text" name="phone" placeholder="966500000000" required dir="ltr" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-600 transition-all">
      </div>
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-700 mb-1">اسم العميل</label>
        <input type="text" name="name" placeholder="اسم العميل" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-600 transition-all">
      </div>
      <div class="flex items-center justify-end gap-2">
        <button type="button" onclick="document.getElementById('newChatModal').classList.add('hidden')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-1.5 rounded-xl text-xs font-medium transition-colors">إلغاء</button>
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-1.5 rounded-xl text-xs font-bold transition-colors">بدء المحادثة</button>
      </div>
    </form>
  </div>
</div>
