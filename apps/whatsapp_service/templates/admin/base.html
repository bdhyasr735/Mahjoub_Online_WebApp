<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}سوق محجوب أونلاين - لوحة تحكم الواتساب{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #07020f; color: #f1f5f9; }
        .mahjoob-logo-img { filter: brightness(0) invert(1) drop-shadow(0 0 2px rgba(255, 255, 255, 0.7)); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#07020f] text-slate-100 min-h-screen flex flex-col selection:bg-[#9333ea] selection:text-white">
    <!-- Top Navbar in Deep Royal Violet -->
    <header class="h-16 px-4 border-b border-[#230d3c] bg-gradient-to-r from-[#120722] via-[#0e051b] to-[#120722] backdrop-blur-md flex items-center justify-between z-30 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="relative flex items-center justify-center rounded-2xl bg-gradient-to-tr from-[#9333ea]/40 via-[#7e22ce]/30 to-[#f59e0b]/40 p-1 border border-purple-400/40 w-11 h-11">
                <div class="flex h-full w-full items-center justify-center rounded-[12px] bg-[#0c0419]/90 p-1">
                    <img src="https://cdn.qumra.cloud/media/67f7f6d5f0b82f44a47bf845/1770229315912-117966978.webp" 
                         alt="لوجو سوق محجوب أونلاين" 
                         class="w-full h-full object-contain mahjoob-logo-img">
                </div>
            </div>
            <div class="flex flex-col">
                <div class="flex items-center gap-1.5">
                    <span class="text-base font-black text-white">{{ merchant_name|default("سوق محجوب أونلاين") }}</span>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40">الذكي</span>
                </div>
                <span class="text-[11px] text-purple-300/70 font-mono">Meta Cloud API v26.0 (Python Service)</span>
            </div>
        </div>

        <nav class="flex items-center gap-2">
            <a href="/admin/whatsapp/dashboard" class="px-3 py-1.5 rounded-xl bg-[#1c0c35] text-purple-200 hover:text-white text-xs font-bold border border-[#3b1767]">المحادثات المباشرة</a>
            <a href="/admin/whatsapp/templates" class="px-3 py-1.5 rounded-xl bg-[#1c0c35] text-purple-200 hover:text-white text-xs font-bold border border-[#3b1767]">قوالب ميتا</a>
            <a href="/admin/whatsapp/webhook-logs" class="px-3 py-1.5 rounded-xl bg-[#1c0c35] text-purple-200 hover:text-white text-xs font-bold border border-[#3b1767]">سجل الويب هوك</a>
            <a href="/admin/whatsapp/settings" class="px-3 py-1.5 rounded-xl bg-[#1c0c35] text-purple-200 hover:text-white text-xs font-bold border border-[#3b1767]">الإعدادات</a>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex overflow-hidden">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
