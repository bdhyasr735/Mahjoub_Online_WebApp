<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}سوق محجوب أونلاين الذكي - مركز التجار{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #f8fafc; 
            color: #1e293b; 
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .bg-primary-royal { background-color: #1e0226; }
        .text-primary-royal { color: #1e0226; }
        .border-primary-royal { border-color: #1e0226; }
        
        /* ✅ لضمان عرض الصور والفيديو بشكل صحيح */
        img, video {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
        }
        
        /* ✅ تنسيق النشط للروابط */
        .nav-link {
            padding: 0.5rem 0.875rem;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            font-weight: 700;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            text-decoration: none;
        }
        .nav-link i {
            font-size: 0.875rem;
        }
        .nav-link-active {
            background-color: #1e0226 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(30, 2, 38, 0.3);
        }
        .nav-link-inactive {
            color: #475569 !important;
            background-color: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
        }
        .nav-link-inactive:hover {
            color: #1e0226 !important;
            background-color: #f1f5f9 !important;
            border-color: #1e0226 !important;
        }
        
        /* ✅ مؤشر الإشعارات في الشريط */
        .notification-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background-color: #ef4444;
            color: white;
            font-size: 8px;
            font-weight: 700;
            border-radius: 9999px;
            padding: 1px 5px;
            min-width: 16px;
            text-align: center;
            line-height: 14px;
        }
        .nav-link {
            position: relative;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen flex flex-col antialiased selection:bg-[#1e0226] selection:text-white">
    
    <!-- إشعارات -->
    <div id="notification-container" class="fixed top-4 left-4 z-[9999] space-y-2 w-80"></div>

    <!-- الهيدر -->
    <header class="h-16 px-4 md:px-6 bg-white border-b border-slate-200 flex items-center justify-between z-30 sticky top-0 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="flex items-center justify-center rounded-2xl bg-[#1e0226] p-1.5 w-11 h-11 shadow-md">
                <img src="https://cdn.qumra.cloud/media/67f7f6d5f0b82f44a47bf845/1770229315912-117966978.webp" 
                     alt="لوجو سوق محجوب أونلاين" 
                     class="w-full h-full object-contain filter brightness-0 invert">
            </div>
            <div class="flex flex-col">
                <div class="flex items-center gap-2">
                    <span class="text-base font-extrabold text-slate-900 tracking-tight">{{ merchant_name|default("سوق محجوب أونلاين الذكي") }}</span>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-[#1e0226] text-white">مركز التجار</span>
                </div>
                <span class="text-[11px] text-slate-500 font-mono flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-[#25D366] inline-block"></span>
                    Meta Cloud API v26.0 (Live)
                </span>
            </div>
        </div>

        <nav class="flex items-center gap-1.5 md:gap-2">
            <!-- ✅ المحادثات -->
            <a href="/admin/whatsapp/dashboard" 
               class="nav-link {% if request.path == '/admin/whatsapp/dashboard' %}nav-link-active{% else %}nav-link-inactive{% endif %}">
                <i class="fa-regular fa-comment-dots"></i>
                <span>المحادثات</span>
            </a>
            
            <!-- ✅ جهات الاتصال والإرسال الجماعي (جديد) -->
            <a href="/admin/whatsapp/contacts-bulk" 
               class="nav-link {% if request.path == '/admin/whatsapp/contacts-bulk' %}nav-link-active{% else %}nav-link-inactive{% endif %}">
                <i class="fa-solid fa-address-book"></i>
                <span>جهات الاتصال</span>
            </a>

            <!-- ✅ قوالب ميتا -->
            <a href="/admin/whatsapp/templates" 
               class="nav-link {% if request.path == '/admin/whatsapp/templates' %}nav-link-active{% else %}nav-link-inactive{% endif %}">
                <i class="fa-solid fa-layer-group"></i>
                <span>القوالب</span>
            </a>

            <!-- ✅ سجل الويب هوك -->
            <a href="/admin/whatsapp/webhook-logs" 
               class="nav-link {% if request.path == '/admin/whatsapp/webhook-logs' %}nav-link-active{% else %}nav-link-inactive{% endif %}">
                <i class="fa-solid fa-rss"></i>
                <span>سجل الويب هوك</span>
            </a>

            <!-- ✅ الإعدادات -->
            <a href="/admin/whatsapp/settings" 
               class="nav-link {% if request.path == '/admin/whatsapp/settings' %}nav-link-active{% else %}nav-link-inactive{% endif %}">
                <i class="fa-solid fa-sliders"></i>
                <span>الإعدادات</span>
            </a>
        </nav>
    </header>

    <main class="flex-1 flex overflow-hidden">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
