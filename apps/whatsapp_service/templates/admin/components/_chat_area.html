{% for msg in messages %}
<div class="flex {% if msg.direction == 'inbound' %}justify-start{% else %}justify-end{% endif %}">
    <div class="max-w-[70%] px-4 py-2.5 rounded-2xl text-xs shadow-sm {% if msg.direction == 'inbound' %}bg-white text-slate-800 rounded-bl-none border border-slate-100{% else %}bg-[#570575] text-white rounded-br-none{% endif %}">
        {{ msg.content }}
        <div class="text-[9px] mt-1 opacity-60 {% if msg.direction == 'inbound' %}text-slate-400{% else %}text-white/70{% endif %} text-left">
            {{ msg.timestamp.strftime('%H:%M') }}
        </div>
    </div>
</div>
{% endfor %}
