<!-- ملف: apps/whatsapp_service/templates/admin/components/_chat_area.html -->
<div class="flex-1 bg-slate-50 flex flex-col h-full overflow-hidden">
  
  <!-- رأس المحادثة (اسم العميل النشط) -->
  <div class="px-6 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between shadow-xs z-10">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-gradient-to-br from-[#632C8F] to-[#570575] text-white font-bold flex items-center justify-center text-sm shadow-sm" id="chat-header-avatar">
        ع
      </div>
      <div>
        <h3 class="text-xs font-bold text-slate-800" id="chat-header-name">اختر محادثة</h3>
        <p class="text-[10px] text-emerald-600 flex items-center gap-1 mt-0.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          متصل الآن
        </p>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <button onclick="fetchMessages()" class="p-2 text-slate-400 hover:text-[#570575] transition-colors rounded-lg hover:bg-purple-50" title="تحديث يدوياً">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- صندوق رسائل المحادثة -->
  <div class="flex-1 overflow-y-auto p-6 space-y-4" id="chat-messages-box">
    <div class="flex flex-col items-center justify-center h-full text-slate-400 text-xs">
      <svg class="w-12 h-12 mb-2 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
      </svg>
      اختر عميلاً من القائمة الجانبية لبدء المحادثة الفورية
    </div>
  </div>

  <!-- شريط كتابة وإرسال الرسالة -->
  <div class="p-4 bg-white border-t border-slate-200">
    <div class="flex items-center gap-2">
      <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا..." 
             class="flex-1 bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-[#570575] focus:bg-white transition-all"
             onkeypress="if(event.key === 'Enter') sendMessage()">
             
      <button onclick="sendMessage()" class="bg-[#570575] hover:bg-[#632C8F] text-white px-5 py-3 rounded-xl text-xs font-bold transition-all shadow-md hover:shadow-lg flex items-center gap-2 shrink-0">
        <span>إرسال</span>
        <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
        </svg>
      </button>
    </div>
  </div>

</div>
