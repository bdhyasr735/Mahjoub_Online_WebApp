<div class="flex-1 flex flex-col h-full bg-slate-50 overflow-hidden">
  {% if contacts and contacts|length > 0 %}
    {% set client = contacts[0] %}
    
    <!-- رأس المحادثة -->
    <div class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shrink-0 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-800 font-bold flex items-center justify-center" id="active-avatar">
          {{ client.name[0] if client.name else 'ع' }}
        </div>
        <div>
          <h3 class="font-bold text-slate-800 text-sm" id="active-name">{{ client.name or client.phone_number }}</h3>
          <p class="text-[11px] text-emerald-600 font-medium">متصل الآن • <span dir="ltr" id="active-phone">{{ client.phone_number }}</span></p>
        </div>
      </div>
      <div>
        <button onclick="openTemplatesModal()" class="bg-purple-50 text-[#570575] border border-purple-200 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-purple-100 transition-colors">⚡ قوالب الرد السريع</button>
      </div>
    </div>

    <!-- صندوق استعراض الرسائل الديناميكي -->
    <div id="chat-messages-box" class="flex-1 p-6 overflow-y-auto flex flex-col gap-4">
      <div class="text-center"><span class="bg-slate-200 text-slate-600 text-[10px] px-3 py-1 rounded-full">سجل المحادثة</span></div>
    </div>

    <!-- صندوق كتابة وإرسال الرسالة -->
    <div class="bg-white border-t border-slate-200 p-4 shrink-0 flex items-center gap-3 relative">
      <div class="relative">
        <button type="button" onclick="toggleAttachmentsMenu()" class="text-slate-400 hover:text-[#570575] transition-colors p-1" title="إرفاق ملف أو صورة">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </button>
      </div>
      <input type="text" id="message-input" placeholder="اكتب رسالتك للعميل هنا..." class="flex-1 bg-slate-100 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#570575]" onkeypress="if(event.key === 'Enter') sendMessage()">
      <button onclick="sendMessage()" class="bg-[#570575] text-white px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-[#1a0b2e] transition-colors flex items-center gap-2 shadow-md">
        <span>إرسال</span>
        <svg class="w-4 h-4 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </button>
    </div>
  {% else %}
    <div class="flex flex-col items-center justify-center h-full text-slate-400 p-6 text-center">
      <p class="text-sm">لا توجد محادثات نشطة حالياً في النظام</p>
    </div>
  {% endif %}
</div>
