<div class="w-full bg-white border-l border-slate-200 flex flex-col h-full shrink-0">
  <div class="p-4 border-b border-slate-100 flex items-center justify-between">
    <span class="font-bold text-slate-800 text-sm">المحادثات النشطة</span>
    <span class="bg-purple-100 text-[#570575] px-2 py-0.5 rounded-full text-xs font-bold" id="contacts-count">{{ contacts|length }}</span>
  </div>
  <div class="p-3 border-b border-slate-100">
    <input type="text" id="search-contacts" placeholder="بحث..." class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-1.5 text-xs focus:outline-none" oninput="filterContacts(this.value)">
  </div>
  <div class="flex-1 overflow-y-auto" id="contacts-list">
    {% for c in contacts %}
    <div onclick="loadConversation('{{ c.phone_number }}', this)" 
         class="contact-item p-3 border-b border-slate-50 hover:bg-purple-50/50 cursor-pointer transition-colors flex items-center gap-3"
         data-phone="{{ c.phone_number }}">
      <div class="w-10 h-10 rounded-full bg-[#570575]/10 text-[#570575] font-bold flex items-center justify-center shrink-0">
        {{ c.name[0] if c.name else 'ع' }}
      </div>
      <div class="flex-1 min-w-0">
        <h4 class="text-xs font-bold text-slate-800 truncate">{{ c.name or c.phone_number }}</h4>
        <p class="text-[10px] text-slate-400 mt-0.5">{{ c.phone_number }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</div>

<script>
function filterContacts(query) {
    const items = document.querySelectorAll('.contact-item');
    items.forEach(item => {
        const name = item.dataset.phone;
        item.style.display = name.includes(query) ? 'flex' : 'none';
    });
}
</script>
