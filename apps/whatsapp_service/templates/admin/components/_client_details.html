<!-- ملف: apps/whatsapp_service/templates/admin/components/_client_details.html -->
<div class="w-[300px] bg-white border-r border-slate-200 h-full flex flex-col shadow-sm">
  
  <!-- الجزء العلوي: الصورة والاسم -->
  <div class="p-6 flex flex-col items-center text-center border-b border-slate-100">
    <div class="w-20 h-20 bg-gradient-to-br from-[#632C8F] to-[#570575] rounded-full flex items-center justify-center text-white text-3xl font-bold shadow-lg mb-4" id="active-avatar">
      ع
    </div>
    <h2 class="text-lg font-bold text-slate-800" id="active-name">جاري التحميل...</h2>
    <p class="text-xs text-slate-500 mt-1" id="active-phone">0000000000</p>
    
    <div class="flex gap-2 mt-4">
      <span class="px-3 py-1 bg-emerald-50 text-emerald-700 text-[10px] font-bold rounded-full border border-emerald-200">عميل نشط</span>
      <span class="px-3 py-1 bg-purple-50 text-[#570575] text-[10px] font-bold rounded-full border border-purple-200">محجوب أونلاين</span>
    </div>
  </div>

  <!-- الجزء الأوسط: التفاصيل -->
  <div class="flex-1 overflow-y-auto p-4 space-y-6">
    
    <!-- معلومات العميل -->
    <div>
      <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-3">معلومات التواصل</h3>
      <div class="space-y-3">
        <div class="flex justify-between text-xs">
          <span class="text-slate-500">حالة الربط:</span>
          <span class="text-emerald-600 font-medium">متصل</span>
        </div>
        <div class="flex justify-between text-xs">
          <span class="text-slate-500">آخر رسالة:</span>
          <span class="text-slate-800" id="last-seen">منذ دقيقة</span>
        </div>
      </div>
    </div>

    <!-- إجراءات سريعة -->
    <div>
      <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-3">إجراءات سريعة</h3>
      <div class="grid grid-cols-2 gap-2">
        <button class="p-2 bg-slate-50 hover:bg-[#570575] hover:text-white transition-colors rounded-xl border border-slate-200 text-slate-600 text-[10px] font-bold">
          عرض الطلبات
        </button>
        <button class="p-2 bg-slate-50 hover:bg-[#570575] hover:text-white transition-colors rounded-xl border border-slate-200 text-slate-600 text-[10px] font-bold">
          تعديل البيانات
        </button>
      </div>
    </div>

    <!-- ملاحظات -->
    <div>
      <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-3">ملاحظات داخلية</h3>
      <textarea class="w-full h-24 bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:border-[#570575]" placeholder="أضف ملاحظة حول العميل..."></textarea>
    </div>

  </div>

  <!-- الجزء السفلي: أزرار تحكم -->
  <div class="p-4 border-t border-slate-100">
    <button class="w-full py-2.5 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white transition-all rounded-xl text-xs font-bold border border-red-100">
      حظر العميل
    </button>
  </div>
</div>
