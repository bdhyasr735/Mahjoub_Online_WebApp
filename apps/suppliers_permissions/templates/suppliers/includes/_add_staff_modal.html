<div class="modal fade" id="addStaffModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">إضافة موظف أو مساعد جديد</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-3">
                <form id="addStaffForm">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">اسم الموظف الكامل <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" required placeholder="مثال: أحمد محمد">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">اسم المستخدم للدخول <span class="text-danger">*</span></label>
                        <input type="text" name="username" class="form-control" required placeholder="مثال: ahmed_staff">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">رقم الجوال</label>
                            <input type="text" name="phone" class="form-control" placeholder="05xxxxxxxx">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">البريد الإلكتروني</label>
                            <input type="email" name="email" class="form-control" placeholder="name@domain.com">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">الدور الأساسي</label>
                        <select name="role" class="form-select">
                            <option value="worker">موظف (صلاحيات تشغيلية محددة)</option>
                            <option value="manager">مدير مساعد (صلاحيات موسعة)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">المسمى الوظيفي المخصص</label>
                        <input type="text" name="role_title" class="form-control" value="موظف مورد" placeholder="مثال: مسؤول الشحن والتوصيل">
                    </div>
                    <div class="alert alert-info small border-0 rounded-3">
                        <i class="bi bi-info-circle-fill ms-1"></i> سيتم توليد كلمة مرور مؤقتة تلقائياً وعرضها لك فوراً عند الحفظ لتسليمها للموظف.
                    </div>
                    <div class="text-end">
                        <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">إلغاء</button>
                        <button type="submit" class="btn btn-primary px-4" style="background-color: {{ brand_color }}; border-color: {{ brand_color }};">حفظ وتوليد الحساب</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
