<div class="modal fade" id="credentialsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4 text-center">
            <div class="modal-body p-4">
                <div class="mb-3 text-success display-4"><i class="bi bi-check-circle-fill"></i></div>
                <h4 class="fw-bold mb-2">تم إنشاء الحساب بنجاح!</h4>
                <p class="text-muted small mb-4">يرجى حفظ بيانات الدخول التالية وإرسالها للموظف، فلن تظهر كلمة المرور هذه مرة أخرى:</p>
                
                <div class="bg-light p-3 rounded-4 text-start mb-4 border">
                    <div class="mb-2"><strong>اسم الموظف:</strong> <span id="credName"></span></div>
                    <div class="mb-2"><strong>اسم المستخدم:</strong> <code id="credUsername" class="text-dark bg-white px-2 py-1 rounded border"></code></div>
                    <div><strong>كلمة المرور المؤقتة:</strong> <code id="credPassword" class="text-danger bg-white px-2 py-1 rounded border fw-bold"></code></div>
                </div>

                <button type="button" class="btn btn-primary w-100 py-2 rounded-3" data-bs-dismiss="modal" style="background-color: {{ brand_color }}; border-color: {{ brand_color }};">تم، حفظ البيانات</button>
            </div>
        </div>
    </div>
</div>
