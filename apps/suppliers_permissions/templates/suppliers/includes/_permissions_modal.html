<!-- -*- coding: utf-8 -*- -->
<!-- 📂 apps/suppliers_permissions/templates/suppliers/includes/_permissions_modal.html -->
<div class="modal fade" id="permissionsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4" dir="rtl">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">تعديل صلاحيات الموظف: <span id="permStaffName" class="text-primary"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-3">
                <form id="permissionsForm" method="POST" action="">
                    <!-- حقل حماية الـ CSRF -->
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="staff_id" id="permStaffId">
                    
                    <div id="permissionsRegistryContainer" class="row g-3">
                        <!-- خيارات الصلاحيات الأساسية التي يتم عرضها مباشرة عبر الخادم أو قوالب الـ Jinja -->
                        <div class="col-md-6">
                            <div class="form-check form-switch p-3 bg-light rounded-3">
                                <input class="form-check-input ms-2" type="checkbox" name="can_manage_wallet" id="can_manage_wallet" value="y">
                                <label class="form-check-label fw-bold" for="can_manage_wallet">صلاحية المالية والمحافظ</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch p-3 bg-light rounded-3">
                                <input class="form-check-input ms-2" type="checkbox" name="can_manage_orders" id="can_manage_orders" value="y">
                                <label class="form-check-label fw-bold" for="can_manage_orders">إدارة الطلبات والشحن</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="text-end mt-4">
                        <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">إلغاء</button>
                        <button type="submit" class="btn btn-primary px-4" style="background-color: {{ brand_color }}; border-color: {{ brand_color }};">حفظ التغييرات</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
