<title>{% block title %}{{ seo.title if seo and seo.title else (page_title ~ ' | محجوب أونلاين - سوقك الذكي' if page_title else 'محجوب أونلاين | سوقك الذكي - منصة اللامركزية لحوكمة التجارة اليمنية') }}{% endblock %}</title>

<meta name="description" content="{% block meta_description %}{{ seo.description if seo and seo.description else 'محجوب أونلاين - منصة اللامركزية لحوكمة التجارة اليمنية. بوابة الموردين وموظفيهم بسعر التكلفة وبأسعار تنافسية مع لوحة تحكم مجانية وعزز مبيعاتك مع شبكة واسعة من المسوقين والشركاء.' }}{% endblock %}">

<meta name="keywords" content="{% block meta_keywords %}{{ seo.keywords if seo and seo.keywords else 'محجوب أونلاين, سوقك الذكي, حوكمة التجارة اليمنية, بوابة الموردين, شبكة المسوقين, سعر التكلفة, لوحة تحكم مجانية, المحفظة الرقمية, توريد اليمن' }}{% endblock %}">

<meta name="robots" content="{% block meta_robots %}{{ seo.robots if seo and seo.robots else 'index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1' }}{% endblock %}">

<link rel="canonical" href="{% block canonical_url %}{{ seo.canonical_url if seo and seo.canonical_url else request.base_url }}{% endblock %}">

<meta property="og:site_name" content="محجوب أونلاين - سوقك الذكي">
<meta property="og:locale" content="ar_AR">
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:title" content="{% block og_title %}{{ seo.og.title if seo and seo.og and seo.og.title else (page_title or 'محجوب أونلاين | سوقك الذكي - منصة اللامركزية لحوكمة التجارة اليمنية') }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{{ seo.og.description if seo and seo.og and seo.og.description else 'منصة اللامركزية لحوكمة التجارة اليمنية - عزز مبيعاتك مع شبكة من المسوقين، أسعار تكلفة تنافسية، ولوحة تحكم مجانية.' }}{% endblock %}">
<meta property="og:url" content="{% block og_url %}{{ seo.og.url if seo and seo.og and seo.og.url else request.url }}{% endblock %}">
<meta property="og:image" content="{% block og_image %}{{ seo.og.image if seo and seo.og and seo.og.image else 'https://cdn.qumra.cloud/media/67f7f6d5f0b82f44a47bf845/1770229315912-117966978.webp' }}{% endblock %}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% block twitter_title %}{{ seo.twitter.title if seo and seo.twitter and seo.twitter.title else (page_title or 'محجوب أونلاين | سوقك الذكي') }}{% endblock %}">
<meta name="twitter:description" content="{% block twitter_description %}{{ seo.twitter.description if seo and seo.twitter and seo.twitter.description else 'منصة اللامركزية لحوكمة التجارة اليمنية - عزز مبيعاتك مع شبكة واسعة من المسوقين والشركاء.' }}{% endblock %}">
<meta name="twitter:image" content="{% block twitter_image %}{{ seo.twitter.image if seo and seo.twitter and seo.twitter.image else 'https://cdn.qumra.cloud/media/67f7f6d5f0b82f44a47bf845/1770229315912-117966978.webp' }}{% endblock %}">

{% if seo and seo.jsonld %}
<script type="application/ld+json">
    {{ seo.jsonld|tojson|safe }}
</script>
{% else %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "محجوب أونلاين",
  "alternateName": "Mahgoub Online",
  "url": "{{ request.url_root }}",
  "description": "منصة اللامركزية لحوكمة التجارة اليمنية وبوابة الموردين وموظفيهم المعتمدة.",
  "inLanguage": "ar"
}
</script>
{% endif %}

        "@type": "Answer",
        "text": "من خلال الضغط على زر اشتراك مورد جديد، إدخال بيانات المنشأة، وتوثيق الحساب للحصول على لوحة التحكم المجانية والربط مع شبكة المسوقين."
      }

<script>

<style>
    body {
        font-family: 'Cairo', sans-serif;
        background-color: #05020a;
        color: #f8fafc;
        min-height: 100vh;
        background-image: 
            radial-gradient(circle at 50% 0%, rgba(206, 158, 73, 0.15) 0%, transparent 60%),
            radial-gradient(circle at 100% 100%, rgba(15, 7, 28, 0.9) 0%, transparent 50%);
    }
    .royal-border {
        border: 1px solid rgba(206, 158, 73, 0.3);
        box-shadow: 0 4px 25px -5px rgba(0, 0, 0, 0.6), 0 0 15px rgba(206, 158, 73, 0.08);
    }
    .royal-border:focus-within {
        border-color: #ce9e49;
        box-shadow: 0 0 20px rgba(206, 158, 73, 0.25);
    }
    .gold-gradient-text {
        background: linear-gradient(135deg, #ce9e49 0%, #fae19c 50%, #ce9e49 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .gold-btn {
        background: linear-gradient(135deg, #ce9e49 0%, #ba8b38 100%);
        color: #05020a;
        font-weight: 700;
        transition: all 0.3s ease;
    }
    .gold-btn:hover {
        background: linear-gradient(135deg, #fae19c 0%, #ce9e49 100%);
        box-shadow: 0 0 20px rgba(206, 158, 73, 0.4);
        transform: translateY(-1px);
    }
    .nav-link {
        transition: all 0.3s ease;
        position: relative;
    }
    .nav-link::after {
        content: '';
        position: absolute;
        bottom: -2px;
        right: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(135deg, #ce9e49, #fae19c);
        transition: width 0.3s ease;
    }
    .nav-link:hover::after {
        width: 100%;
    }
    .royal-card-hover {
        transition: all 0.3s ease;
    }
    .royal-card-hover:hover {
        transform: translateY(-2px);
        border-color: #ce9e49;
        box-shadow: 0 8px 30px rgba(206, 158, 73, 0.15);
    }
    .btn-gold-outline {
        background: transparent;
        border: 1px solid #ce9e49;
        color: #ce9e49;
        transition: all 0.3s ease;
    }
    .btn-gold-outline:hover {
        background: linear-gradient(135deg, #ce9e49, #ba8b38);
        color: #05020a;
    }
</style>
