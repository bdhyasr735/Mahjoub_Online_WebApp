<!-- -*- coding: utf-8 -*- -->
<!-- 📂 apps/suppliers_auth_portal/templates/suppliers_auth_portal/base.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الموردين - محجوب أونلاين</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #1a0b2e;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-gray-100">
    <div class="w-full max-w-md p-6 bg-[#25103d] rounded-2xl shadow-2xl border border-[#632C8F]">
        
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-white mb-2">مرحباً بك مجدداً</h2>
            <p class="text-sm text-gray-300">قم بتسجيل الدخول للبدء في إدارة حسابك ونشاطك التجاري بأمان تام.</p>
        </div>

        <!-- نموذج تسجيل الدخول الإنتاجي -->
        <form method="POST" action="/supplier/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-200 mb-1">اسم المستخدم أو رقم الهاتف</label>
                <input type="text" name="username" required 
                    class="w-full px-4 py-2 bg-[#1a0b2e] border border-[#632C8F] rounded-lg text-white focus:outline-none focus:border-[#D4AF37]"
                    placeholder="أدخل اسم المستخدم أو رقم الهاتف">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-200 mb-1">كلمة المرور</label>
                <input type="password" name="password" required 
                    class="w-full px-4 py-2 bg-[#1a0b2e] border border-[#632C8F] rounded-lg text-white focus:outline-none focus:border-[#D4AF37]"
                    placeholder="أدخل كلمة المرور">
            </div>

            <button type="submit" 
                class="w-full py-2.5 bg-gradient-to-r from-[#632C8F] to-[#570575] hover:from-[#7b35b0] text-white font-bold rounded-lg shadow-lg border border-[#D4AF37]/40 transition duration-200 cursor-pointer">
                تسجيل الدخول
            </button>
        </form>

        <div class="mt-6 text-center border-t border-gray-700 pt-4">
            <a href="/supplier/register" class="text-sm text-[#D4AF37] hover:underline">
                انضم إلينا (اشتراك مورد جديد)
            </a>
        </div>

    </div>
</body>
</html>
