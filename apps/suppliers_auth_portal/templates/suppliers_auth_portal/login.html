<!-- -*- coding: utf-8 -*- -->
<!-- 📂 apps/suppliers_auth_portal/templates/suppliers_auth_portal/login.html -->
{% extends "suppliers_auth_portal/base.html" %}

{% block title %}تسجيل دخول الموردين - محجوب أونلاين{% endblock %}

{% block content %}
<div class="text-center mb-6">
    <h2 class="text-2xl font-bold text-white mb-2">مرحباً بك مجدداً</h2>
    <p class="text-sm text-gray-300">قم بتسجيل الدخول للبدء في إدارة حسابك ونشاطك التجاري بأمان تام.</p>
</div>

<!-- نموذج تسجيل الدخول الإنتاجي -->
<form method="POST" action="{{ url_for('suppliers_auth.login') }}" class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-200 mb-1">اسم المستخدم أو رقم الهاتف</label>
        <input type="text" name="username" required 
            class="w-full px-4 py-2 bg-[#1a0b2e] border border-[#632C8F] rounded-lg text-white focus:outline-none focus:border-[#D4AF37]"
            placeholder="أدخل اسم المستخدم أو رقم الهاتف">
    </div>

    <div>
        <div class="flex items-center justify-between mb-1">
            <label class="block text-sm font-medium text-gray-200">كلمة المرور</label>
            <a href="{{ url_for('suppliers_auth.forgot_password') }}" class="text-xs text-[#D4AF37] hover:underline">
                هل نسيت كلمة المرور؟
            </a>
        </div>
        <input type="password" name="password" required 
            class="w-full px-4 py-2 bg-[#1a0b2e] border border-[#632C8F] rounded-lg text-white focus:outline-none focus:border-[#D4AF37]"
            placeholder="أدخل كلمة المرور">
    </div>

    <button type="submit" 
        class="w-full py-2.5 bg-gradient-to-r from-[#632C8F] to-[#570575] hover:from-[#7b35b0] text-white font-bold rounded-lg shadow-lg border border-[#D4AF37]/40 transition duration-200 cursor-pointer">
        تسجيل الدخول
    </button>
</form>

<div class="mt-6 text-center border-t border-gray-700 pt-4">
    <a href="{{ url_for('suppliers_auth.register') }}" class="text-sm text-[#D4AF37] hover:underline">
        انضم إلينا (اشتراك مورد جديد)
    </a>
</div>
{% endblock %}
