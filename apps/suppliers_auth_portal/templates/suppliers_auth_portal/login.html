{% extends "suppliers_auth_portal/base.html" %}

{% block title %}تسجيل دخول الموردين وموظفيهم | البوابة الملكية{% endblock %}

{% block content %}
<div class="w-full max-w-md mx-auto">
    <div class="bg-royalSurface/95 border border-royalGold/30 rounded-2xl p-8 sm:p-10 shadow-2xl relative">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-[#05020a] border-2 border-royalGold/50 p-2 mb-3">
                <img src="https://cdn.qumra.cloud/media/67f7f6d5f0b82f44a47bf845/1770229315912-117966978.webp" 
                     alt="محجوب أونلاين" class="w-full h-full object-contain brightness-0 invert">
            </div>
            <h2 class="text-2xl font-black gold-gradient-text">محجوب أونلاين</h2>
            <p class="text-xs text-slate-400 mt-1">بوابة الموردين وموظفيهم المعتمدة</p>
        </div>

        <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs"></div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token|default('') }}">

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">رقم الهاتف أو البريد الإلكتروني</label>
                <input type="text" id="identifier" name="identifier" required
                       placeholder="77xxxxxxx أو البريد الإلكتروني"
                       class="w-full px-4 py-3 bg-royalDark/90 border border-royalGold/30 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-royalGold">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-medium text-slate-300">كلمة المرور</label>
                    <a href="/suppliers/forgot-password" class="text-xs text-royalGold hover:underline">نسيت كلمة المرور؟</a>
                </div>
                <input type="password" id="password" name="password" required
                       placeholder="••••••••"
                       class="w-full px-4 py-3 bg-royalDark/90 border border-royalGold/30 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-royalGold">
            </div>

            <button type="submit" id="submitBtn" 
                    class="w-full py-3 gold-btn rounded-xl text-sm font-bold">
                دخول المنظومة الملكية
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-royalGold/15 text-center">
            <a href="/suppliers/register" class="text-xs text-royalGold hover:underline">
                فتح حساب واشتراك مورد جديد
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function handleLogin(event) {
    event.preventDefault();
    
    const identifier = document.getElementById('identifier').value.trim();
    const password = document.getElementById('password').value;
    const csrfToken = document.querySelector('input[name="csrf_token"]').value;
    
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    
    submitBtn.disabled = true;
    submitBtn.textContent = 'جاري التحقق...';
    
    try {
        const response = await fetch("/suppliers/login", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({
                identifier: identifier,
                password: password,
                user_type: 'supplier'
            })
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
            alertBox.className = 'mb-4 p-3 rounded-xl text-xs bg-emerald-950/80 border border-emerald-500/50 text-emerald-300';
            alertBox.textContent = 'تم تسجيل الدخول بنجاح! جاري التوجيه...';
            setTimeout(() => {
                window.location.href = data.redirect_url || '/suppliers/dashboard';
            }, 1000);
        } else {
            alertBox.className = 'mb-4 p-3 rounded-xl text-xs bg-rose-950/80 border border-rose-500/50 text-rose-300';
            alertBox.textContent = data.message || 'خطأ في تسجيل الدخول';
        }
    } catch (error) {
        alertBox.className = 'mb-4 p-3 rounded-xl text-xs bg-rose-950/80 border border-rose-500/50 text-rose-300';
        alertBox.textContent = 'خطأ في الاتصال بالخادم';
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'دخول المنظومة الملكية';
    }
}
</script>
{% endblock %}
