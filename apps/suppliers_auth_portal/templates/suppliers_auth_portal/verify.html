<!-- -*- coding: utf-8 -*- -->
<!-- 📂 apps/suppliers_auth_portal/templates/suppliers_auth_portal/verify.html -->
{% extends "suppliers_auth_portal/base.html" %}

{% title %}التحقق من الحساب - محجوب أونلاين{% endtitle %}

{% block content %}
<div class="text-center mb-6">
    <h2 class="text-2xl font-bold text-white mb-2">التحقق من رقم الهاتف</h2>
    <p class="text-sm text-gray-300">أدخل رمز التحقق المرسل إلى رقم هاتفك لإتمام عملية المصادقة بأمان.</p>
</div>

<!-- نموذج التحقق -->
<form method="POST" class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-200 mb-1">رمز التحقق (OTP)</label>
        <input type="text" name="otp_code" required autofocus autocomplete="one-time-code"
            class="w-full px-4 py-2 text-center tracking-widest text-lg bg-[#1a0b2e] border border-[#632C8F] rounded-lg text-white focus:outline-none focus:border-[#D4AF37]"
            placeholder="123456">
    </div>

    <button type="submit" 
        class="w-full py-2.5 bg-gradient-to-r from-[#632C8F] to-[#570575] hover:from-[#7b35b0] text-white font-bold rounded-lg shadow-lg border border-[#D4AF37]/40 transition duration-200">
        تأكيد الرمز
    </button>
</form>

<div class="mt-6 text-center border-t border-gray-700 pt-4">
    <a href="{{ url_for('suppliers_auth.login') }}" class="text-sm text-[#D4AF37] hover:underline">
        العودة إلى تسجيل الدخول
    </a>
</div>
{% endblock %}
