{% extends "suppliers_auth_portal/base.html" %}

{% block title %}تسجيل متجر جديد | بوابة الموردين وموظفيهم{% endblock %}

{% block content %}
<div class="w-full max-w-lg mx-auto">
    <!-- بطاقة التسجيل الملكية -->
    <div class="bg-royalSurface/95 border border-royalGold/30 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl royal-border relative overflow-hidden">
        <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-64 h-32 bg-royalGold/15 blur-3xl rounded-full pointer-events-none"></div>

        <!-- الترويسة -->
        <div class="text-center mb-6 relative z-10">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-royalDark border border-royalGold/50 text-royalGold mb-3 shadow-inner">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                </svg>
            </div>
            <h2 class="text-2xl font-black gold-gradient-text mb-1">تسجيل متجر جديد</h2>
            <p class="text-xs text-slate-400">انضم إلى بوابة الموردين وابدأ بيع منتجاتك بكل سهولة</p>
        </div>

        <!-- صندوق التنبيهات المحسّن -->
        <div id="alertBox" class="hidden mb-6 p-3.5 rounded-xl text-xs flex items-center gap-3 transition-all"></div>

        <!-- ==================== نموذج التسجيل ==================== -->
        <form id="supplierRegisterForm" onsubmit="handleRegister(event)" class="space-y-4 relative z-10" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token|default('') }}">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- اسم المتجر -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">اسم المتجر</label>
                    <div class="relative">
                        <input type="text" id="storeName" required placeholder="أدخل اسم المتجر" oninput="validateField('storeName')"
                               class="w-full px-4 py-2.5 bg-royalDark/90 border border-royalGold/30 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-royalGold focus:ring-1 focus:ring-royalGold transition-all">
                        <span id="storeNameIcon" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm font-bold hidden"></span>
                    </div>
                    <div id="storeNameError" class="text-[10px] text-rose-400 mt-1 hidden"></div>
                </div>

                <!-- اسم المالك -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">اسم المالك</label>
                    <div class="relative">
                        <input type="text" id="ownerName" required placeholder="أدخل اسم المالك الثلاثي" oninput="validateField('ownerName')"
                               class="w-full px-4 py-2.5 bg-royalDark/90 border border-royalGold/30 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-royalGold focus:ring-1 focus:ring-royalGold transition-all">
                        <span id="ownerNameIcon" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm font-bold hidden"></span>
                    </div>
                    <div id="ownerNameError" class="text-[10px] text-rose-400 mt-1 hidden"></div>
                </div>
            </div>

            <!-- العنوان -->
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">العنوان (المدينة، الشارع، التفاصيل)</label>
                <div class="relative">
                    <input type="text" id="address" required placeholder="أدخل العنوان بالتفصيل" oninput="validateField('address')"
                           class="w-full px-4 py-2.5 bg-royalDark/90 border border-royalGold/30 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-royalGold focus:ring-1 focus:ring-royalGold transition-all">
                    <span id="addressIcon" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm font-bold hidden"></span>
                </div>
                <div id="addressError" class="text-[10px] text-rose-400 mt-1 hidden"></div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- البريد الإلكتروني -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">البريد الإلكتروني</label>
                    <div class="relative">
                        <input type="email" id="email" required placeholder="name@example.com" oninput="validateField('email')" dir="ltr"
                               class="w-full px-4 py-2.5 bg-royalDark/90 border border-royalGold/30 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-royalGold focus:ring-1 focus:ring-royalGold transition-all text-right">
                        <span id="emailIcon" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm font-bold hidden"></span>
                    </div>
                    <div id="emailError" class="text-[10px] text-rose-400 mt-1 hidden"></div>
                </div>

                <!-- الهاتف -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">رقم الهاتف (آخر 9 أرقام)</label>
                    <div class="relative">
                        <input type="text" id="phone" required placeholder="7xxxxxxxx" maxlength="9" oninput="validateField('phone')" dir="ltr"
                               class="w-full px-4 py-2.5 bg-royalDark/90 border border-royalGold/30 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-royalGold focus:ring-1 focus:ring-royalGold transition-all text-right">
                        <span id="phoneIcon" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm font-bold hidden"></span>
                    </div>
                    <div id="phoneError" class="text-[10px] text-rose-400 mt-1 hidden"></div>
                </div>
            </div>

            <!-- اسم المستخدم -->
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">اسم المستخدم</label>
                <div class="relative">
                    <input type="text" id="username" required placeholder="username_store" oninput="validateField('username')" dir="ltr"
                           class="w-full px-4 py-2.5 bg-royalDark/90 border border-royalGold/30 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-royalGold focus:ring-1 focus:ring-royalGold transition-all text-right"
                           autocomplete="username">
                    <span id="usernameIcon" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm font-bold hidden"></span>
                </div>
                <div id="usernameError" class="text-[10px] text-rose-400 mt-1 hidden"></div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- كلمة المرور -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">كلمة المرور</label>
                    <div class="relative">
                        <input type="password" id="password" required minlength="8" placeholder="••••••••" oninput="validateField('password')"
                               class="w-full px-4 py-2.5 bg-royalDark/90 border border-royalGold/30 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-royalGold focus:ring-1 focus:ring-royalGold transition-all"
                               autocomplete="new-password">
                        <button type="button" onclick="togglePasswordVisibility('password', this)" class="absolute left-8 top-1/2 -translate-y-1/2 text-slate-400 hover:text-royalGold transition text-xs">
                            إظهار
                        </button>
                        <span id="passwordIcon" class="absolute left-2 top-1/2 -translate-y-1/2 text-sm font-bold hidden"></span>
                    </div>
                    <!-- مؤشر قوة كلمة المرور -->
                    <div class="mt-1.5 space-y-1">
                        <div class="flex gap-1 h-1.5 w-full bg-royalDark rounded-full overflow-hidden">
                            <div id="pwdBar1" class="w-1/4 bg-slate-700 transition-all duration-300"></div>
                            <div id="pwdBar2" class="w-1/4 bg-slate-700 transition-all duration-300"></div>
                            <div id="pwdBar3" class="w-1/4 bg-slate-700 transition-all duration-300"></div>
                            <div id="pwdBar4" class="w-1/4 bg-slate-700 transition-all duration-300"></div>
                        </div>
                    </div>
                </div>

                <!-- تأكيد كلمة المرور -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">تأكيد كلمة المرور</label>
                    <div class="relative">
                        <input type="password" id="confirmPassword" required minlength="8" placeholder="••••••••" oninput="validateField('confirmPassword')"
                               class="w-full px-4 py-2.5 bg-royalDark/90 border border-royalGold/30 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-royalGold focus:ring-1 focus:ring-royalGold transition-all"
                               autocomplete="new-password">
                        <button type="button" onclick="togglePasswordVisibility('confirmPassword', this)" class="absolute left-8 top-1/2 -translate-y-1/2 text-slate-400 hover:text-royalGold transition text-xs">
                            إظهار
                        </button>
                        <span id="confirmPasswordIcon" class="absolute left-2 top-1/2 -translate-y-1/2 text-sm font-bold hidden"></span>
                    </div>
                    <div id="confirmPasswordError" class="text-[10px] text-rose-400 mt-1 hidden"></div>
                </div>
            </div>

            <!-- زر التسجيل -->
            <button type="submit" id="btnRegister" class="w-full py-3.5 px-4 gold-btn rounded-xl text-sm font-bold flex items-center justify-center gap-2 shadow-lg transition-all hover:shadow-royalGold/30 mt-4">
                <span id="btnRegisterText">إنشاء حساب متجر جديد</span>
                <svg id="btnRegisterSpinner" class="hidden animate-spin w-4 h-4 text-black" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <!-- رابط العودة لتسجيل الدخول -->
        <div class="mt-6 pt-4 border-t border-royalGold/15 text-center text-xs">
            <a href="{{ url_for('suppliers_auth_bp.login') }}" class="text-slate-400 hover:text-royalGold transition inline-flex items-center gap-1">
                <span>←</span>
                لديك حساب بالفعل؟ تسجيل الدخول
            </a>
        </div>
    </div>
</div>

<!-- دعم بدون JavaScript -->
<noscript>
    <div class="w-full max-w-lg mx-auto mt-4 p-4 bg-amber-950/80 border border-amber-500/50 rounded-xl text-amber-200 text-center text-sm">
        ⚠️ يرجى تفعيل JavaScript لتتمكن من التسجيل بشكل آمن وتحقق الحقول اللحظي.
    </div>
</noscript>
{% endblock %}

{% block scripts %}
<script>
    (function() {
        'use strict';

        const DOM = {
            alertBox: document.getElementById('alertBox'),
            storeName: document.getElementById('storeName'),
            storeNameIcon: document.getElementById('storeNameIcon'),
            storeNameError: document.getElementById('storeNameError'),
            
            ownerName: document.getElementById('ownerName'),
            ownerNameIcon: document.getElementById('ownerNameIcon'),
            ownerNameError: document.getElementById('ownerNameError'),

            address: document.getElementById('address'),
            addressIcon: document.getElementById('addressIcon'),
            addressError: document.getElementById('addressError'),

            email: document.getElementById('email'),
            emailIcon: document.getElementById('emailIcon'),
            emailError: document.getElementById('emailError'),

            phone: document.getElementById('phone'),
            phoneIcon: document.getElementById('phoneIcon'),
            phoneError: document.getElementById('phoneError'),

            username: document.getElementById('username'),
            usernameIcon: document.getElementById('usernameIcon'),
            usernameError: document.getElementById('usernameError'),

            password: document.getElementById('password'),
            passwordIcon: document.getElementById('passwordIcon'),
            confirmPassword: document.getElementById('confirmPassword'),
            confirmPasswordIcon: document.getElementById('confirmPasswordIcon'),
            confirmPasswordError: document.getElementById('confirmPasswordError'),

            pwdBars: [
                document.getElementById('pwdBar1'),
                document.getElementById('pwdBar2'),
                document.getElementById('pwdBar3'),
                document.getElementById('pwdBar4')
            ],

            btnRegister: document.getElementById('btnRegister'),
            btnRegisterText: document.getElementById('btnRegisterText'),
            btnRegisterSpinner: document.getElementById('btnRegisterSpinner')
        };

        function showAlert(msg, details = null, isSuccess = false) {
            const box = DOM.alertBox;
            box.classList.remove('hidden');
            if (isSuccess) {
                box.className = 'mb-6 p-3.5 rounded-xl text-xs flex items-center gap-3 bg-emerald-950/90 border border-emerald-500/50 text-emerald-300 shadow-xl';
                box.innerHTML = `<div class="w-8 h-8 rounded-lg bg-emerald-900/50 border border-emerald-500/40 flex items-center justify-center shrink-0 text-emerald-400 font-bold text-lg">✓</div><div class="flex flex-col gap-0.5"><span class="font-bold text-emerald-200">${msg}</span>${details ? `<span class="text-emerald-300/90 text-[11px]">${details}</span>` : ''}</div>`;
            } else {
                box.className = 'mb-6 p-3.5 rounded-xl text-xs flex items-center gap-3 bg-rose-950/90 border border-rose-500/50 text-rose-300 shadow-xl';
                box.innerHTML = `<div class="w-8 h-8 rounded-lg bg-rose-900/50 border border-rose-500/40 flex items-center justify-center shrink-0 text-rose-400 font-bold text-lg">⚠</div><div class="flex flex-col gap-0.5"><span class="font-bold text-rose-200">${msg}</span>${details ? `<span class="text-rose-300/90 text-[11px]">${details}</span>` : ''}</div>`;
            }
        }

        function hideAlert() {
            DOM.alertBox.classList.add('hidden');
        }

        function setFieldStatus(fieldKey, isValid, errorMsg = '') {
            const input = DOM[fieldKey];
            const icon = DOM[fieldKey + 'Icon'];
            const errDiv = DOM[fieldKey + 'Error'];

            if (!input.value.trim()) {
                icon.classList.add('hidden');
                input.className = input.className.replace('border-emerald-500/50', 'border-royalGold/30').replace('border-rose-500/50', 'border-royalGold/30');
                if (errDiv) errDiv.classList.add('hidden');
                return;
            }

            icon.classList.remove('hidden');
            if (isValid) {
                icon.textContent = '✓';
                icon.className = 'absolute left-3 top-1/2 -translate-y-1/2 text-sm font-bold text-emerald-400';
                input.className = input.className.replace('border-royalGold/30', 'border-emerald-500/50').replace('border-rose-500/50', 'border-emerald-500/50');
                if (errDiv) errDiv.classList.add('hidden');
            } else {
                icon.textContent = '✗';
                icon.className = 'absolute left-3 top-1/2 -translate-y-1/2 text-sm font-bold text-rose-400';
                input.className = input.className.replace('border-royalGold/30', 'border-rose-500/50').replace('border-emerald-500/50', 'border-rose-500/50');
                if (errDiv) {
                    errDiv.textContent = errorMsg;
                    errDiv.classList.remove('hidden');
                }
            }
        }

        window.validateField = function(fieldKey) {
            const val = DOM[fieldKey].value.trim();

            if (fieldKey === 'storeName') {
                const valid = val.length >= 2;
                setFieldStatus('storeName', valid, 'اسم المتجر يجب أن يكون حرفين على الأقل.');
            } else if (fieldKey === 'ownerName') {
                const valid = val.length >= 3;
                setFieldStatus('ownerName', valid, 'اسم المالك يجب أن يكون 3 أحرف على الأقل.');
            } else if (fieldKey === 'address') {
                const valid = val.length >= 5;
                setFieldStatus('address', valid, 'يرجى إدخال العنوان بشكل مفصل.');
            } else if (fieldKey === 'email') {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const valid = emailRegex.test(val);
                setFieldStatus('email', valid, 'يرجى إدخال بريد إلكتروني صالح.');
            } else if (fieldKey === 'phone') {
                const cleanPhone = val.replace(/[^0-9]/g, '');
                const valid = cleanPhone.length === 9;
                setFieldStatus('phone', valid, 'رقم الهاتف يجب أن يتكون من 9 أرقام (مثال: 77xxxxxxx).');
            } else if (fieldKey === 'username') {
                const userRegex = /^[a-zA-Z0-9_]{3,30}$/;
                const valid = userRegex.test(val);
                setFieldStatus('username', valid, 'اسم المستخدم يجب أن يكون بالإنجليزية وأكثر من 3 خانات بدون مسافات.');
            } else if (fieldKey === 'password') {
                checkPasswordStrength(val);
            } else if (fieldKey === 'confirmPassword') {
                const valid = val.length > 0 && val === DOM.password.value;
                setFieldStatus('confirmPassword', valid, 'كلمتا المرور غير متطابقتين.');
            }
        };

        window.togglePasswordVisibility = function(fieldId, btnEl) {
            const field = document.getElementById(fieldId);
            if (!field) return;
            if (field.type === 'password') {
                field.type = 'text';
                btnEl.textContent = 'إخفاء';
            } else {
                field.type = 'password';
                btnEl.textContent = 'إظهار';
            }
        };

        function checkPasswordStrength(password) {
            const bars = DOM.pwdBars;
            let score = 0;
            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) score++;
            if (/\d/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;

            bars.forEach(b => b.className = 'w-1/4 bg-slate-700 transition-all duration-300');
            const colors = ['bg-rose-500', 'bg-amber-500', 'bg-blue-500', 'bg-emerald-500'];

            if (password.length > 0) {
                for (let i = 0; i < score; i++) {
                    bars[i].className = `w-1/4 ${colors[Math.min(score - 1, 3)]} transition-all duration-300`;
                }
                const isValid = password.length >= 8;
                setFieldStatus('password', isValid, '');
            } else {
                DOM.passwordIcon.classList.add('hidden');
            }
            if (DOM.confirmPassword.value) {
                validateField('confirmPassword');
            }
        }

        window.handleRegister = async function(e) {
            e.preventDefault();
            hideAlert();

            // فحص كافة الحقول قبل الإرسال
            ['storeName', 'ownerName', 'address', 'email', 'phone', 'username', 'password', 'confirmPassword'].forEach(k => validateField(k));

            if (DOM.password.value !== DOM.confirmPassword.value || DOM.password.value.length < 8) {
                showAlert('✗ بيانات غير صحيحة', 'يرجى مراجعة الحقول المدخلة والتأكد من مطابقة كلمات المرور واستيفائها للشروط.');
                return;
            }

            const btn = DOM.btnRegister;
            const text = DOM.btnRegisterText;
            const spinner = DOM.btnRegisterSpinner;

            btn.disabled = true;
            text.textContent = 'جاري إنشاء الحساب...';
            spinner.classList.remove('hidden');

            try {
                const form = document.getElementById('supplierRegisterForm');
                const response = await fetch('/suppliers/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': form.csrf_token.value
                    },
                    body: JSON.stringify({
                        store_name: DOM.storeName.value.trim(),
                        owner_name: DOM.ownerName.value.trim(),
                        address: DOM.address.value.trim(),
                        email: DOM.email.value.trim(),
                        phone: DOM.phone.value.trim(),
                        username: DOM.username.value.trim(),
                        password: DOM.password.value.trim(),
                        confirm_password: DOM.confirmPassword.value.trim(),
                        csrf_token: form.csrf_token.value
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showAlert('✓ تم إنشاء الحساب بنجاح', 'جاري تحويلك إلى لوحة التحكم...', true);
                    setTimeout(() => {
                        window.location.href = data.redirect_url || '/suppliers/dashboard';
                    }, 1500);
                } else {
                    showAlert('✗ تعذر إنشاء الحساب', data.message || 'حدث خطأ أثناء معالجة الطلب.');
                }
            } catch (err) {
                console.error('Registration error:', err);
                showAlert('✗ خطأ في الاتصال', 'تعذر الاتصال بالخادم. يرجى التحقق من شبكة الإنترنت والمحاولة مرة أخرى.');
            } finally {
                btn.disabled = false;
                text.textContent = 'إنشاء حساب متجر جديد';
                spinner.classList.add('hidden');
            }
        };
    })();
</script>
{% endblock %}
