<!-- apps/suppliers_auth_portal/templates/supplier/login.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الموردين - محجوب أونلاين</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #1a0b2e;
        }
        .royal-gradient {
            background: linear-gradient(135deg, #1a0b2e 0%, #3b145b 50%, #570575 100%);
        }
        .gold-border {
            border-color: #D4AF37;
        }
        .gold-text {
            color: #D4AF37;
        }
        .gold-bg {
            background-color: #D4AF37;
        }
        .gold-bg:hover {
            background-color: #c19b2e;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center royal-gradient p-4">

    <div class="w-full max-w-md bg-[#24103f] border-2 gold-border rounded-2xl shadow-2xl p-8 text-white relative overflow-hidden">
        
        <!-- عنصر تزييني هندسي متجهي (Vector) بدون أي عناصر بشرية -->
        <div class="absolute -top-12 -left-12 w-32 h-32 bg-[#632C8F] rounded-full opacity-30 blur-xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-[#D4AF37] rounded-full opacity-10 blur-xl pointer-events-none"></div>

        <!-- الهيدر والشعار -->
        <div class="text-center mb-8 relative z-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#1a0b2e] border-2 gold-border mb-4 shadow-lg">
                <i class="fas fa-store gold-text text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black gold-text tracking-wide">بوابة الموردين</h1>
            <p class="text-xs text-purple-300 mt-1">منصة محجوب أونلاين التجارية</p>
        </div>

        <!-- رسائل التنبيه والخطأ إن وجدت -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-6 space-y-2 relative z-10">
                    {% for category, message in messages %}
                        <div class="p-3 rounded-lg text-sm {% if category == 'error' %}bg-red-900/50 border border-red-500 text-red-200{% else %}bg-emerald-900/50 border border-emerald-500 text-emerald-200{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- نموذج تسجيل الدخول -->
        <form method="POST" action="{{ url_for('suppliers_bp.login') }}" class="space-y-5 relative z-10">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div>
                <label class="block text-xs font-semibold gold-text mb-2" for="username">اسم المستخدم أو رقم الهاتف</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-purple-400">
                        <i class="fas fa-user"></i>
                    </span>
                    <input class="w-full bg-[#1a0b2e] border border-purple-800 rounded-lg py-2.5 pr-10 pl-4 text-sm text-white placeholder-purple-500 focus:outline-none focus:border-[#D4AF37] transition-all" 
                           id="username" name="username" type="text" required placeholder="أدخل اسم المستخدم أو الهاتف">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold gold-text mb-2" for="password">كلمة المرور</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-purple-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input class="w-full bg-[#1a0b2e] border border-purple-800 rounded-lg py-2.5 pr-10 pl-4 text-sm text-white placeholder-purple-500 focus:outline-none focus:border-[#D4AF37] transition-all" 
                           id="password" name="password" type="password" required placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs text-purple-300">
                <label class="flex items-center cursor-pointer">
                    <input type="checkbox" name="remember" class="rounded bg-[#1a0b2e] border-purple-800 text-[#632C8F] focus:ring-0">
                    <span class="mr-2">تذكرني</span>
                </label>
                <a href="{{ url_for('suppliers_bp.forgot_password') }}" class="gold-text hover:underline">نسيت كلمة المرور؟</a>
            </div>

            <div>
                <button type="submit" class="w-full py-3 px-4 gold-bg text-[#1a0b2e] font-bold rounded-lg shadow-lg transition-all transform hover:scale-[1.01] active:scale-[0.99] flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fas fa-sign-in-alt ml-2"></i>
                    <span>تسجيل الدخول</span>
                </button>
            </div>
        </form>

        <!-- تذييل البطاقة -->
        <div class="mt-8 text-center text-xs text-purple-400 border-t border-purple-900/50 pt-4 relative z-10">
            <span>ليس لديك حساب مورد؟</span> 
            <a href="{{ url_for('suppliers_bp.register') }}" class="gold-text font-bold hover:underline mr-1">قدم طلب انضمام</a>
        </div>

    </div>

</body>
</html>
