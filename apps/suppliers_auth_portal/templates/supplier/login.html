<!-- apps/suppliers_auth_portal/templates/supplier/register.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب انضمام مورد - محجوب أونلاين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #1a0b2e; }
        .royal-gradient { background: linear-gradient(135deg, #1a0b2e 0%, #3b145b 50%, #570575 100%); }
        .gold-border { border-color: #D4AF37; }
        .gold-text { color: #D4AF37; }
        .gold-bg { background-color: #D4AF37; }
        .gold-bg:hover { background-color: #c19b2e; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center royal-gradient p-4">

    <div class="w-full max-w-lg bg-[#24103f] border-2 gold-border rounded-2xl shadow-2xl p-8 text-white relative overflow-hidden">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black gold-text">طلب انضمام مورد جديد</h1>
            <p class="text-xs text-purple-300 mt-1">انضم إلى شبكة موردي منصة محجوب أونلاين</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-5 space-y-2">
                    {% for category, message in messages %}
                        <div class="p-3 rounded-lg text-sm {% if category == 'error' %}bg-red-900/50 border border-red-500 text-red-200{% else %}bg-emerald-900/50 border border-emerald-500 text-emerald-200{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('suppliers_bp.register') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold gold-text mb-1" for="trade_name">اسم المتجر / النشاط التجاري</label>
                    <input class="w-full bg-[#1a0b2e] border border-purple-800 rounded-lg py-2 px-3 text-sm text-white placeholder-purple-500 focus:outline-none focus:border-[#D4AF37]" 
                           id="trade_name" name="trade_name" type="text" required placeholder="مثال: متجر السعادة">
                </div>
                <div>
                    <label class="block text-xs font-semibold gold-text mb-1" for="owner_name">اسم المالك الثلاثي</label>
                    <input class="w-full bg-[#1a0b2e] border border-purple-800 rounded-lg py-2 px-3 text-sm text-white placeholder-purple-500 focus:outline-none focus:border-[#D4AF37]" 
                           id="owner_name" name="owner_name" type="text" required placeholder="الاسم الكامل">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold gold-text mb-1" for="phone">رقم الهاتف (يُستخدم لتسجيل الدخول)</label>
                <input class="w-full bg-[#1a0b2e] border border-purple-800 rounded-lg py-2 px-3 text-sm text-white placeholder-purple-500 focus:outline-none focus:border-[#D4AF37]" 
                       id="phone" name="phone" type="text" required placeholder="770000000">
            </div>

            <div>
                <label class="block text-xs font-semibold gold-text mb-1" for="password">كلمة المرور</label>
                <input class="w-full bg-[#1a0b2e] border border-purple-800 rounded-lg py-2 px-3 text-sm text-white placeholder-purple-500 focus:outline-none focus:border-[#D4AF37]" 
                       id="password" name="password" type="password" required placeholder="••••••••">
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full py-3 px-4 gold-bg text-[#1a0b2e] font-bold rounded-lg shadow-lg transition-all transform hover:scale-[1.01]">
                    تقديم الطلب الآن
                </button>
            </div>
        </form>

        <div class="mt-6 text-center text-xs text-purple-400 border-t border-purple-900/50 pt-4">
            <span>لديك حساب بالفعل؟</span> 
            <a href="{{ url_for('suppliers_bp.login') }}" class="gold-text font-bold hover:underline mr-1">تسجيل الدخول</a>
        </div>

    </div>

</body>
</html>
