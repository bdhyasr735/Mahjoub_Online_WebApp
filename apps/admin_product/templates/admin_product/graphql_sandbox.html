{% extends "admin/admin_base.html" %}

{% block title %}GraphQL Sandbox | محجوب أونلاين{% endblock %}

{% block content %}
<div class="bg-light text-dark min-vh-100 d-flex flex-column p-4">
    
    <!-- عنوان الصفحة -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h4 class="fw-bold text-dark mb-0">
                <i data-lucide="beaker" class="me-2" style="width: 24px; height: 24px; color: #4A154B;"></i>
                مختبر GraphQL التفاعلي (Apollo Sandbox)
            </h4>
            <p class="text-muted small mt-1 mb-0">اختبر استعلامات وطفرات قمرة كلاود مباشرة من لوحة التحكم</p>
        </div>
    </div>

    <!-- حاوية الصندوق الرملي -->
    <div class="card border-0 shadow-sm rounded-3 overflow-hidden" style="height: 75vh; background-color: #1e1e1e;">
        
        <!-- ✅ كود التضمين الذي أخذته من الصورة الثالثة -->
        <div style="width: 100%; height: 100%;" id="embedded-sandbox"></div>
        
    </div>
</div>

<!-- ✅ سكربت التضمين من الصورة الثالثة -->
<script src="https://embeddable-sandbox.cdn.apollographql.com/v2/embeddable-sandbox.umd.production.min.js"></script>
<script>
    // تأكد من تحميل المكتبة قبل تشغيل الكود
    if (typeof window.EmbeddedSandbox !== 'undefined') {
        new window.EmbeddedSandbox({
            target: '#embedded-sandbox',
            initialEndpoint: 'https://mahjoub.online/admin/graphql',
        });
    } else {
        console.error("❌ فشل تحميل مكتبة Apollo Embeddable Sandbox.");
    }
</script>
{% endblock %}
