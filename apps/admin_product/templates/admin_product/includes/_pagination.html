<!-- Pagination Component (Bootstrap 5 Version) -->
<div class="d-flex justify-content-between align-items-center p-3 bg-white border-top">
    <div class="small text-muted">
        عرض الصفحة <span class="fw-bold text-dark">{{ pagination.page if pagination else 1 }}</span> من أصل <span class="fw-bold text-dark">{{ pagination.pages if pagination else 1 }}</span>
    </div>
    
    <div class="d-flex gap-2">
        <!-- زر السابق -->
        {% if pagination and pagination.has_prev %}
        <a href="?page={{ pagination.prev_num }}" class="btn btn-sm btn-outline-secondary bg-white border text-dark fw-bold">
            السابق
        </a>
        {% else %}
        <span class="btn btn-sm btn-light text-secondary border fw-bold opacity-50" style="cursor: not-allowed;">
            السابق
        </span>
        {% endif %}

        <!-- زر التالي -->
        {% if pagination and pagination.has_next %}
        <a href="?page={{ pagination.next_num }}" class="btn btn-sm text-white fw-bold" style="background-color: #4A154B; border-color: #4A154B;">
            التالي
        </a>
        {% else %}
        <span class="btn btn-sm btn-light text-secondary border fw-bold opacity-50" style="cursor: not-allowed;">
            التالي
        </span>
        {% endif %}
    </div>
</div>
