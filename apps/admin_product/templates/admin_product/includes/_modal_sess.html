<!-- Modal: إشعار النجاح واستجابات GraphQL (Success Notification Modal) -->
<div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4 p-3 text-center">
            <div class="modal-body p-3">
                
                <!-- أيقونة النجاح -->
                <div class="d-flex align-items-center justify-content-center mx-auto mb-3 bg-success bg-opacity-10 text-success rounded-circle" style="width: 70px; height: 70px;">
                    <i data-lucide="check-circle-2" style="width: 34px; height: 34px;"></i>
                </div>

                <!-- العنوان والنص -->
                <h4 class="fw-bold mb-1 text-dark">عملية ناجحة</h4>
                <p id="successModalText" class="text-muted small mb-4">تمت العملية بنجاح على خادم قمرة كلاود ومتجر محجوب أونلاين.</p>
                
                <!-- زر الإغلاق باستخدام لون القالب الأرجواني -->
                <button onclick="closeSuccessModal()" class="btn w-100 py-2 text-white fw-bold rounded-pill shadow-sm" style="background-color: #4A154B;">
                    تم، إغلاق النافذة
                </button>

            </div>
        </div>
    </div>
</div>

<!-- سكربت التحكم في إغلاق المودال بما يتوافق مع Bootstrap 5 -->
<script>
    function closeSuccessModal() {
        const modalEl = document.getElementById('successModal');
        if (modalEl) {
            // الحصول على كائن المودال الموجود أو إنشاء واحد جديد إذا لم يكن موجوداً
            let modal = bootstrap.Modal.getInstance(modalEl);
            if (!modal) {
                modal = new bootstrap.Modal(modalEl);
            }
            modal.hide();
        }
    }
</script>
