<!-- 📂 apps/admin_Product/templates/admin/partials/_product_main_info.html -->
<!-- معلومات المنتج الرئيسية -->

<div class="row">
    <!-- الاسم -->
    <div class="col-md-6 mb-3">
        <label for="productName" class="form-label fw-bold" style="color: #2d0b36;">
            <i class="fas fa-tag text-primary me-1"></i> اسم المنتج *
        </label>
        <input type="text" 
               id="productName" 
               name="title" 
               class="form-control form-control-lg" 
               value="{{ product.title or product.name or '' }}"
               placeholder="أدخل اسم المنتج..."
               required
               style="border-color: #2d0b36; border-radius: 8px;">
    </div>
    
    <!-- SKU -->
    <div class="col-md-3 mb-3">
        <label for="productSku" class="form-label fw-bold" style="color: #2d0b36;">
            <i class="fas fa-barcode text-info me-1"></i> SKU
        </label>
        <input type="text" 
               id="productSku" 
               name="sku" 
               class="form-control" 
               value="{{ product.sku or '' }}"
               placeholder="رمز المنتج"
               style="border-color: #2d0b36; border-radius: 8px;">
    </div>
    
    <!-- الكمية -->
    <div class="col-md-3 mb-3">
        <label for="productQuantity" class="form-label fw-bold" style="color: #2d0b36;">
            <i class="fas fa-cubes text-info me-1"></i> الكمية
        </label>
        <input type="number" 
               id="productQuantity" 
               name="quantity" 
               class="form-control" 
               min="0"
               value="{{ product.quantity or 0 }}"
               style="border-color: #2d0b36; border-radius: 8px;">
    </div>
</div>

<!-- ======================================== -->
<!-- الأسعار الثلاثة -->
<!-- ======================================== -->
<div class="row">
    <!-- السعر الأساسي -->
    <div class="col-md-4 mb-3">
        <label for="productPrice" class="form-label fw-bold" style="color: #2d0b36;">
            <i class="fas fa-dollar-sign text-success me-1"></i> السعر الأساسي *
        </label>
        <div class="input-group">
            <input type="number" 
                   id="productPrice" 
                   name="price" 
                   class="form-control" 
                   step="0.01" 
                   min="0"
                   value="{{ product.pricing.price if product.pricing and product.pricing.price is not none else 0 }}"
                   required
                   style="border-color: #2d0b36; border-radius: 8px 0 0 8px;">
            <span class="input-group-text" style="background: #2d0b36; color: #D4AF37; border: none; border-radius: 0 8px 8px 0;">ر.س</span>
        </div>
        <small class="text-muted">السعر المعروض للبيع</small>
    </div>
    
    <!-- سعر المقارنة -->
    <div class="col-md-4 mb-3">
        <label for="comparePrice" class="form-label fw-bold" style="color: #2d0b36;">
            <i class="fas fa-tag text-warning me-1"></i> سعر المقارنة
        </label>
        <div class="input-group">
            <input type="number" 
                   id="comparePrice" 
                   name="compare_price" 
                   class="form-control" 
                   step="0.01" 
                   min="0"
                   value="{{ product.pricing.compareAtPrice if product.pricing and product.pricing.compareAtPrice is not none else 0 }}"
                   style="border-color: #2d0b36; border-radius: 8px 0 0 8px;">
            <span class="input-group-text" style="background: #2d0b36; color: #D4AF37; border: none; border-radius: 0 8px 8px 0;">ر.س</span>
        </div>
        <small class="text-muted">السعر قبل الخصم (يظهر مشطوباً)</small>
    </div>
    
    <!-- سعر التكلفة -->
    <div class="col-md-4 mb-3">
        <label for="costPrice" class="form-label fw-bold" style="color: #2d0b36;">
            <i class="fas fa-coins text-secondary me-1"></i> سعر التكلفة
        </label>
        <div class="input-group">
            <input type="number" 
                   id="costPrice" 
                   name="cost_price" 
                   class="form-control" 
                   step="0.01" 
                   min="0"
                   value="{{ product.pricing.costPerItem if product.pricing and product.pricing.costPerItem is not none else 0 }}"
                   style="border-color: #2d0b36; border-radius: 8px 0 0 8px;">
            <span class="input-group-text" style="background: #2d0b36; color: #D4AF37; border: none; border-radius: 0 8px 8px 0;">ر.س</span>
        </div>
        <small class="text-muted">سعر الشراء (داخلي للمحاسبة)</small>
    </div>
</div>

<div class="row">
    <!-- الحالة -->
    <div class="col-md-6 mb-3">
        <label for="productStatus" class="form-label fw-bold" style="color: #2d0b36;">
            <i class="fas fa-circle text-warning me-1"></i> الحالة
        </label>
        <select id="productStatus" name="status" class="form-select" style="border-color: #2d0b36; border-radius: 8px;">
            <option value="DRAFT" {% if product.status|upper == 'DRAFT' %}selected{% endif %}>
                ⏳ مسودة
            </option>
            <option value="PUBLISHED" {% if product.status|upper == 'PUBLISHED' %}selected{% endif %}>
                ✅ منشور
            </option>
            <option value="REJECTED" {% if product.status|upper == 'REJECTED' %}selected{% endif %}>
                ❌ مرفوض
            </option>
            <option value="ARCHIVED" {% if product.status|upper == 'ARCHIVED' %}selected{% endif %}>
                📦 مؤرشف
            </option>
        </select>
    </div>
    
    <!-- المورد -->
    <div class="col-md-6 mb-3">
        <label for="supplierId" class="form-label fw-bold" style="color: #2d0b36;">
            <i class="fas fa-store text-purple me-1"></i> المورد
        </label>
        <select id="supplierId" name="supplier_id" class="form-select" style="border-color: #2d0b36; border-radius: 8px;">
            <option value="">-- غير مرتبط --</option>
            {% for supplier in suppliers %}
            <option value="{{ supplier.id }}" {% if assigned_supplier_id == supplier.id %}selected{% endif %}>
                {{ supplier.trade_name }}
            </option>
            {% endfor %}
        </select>
    </div>
</div>

<style>
.form-label {
    font-weight: 600;
    color: #2d0b36;
}
</style>
