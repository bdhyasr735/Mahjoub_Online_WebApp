<!-- apps/admin_Product/templates/admin/includes/_sync_modal.html -->
<!-- نافذة المزامنة المنبثقة -->
<div id="syncModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); z-index: 10000; align-items: center; justify-content: center;">
    <!-- ✅ نافذة المزامنة المتطورة -->
    <div class="sync-modal-box" style="
        background: linear-gradient(145deg, #ffffff, #f8f5f0);
        padding: 45px 40px;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(45, 11, 54, 0.4);
        text-align: center;
        min-width: 360px;
        max-width: 92%;
        width: 420px;
        position: relative;
        border: 1px solid rgba(212, 175, 55, 0.15);
        transition: all 0.3s ease;
    ">
        <!-- ✅ أيقونة التحميل المتحركة -->
        <div class="sync-icon-wrapper" style="position: relative; display: inline-block;">
            <div class="spinner-border" style="width: 4rem; height: 4rem; color: #D4AF37; border-width: 4px;" role="status">
                <span class="visually-hidden">جاري التحميل...</span>
            </div>
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5rem;">
                🔄
            </div>
        </div>
        
        <h4 class="mt-3" style="color: #2d0b36; font-weight: 700; font-size: 1.4rem;">جاري المزامنة</h4>
        <p id="syncStatusText" class="text-muted" style="font-size: 0.95rem; margin-bottom: 20px;">يرجى الانتظار، جلب البيانات من الخادم...</p>
        
        <!-- ✅ شريط التقدم المتطور -->
        <div class="progress" style="height: 10px; border-radius: 12px; overflow: hidden; background: #f0ebe5;">
            <div 
                id="syncProgressBar"
                class="progress-bar progress-bar-striped progress-bar-animated" 
                style="width: 100%; background: linear-gradient(90deg, #2d0b36, #D4AF37, #ffd700); background-size: 200% 100%;"
            ></div>
        </div>
        
        <!-- ✅ رسائل المزامنة (تظهر بعد الانتهاء) -->
        <div id="syncResult" style="display:none; margin-top: 20px; width: 100%;">
            <div id="syncMessage" class="alert" style="margin-bottom: 0; border-radius: 12px; font-weight: 600; border: none;"></div>
            <div id="syncDetails" style="font-size: 14px; color: #6c757d; margin-top: 10px;"></div>
        </div>
        
        <!-- ✅ زر إغلاق النافذة (في الزاوية العلوية) -->
        <button type="button" onclick="closeSyncModal()" style="
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #999;
            cursor: pointer;
            transition: all 0.3s;
            padding: 4px 10px;
            border-radius: 8px;
            line-height: 1;
        " onmouseover="this.style.color='#dc3545'; this.style.background='rgba(220,53,69,0.1)'" 
           onmouseout="this.style.color='#999'; this.style.background='none'">
            ✕
        </button>
    </div>
</div>

<script>
// ✅ تحديث شريط التقدم مع النص
function updateSyncProgress(message, percentage) {
    const progressBar = document.getElementById('syncProgressBar');
    const statusText = document.getElementById('syncStatusText');
    
    if (progressBar) {
        progressBar.style.width = Math.min(percentage, 100) + '%';
        progressBar.setAttribute('aria-valuenow', Math.min(percentage, 100));
        progressBar.textContent = Math.min(percentage, 100) + '%';
    }
    if (statusText && message) {
        statusText.textContent = message;
    }
}

// ✅ عرض نتيجة المزامنة
function showSyncResult(success, message, details) {
    const resultDiv = document.getElementById('syncResult');
    const messageDiv = document.getElementById('syncMessage');
    const detailsDiv = document.getElementById('syncDetails');
    const progressBar = document.getElementById('syncProgressBar');
    const statusText = document.getElementById('syncStatusText');
    
    // إخفاء شريط التقدم ونص الحالة
    if (progressBar) progressBar.style.display = 'none';
    if (statusText) statusText.style.display = 'none';
    
    // عرض النتيجة
    resultDiv.style.display = 'block';
    messageDiv.className = `alert alert-${success ? 'success' : 'danger'}`;
    messageDiv.innerHTML = success ? '✅ ' + message : '❌ ' + message;
    
    if (details) {
        detailsDiv.textContent = details;
        detailsDiv.style.display = 'block';
    } else {
        detailsDiv.style.display = 'none';
    }
    
    // ✅ إظهار زر الإغلاق بشكل أكبر
    const closeBtn = document.querySelector('#syncModal button[onclick="closeSyncModal()"]');
    if (closeBtn) {
        closeBtn.style.fontSize = '2rem';
    }
}

// ✅ إعادة ضبط النافذة عند الإغلاق
function resetSyncModal() {
    const modal = document.getElementById('syncModal');
    const resultDiv = document.getElementById('syncResult');
    const progressBar = document.getElementById('syncProgressBar');
    const statusText = document.getElementById('syncStatusText');
    
    resultDiv.style.display = 'none';
    if (progressBar) {
        progressBar.style.display = 'block';
        progressBar.style.width = '100%';
        progressBar.textContent = '100%';
    }
    if (statusText) {
        statusText.style.display = 'block';
        statusText.textContent = 'يرجى الانتظار، جلب البيانات من الخادم...';
    }
    modal.style.display = 'none';
}

// ✅ إغلاق النافذة يدوياً
function closeSyncModal() {
    resetSyncModal();
}

// ✅ إغلاق النافذة بالضغط على ESC
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        const modal = document.getElementById('syncModal');
        if (modal && modal.style.display === 'flex') {
            closeSyncModal();
        }
    }
});

// ✅ إغلاق النافذة بالضغط خارجها
const syncModalEl = document.getElementById('syncModal');
if (syncModalEl) {
    syncModalEl.addEventListener('click', function(event) {
        if (event.target === this) {
            closeSyncModal();
        }
    });
}
</script>

<style>
/* ✅ تأثير حركة على شريط التقدم */
@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}
#syncProgressBar {
    background-size: 200% 100%;
    animation: shimmer 2s ease-in-out infinite;
}

/* ✅ تأثير دخول النافذة */
@keyframes modalFadeIn {
    from {
        opacity: 0;
        transform: scale(0.9) translateY(-20px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}
.sync-modal-box {
    animation: modalFadeIn 0.4s ease-out forwards;
}

/* ✅ تحسين الأزرار */
.sync-modal-box .btn-close-custom {
    transition: all 0.3s ease;
}

/* ✅ تحسين مظهر الرسائل */
.alert-success {
    background: linear-gradient(135deg, #d4edda, #c3e6cb) !important;
    color: #155724 !important;
    border: 1px solid #b8daff !important;
}
.alert-danger {
    background: linear-gradient(135deg, #f8d7da, #f5c6cb) !important;
    color: #721c24 !important;
    border: 1px solid #f5c6cb !important;
}
</style>
