<!-- 📂 apps/admin_Product/templates/admin/includes/_sync_modal.html -->
<!-- نافذة المزامنة المنبثقة -->
<div id="syncModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); z-index: 10000; align-items: center; justify-content: center;">
    <div style="
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        text-align: center;
        min-width: 320px;
        max-width: 90%;
        width: 400px;
    ">
        <!-- أيقونة التحميل -->
        <div class="spinner-border" style="width: 3.5rem; height: 3.5rem; color: #D4AF37;" role="status">
            <span class="visually-hidden">جاري التحميل...</span>
        </div>
        
        <h4 class="mt-3" style="color: #2d0b36;">🔄 جاري المزامنة</h4>
        <p class="text-muted">يرجى الانتظار، جلب البيانات من الخادم...</p>
        
        <!-- شريط التقدم -->
        <div class="progress mt-3" style="height: 8px; border-radius: 10px; overflow: hidden;">
            <div 
                class="progress-bar progress-bar-striped progress-bar-animated" 
                style="width: 100%; background: linear-gradient(90deg, #2d0b36, #D4AF37);"
            ></div>
        </div>
        
        <!-- رسائل المزامنة (تظهر بعد الانتهاء) -->
        <div id="syncResult" style="display:none; margin-top: 15px;">
            <div id="syncMessage" class="alert" style="margin-bottom: 0; border-radius: 10px;"></div>
            <div id="syncDetails" style="font-size: 14px; color: #6c757d; margin-top: 10px;"></div>
        </div>
    </div>
</div>

<script>
function updateSyncProgress(message, percentage) {
    const progressBar = document.querySelector('#syncModal .progress-bar');
    if (progressBar) {
        progressBar.style.width = percentage + '%';
        progressBar.setAttribute('aria-valuenow', percentage);
        progressBar.textContent = percentage + '%';
    }
    // عرض الرسالة في مكانها المناسب
    const progressText = document.querySelector('#syncModal .text-muted');
    if (progressText && message) {
        progressText.textContent = message;
    }
}

function showSyncResult(success, message, details) {
    const resultDiv = document.getElementById('syncResult');
    const messageDiv = document.getElementById('syncMessage');
    const detailsDiv = document.getElementById('syncDetails');
    
    resultDiv.style.display = 'block';
    messageDiv.className = `alert alert-${success ? 'success' : 'danger'}`;
    messageDiv.innerHTML = message;
    
    if (details) {
        detailsDiv.textContent = details;
        detailsDiv.style.display = 'block';
    } else {
        detailsDiv.style.display = 'none';
    }
    
    // إخفاء شريط التقدم بعد ظهور النتيجة
    const progressBar = document.querySelector('#syncModal .progress');
    if (progressBar) {
        progressBar.style.display = 'none';
    }
}

// إعادة ضبط النافذة عند الإغلاق
function resetSyncModal() {
    const modal = document.getElementById('syncModal');
    const resultDiv = document.getElementById('syncResult');
    const progressBar = document.querySelector('#syncModal .progress');
    const progressText = document.querySelector('#syncModal .text-muted');
    
    resultDiv.style.display = 'none';
    if (progressBar) progressBar.style.display = 'block';
    if (progressText) progressText.textContent = 'يرجى الانتظار، جلب البيانات من الخادم...';
    modal.style.display = 'none';
}
</script>
