<!-- 📂 apps/admin_Product/templates/admin/partials/_product_main_info.html -->
<!-- معلومات المنتج الرئيسية -->

<div class="row">
    <!-- الاسم -->
    <div class="col-md-6 mb-3">
        <label for="productName" class="form-label fw-bold">
            <i class="fas fa-tag text-primary me-1"></i> اسم المنتج *
        </label>
        <input type="text" 
               id="productName" 
               name="title" 
               class="form-control form-control-lg" 
               value="{{ product.name or '' }}"
               placeholder="أدخل اسم المنتج..."
               required>
    </div>
    
    <!-- السعر -->
    <div class="col-md-3 mb-3">
        <label for="productPrice" class="form-label fw-bold">
            <i class="fas fa-dollar-sign text-success me-1"></i> السعر *
        </label>
        <div class="input-group">
            <input type="number" 
                   id="productPrice" 
                   name="price" 
                   class="form-control" 
                   step="0.01" 
                   min="0"
                   value="{{ product.price or 0 }}"
                   required>
            <span class="input-group-text">ر.س</span>
        </div>
    </div>
    
    <!-- SKU -->
    <div class="col-md-3 mb-3">
        <label for="productSku" class="form-label fw-bold">
            <i class="fas fa-barcode text-info me-1"></i> SKU
        </label>
        <input type="text" 
               id="productSku" 
               name="sku" 
               class="form-control" 
               value="{{ product.sku or '' }}"
               placeholder="رمز المنتج">
    </div>
</div>

<div class="row">
    <!-- الوصف -->
    <div class="col-12 mb-3">
        <label for="productDescription" class="form-label fw-bold">
            <i class="fas fa-align-left text-secondary me-1"></i> الوصف
        </label>
        <textarea id="productDescription" 
                  name="description" 
                  class="form-control" 
                  rows="4"
                  placeholder="وصف المنتج...">{{ product.description or '' }}</textarea>
    </div>
</div>

<div class="row">
    <!-- الحالة -->
    <div class="col-md-6 mb-3">
        <label for="productStatus" class="form-label fw-bold">
            <i class="fas fa-circle text-warning me-1"></i> الحالة
        </label>
        <select id="productStatus" name="status" class="form-select">
            <option value="DRAFT" {% if product.status|upper == 'DRAFT' %}selected{% endif %}>
                ⏳ مسودة
            </option>
            <option value="PUBLISHED" {% if product.status|upper == 'PUBLISHED' %}selected{% endif %}>
                ✅ منشور
            </option>
            <option value="REJECTED" {% if product.status|upper == 'REJECTED' %}selected{% endif %}>
                ❌ مرفوض
            </option>
            <option value="ARCHIVED" {% if product.status|upper == 'ARCHIVED' %}selected{% endif %}>
                📦 مؤرشف
            </option>
        </select>
    </div>
    
    <!-- المورد -->
    <div class="col-md-6 mb-3">
        <label for="supplierId" class="form-label fw-bold">
            <i class="fas fa-store text-purple me-1"></i> المورد
        </label>
        <select id="supplierId" name="supplier_id" class="form-select">
            <option value="">-- غير مرتبط --</option>
            {% for supplier in suppliers %}
            <option value="{{ supplier.id }}" {% if assigned_supplier_id == supplier.id %}selected{% endif %}>
                {{ supplier.trade_name }}
            </option>
            {% endfor %}
        </select>
    </div>
</div>

<!-- معلومات إضافية (للقراءة فقط) -->
{% if product and product.qid %}
<div class="row mt-3 pt-3 border-top">
    <div class="col-md-4">
        <small class="text-muted">
            <i class="fas fa-fingerprint me-1"></i> QID: {{ product.qid }}
        </small>
    </div>
    <div class="col-md-4">
        <small class="text-muted">
            <i class="fas fa-calendar-plus me-1"></i> تاريخ الإنشاء: 
            {{ product.createdAt|datetime if product.createdAt else '-' }}
        </small>
    </div>
    <div class="col-md-4">
        <small class="text-muted">
            <i class="fas fa-calendar-edit me-1"></i> آخر تحديث: 
            {{ product.updatedAt|datetime if product.updatedAt else '-' }}
        </small>
    </div>
</div>
{% endif %}

<style>
.form-label {
    font-weight: 600;
    color: #2d0b36;
}
</style>
