<!-- apps/admin_Product/templates/admin/partials/_product_main_info.html -->
<!-- معلومات المنتج الأساسية والأسعار -->

<div class="row">
    <!-- SKU -->
    <div class="col-md-6 mb-3">
        <label for="productSku" class="form-label fw-bold" style="color: #2d0b36;">
            <i class="fas fa-barcode text-info me-1"></i> رمز التخزين التعريفي (SKU)
        </label>
        <input type="text" 
               id="productSku" 
               name="sku" 
               class="form-control" 
               value="{{ product.sku or '' }}"
               placeholder="رمز المنتج (SKU)"
               style="border-color: #2d0b36; border-radius: 8px;"
               oninput="generatePayload()">
    </div>
    
    <!-- الكمية -->
    <div class="col-md-6 mb-3">
        <label for="productQuantity" class="form-label fw-bold" style="color: #2d0b36;">
            <i class="fas fa-cubes text-info me-1"></i> الكمية المتاحة
        </label>
        <input type="number" 
               id="productQuantity" 
               name="quantity" 
               class="form-control" 
               min="0"
               value="{{ product.quantity or 0 }}"
               style="border-color: #2d0b36; border-radius: 8px; direction: ltr; text-align: right; font-feature-settings: 'tnum'; font-variant-numeric: tabular-nums;"
               oninput="generatePayload()">
    </div>
</div>

<!-- ======================================== -->
<!-- الأسعار الثلاثة -->
<!-- ======================================== -->
<div class="row">
    <!-- السعر الأساسي -->
    <div class="col-md-4 mb-3">
        <label for="productPrice" class="form-label fw-bold" style="color: #2d0b36;">
            <i class="fas fa-dollar-sign text-success me-1"></i> السعر الأساسي *
        </label>
        <div class="input-group">
            <input type="number" 
                   id="productPrice" 
                   name="price" 
                   class="form-control" 
                   step="0.01" 
                   min="0"
                   value="{{ product.pricing.price if product.pricing and product.pricing.price is not none else 0 }}"
                   required
                   style="border-color: #2d0b36; border-radius: 8px 0 0 8px; direction: ltr; text-align: right; font-feature-settings: 'tnum'; font-variant-numeric: tabular-nums;"
                   oninput="generatePayload()">
            <span class="input-group-text" style="background: #2d0b36; color: #D4AF37; border: none; border-radius: 0 8px 8px 0;">ر.س</span>
        </div>
        <small class="text-muted">السعر المعروض للبيع</small>
    </div>
    
    <!-- سعر المقارنة -->
    <div class="col-md-4 mb-3">
        <label for="comparePrice" class="form-label fw-bold" style="color: #2d0b36;">
            <i class="fas fa-tag text-warning me-1"></i> سعر المقارنة
        </label>
        <div class="input-group">
            <input type="number" 
                   id="comparePrice" 
                   name="compare_price" 
                   class="form-control" 
                   step="0.01" 
                   min="0"
                   value="{{ product.pricing.compareAtPrice if product.pricing and product.pricing.compareAtPrice is not none else 0 }}"
                   style="border-color: #2d0b36; border-radius: 8px 0 0 8px; direction: ltr; text-align: right; font-feature-settings: 'tnum'; font-variant-numeric: tabular-nums;"
                   oninput="generatePayload()">
            <span class="input-group-text" style="background: #2d0b36; color: #D4AF37; border: none; border-radius: 0 8px 8px 0;">ر.س</span>
        </div>
        <small class="text-muted">السعر قبل الخصم (يظهر مشطوباً)</small>
    </div>
    
    <!-- السعر الأصلي (جديد) -->
    <div class="col-md-4 mb-3">
        <label for="originalPrice" class="form-label fw-bold" style="color: #2d0b36;">
            <i class="fas fa-history text-primary me-1"></i> السعر الأصلي
        </label>
        <div class="input-group">
            <input type="number" 
                   id="originalPrice" 
                   name="original_price" 
                   class="form-control" 
                   step="0.01" 
                   min="0"
                   value="{{ product.pricing.originalPrice if product.pricing and product.pricing.originalPrice is not none else 0 }}"
                   style="border-color: #2d0b36; border-radius: 8px 0 0 8px; direction: ltr; text-align: right; font-feature-settings: 'tnum'; font-variant-numeric: tabular-nums;"
                   oninput="generatePayload()">
            <span class="input-group-text" style="background: #2d0b36; color: #D4AF37; border: none; border-radius: 0 8px 8px 0;">ر.س</span>
        </div>
        <small class="text-muted">السعر الأصلي قبل التخفيضات</small>
    </div>
</div>

<div class="row">
    <!-- الحالة -->
    <div class="col-md-6 mb-3">
        <label for="productStatus" class="form-label fw-bold" style="color: #2d0b36;">
            <i class="fas fa-circle text-warning me-1"></i> الحالة
        </label>
        <select id="productStatus" name="status" class="form-select" style="border-color: #2d0b36; border-radius: 8px;" onchange="generatePayload()">
            <option value="DRAFT" {% if product.status|upper == 'DRAFT' %}selected{% endif %}>
                ⏳ مسودة
            </option>
            <option value="PUBLISHED" {% if product.status|upper == 'PUBLISHED' %}selected{% endif %}>
                ✅ منشور
            </option>
            <option value="REJECTED" {% if product.status|upper == 'REJECTED' %}selected{% endif %}>
                ❌ مرفوض
            </option>
            <option value="ARCHIVED" {% if product.status|upper == 'ARCHIVED' %}selected{% endif %}>
                📦 مؤرشف
            </option>
        </select>
    </div>
    
    <!-- المورد -->
    <div class="col-md-6 mb-3">
        <label for="supplierId" class="form-label fw-bold" style="color: #2d0b36;">
            <i class="fas fa-store text-purple me-1"></i> المورد
        </label>
        <select id="supplierId" name="supplier_id" class="form-select" style="border-color: #2d0b36; border-radius: 8px;">
            <option value="">-- غير مرتبط --</option>
            {% for supplier in suppliers %}
            <option value="{{ supplier.id }}" {% if assigned_supplier_id == supplier.id %}selected{% endif %}>
                {{ supplier.trade_name }}
            </option>
            {% endfor %}
        </select>
    </div>
</div>

<style>
.form-label {
    font-weight: 600;
    color: #2d0b36;
}

/* ✅ تنسيق الأرقام بالإنجليزية */
input[type="number"] {
    font-feature-settings: "tnum";
    font-variant-numeric: tabular-nums;
    direction: ltr;
    text-align: right;
}

/* ✅ تنسيق مجموعات الإدخال */
.input-group-text {
    border-radius: 8px 0 0 8px;
}
</style>
