<!-- apps/admin_Product/templates/admin/partials/edit/_description.html -->

<!-- ================= وصف المنتج ================= -->
<div class="form-section description-card">
    <div class="form-section-title">
        <i class="fas fa-align-left"></i>
        الوصف التفصيلي
        <span class="badge-count"><i class="fas fa-edit"></i> محرر متقدم</span>
        <span class="badge-status" id="descriptionStatus">
            <i class="fas fa-check-circle"></i> جاهز
        </span>
    </div>
    
    <div class="description-content">
        <!-- ✅ معلومات قبل المحرر -->
        <div class="description-info">
            <span><i class="fas fa-info-circle"></i> كتابة وصف احترافي للمنتج</span>
            <span><i class="fas fa-keyboard"></i> تنسيق، روابط، صور، جداول</span>
        </div>
        
        <!-- ✅ TinyMCE Editor -->
        <div class="editor-wrapper">
            <textarea id="productDescription" name="description" rows="12">{{ product.description or '' }}</textarea>
        </div>
        
        <!-- ✅ معلومات بعد المحرر -->
        <div class="description-footer">
            <span><i class="fas fa-arrows-alt"></i> توسيع: <strong>Fullscreen</strong></span>
            <span><i class="fas fa-file-word"></i> <span id="wordCountNumber">0</span> كلمة</span>
            <span><i class="fas fa-font"></i> <span id="charCountNumber">0</span> حرف</span>
        </div>
    </div>
</div>

<style>
.description-card {
    border-color: rgba(212, 175, 55, 0.15);
    background: linear-gradient(135deg, #ffffff, #faf8f6);
    padding: 24px 28px !important;
}
.description-card .badge-status {
    font-size: 0.65rem; font-weight: 600; padding: 3px 12px;
    border-radius: 20px; margin-left: 8px;
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(34, 197, 94, 0.1); color: #22c55e;
    transition: all 0.3s ease;
}
.description-card .badge-status.dirty {
    background: rgba(245, 158, 11, 0.1); color: #f59e0b;
}
.description-content { display: flex; flex-direction: column; gap: 14px; }
.description-info {
    display: flex; flex-wrap: wrap; gap: 16px;
    padding: 10px 16px; background: #f8fafc;
    border-radius: 10px; border: 1px solid #e2e8f0;
    font-size: 0.8rem; color: #64748b;
}
.description-info i { color: #D4AF37; margin-right: 4px; }
.editor-wrapper {
    border-radius: 10px; overflow: hidden;
    border: 2px solid #e2e8f0; transition: all 0.3s ease;
}
.editor-wrapper:focus-within {
    border-color: #D4AF37; box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.08);
}
.tox-tinymce { border: none !important; border-radius: 0 !important; }
.tox .tox-toolbar__primary { background: #f8fafc !important; border-bottom: 1px solid #e2e8f0 !important; }
.tox .tox-tbtn { border-radius: 4px !important; transition: all 0.2s ease !important; }
.tox .tox-tbtn:hover { background: rgba(212, 175, 55, 0.1) !important; }
.tox .tox-tbtn--active { background: rgba(212, 175, 55, 0.2) !important; }
.tox .tox-tbtn svg { fill: #2d0b36 !important; }
.tox .tox-edit-area iframe { background: #ffffff !important; }
.description-footer {
    display: flex; flex-wrap: wrap; justify-content: space-between;
    align-items: center; padding-top: 10px; gap: 10px;
    font-size: 0.75rem; color: #94a3b8;
}
.description-footer i { color: #D4AF37; margin-right: 4px; }
.description-footer strong { color: #64748b; }
@media (max-width: 768px) {
    .description-card { padding: 16px 14px !important; }
    .description-info { flex-direction: column; gap: 6px; padding: 8px 12px; }
    .description-footer { flex-direction: column; align-items: flex-start; gap: 4px; }
    .tox .tox-toolbar__primary { flex-wrap: wrap !important; gap: 2px !important; }
    .tox .tox-tbtn { width: 32px !important; height: 32px !important; }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof tinymce !== 'undefined') {
        tinymce.init({
            selector: '#productDescription',
            height: 400,
            menubar: true,
            language: 'ar',
            directionality: 'rtl',
            toolbar: [
                'undo redo | blocks | fontsize | fontfamily',
                'bold italic underline strikethrough | forecolor backcolor | alignleft aligncenter alignright alignjustify',
                'bullist numlist | outdent indent | link image media | table | code',
                'removeformat | fullscreen | help'
            ],
            menu: {
                file: { title: 'ملف', items: 'newdocument | print | preview' },
                edit: { title: 'تحرير', items: 'undo redo | cut copy paste | selectall | searchreplace' },
                insert: { title: 'إدراج', items: 'link image media | table | hr | charmap | anchor' },
                view: { title: 'عرض', items: 'visualaid | fullscreen | code' },
                format: { title: 'تنسيق', items: 'bold italic underline strikethrough | formats | removeformat' },
                table: { title: 'جدول', items: 'inserttable | cell row column | tableprops deletetable' },
                tools: { title: 'أدوات', items: 'spellchecker | code' }
            },
            font_family_formats: 'Cairo=Cairo;Arial=Arial;Helvetica=Helvetica;Times New Roman=Times New Roman;Georgia=Georgia;Tahoma=Tahoma;Verdana=Verdana',
            font_size_formats: '8pt 10pt 12pt 14pt 18pt 24pt 36pt 48pt 72pt',
            plugins: ['advlist','autolink','lists','link','image','media','charmap','preview','anchor','searchreplace','visualblocks','code','fullscreen','insertdatetime','table','help','wordcount'],
            content_style: 'body{font-family:"Cairo",sans-serif;font-size:16px;line-height:1.8;padding:20px;color:#1e293b} h1,h2,h3,h4{color:#0f172a} a{color:#D4AF37} table{border-collapse:collapse;width:100%;margin:16px 0} th,td{border:1px solid #e2e8f0;padding:8px 12px;text-align:right} th{background:#f1f5f9} blockquote{border-right:4px solid #D4AF37;padding:12px 20px;background:#f8fafc;border-radius:4px;margin:16px 0} img{max-width:100%;height:auto;border-radius:8px}',
            images_upload_handler: function(blobInfo) {
                return new Promise(function(resolve) {
                    const reader = new FileReader();
                    reader.onload = function(e) { resolve(e.target.result); };
                    reader.readAsDataURL(blobInfo.blob());
                });
            },
            setup: function(editor) {
                editor.on('init', function() { updateWordCount(editor); });
                editor.on('change', function() {
                    updateWordCount(editor);
                    updateDescriptionStatus(editor);
                });
            }
        });
    }
});

function updateWordCount(editor) {
    const content = editor.getContent({ format: 'text' }).trim();
    const wordCount = content ? content.split(/\s+/).length : 0;
    const charCount = content.length;
    const wordSpan = document.getElementById('wordCountNumber');
    const charSpan = document.getElementById('charCountNumber');
    if (wordSpan) wordSpan.textContent = wordCount;
    if (charSpan) charSpan.textContent = charCount;
}

function updateDescriptionStatus(editor) {
    const statusBadge = document.getElementById('descriptionStatus');
    if (!statusBadge) return;
    const content = editor.getContent({ format: 'text' }).trim();
    if (content.length > 0) {
        statusBadge.innerHTML = '<i class="fas fa-check-circle"></i> مكتمل';
        statusBadge.className = 'badge-status';
    } else {
        statusBadge.innerHTML = '<i class="fas fa-exclamation-circle"></i> فارغ';
        statusBadge.className = 'badge-status dirty';
    }
}
</script>
