<!-- apps/admin_Product/templates/admin/partials/edit/_product_main_info.html -->

<!-- ... باقي الملف كما هو ... -->

<!-- الحالة والمورد (المعدل) -->
<div class="row g-3 mt-2">
    <!-- الحالة -->
    <div class="col-md-6">
        <div class="form-group">
            <label for="productStatus" class="form-label">
                <i class="fas fa-circle text-gold me-1"></i> الحالة
            </label>
            <select id="productStatus" name="status" class="form-select form-select-lg custom-input" onchange="generatePayload()">
                <option value="DRAFT" {% if product.status|upper == 'DRAFT' %}selected{% endif %}>⏳ مسودة</option>
                <option value="PUBLISHED" {% if product.status|upper == 'PUBLISHED' %}selected{% endif %}>✅ منشور</option>
                <option value="REJECTED" {% if product.status|upper == 'REJECTED' %}selected{% endif %}>❌ مرفوض</option>
                <option value="ARCHIVED" {% if product.status|upper == 'ARCHIVED' %}selected{% endif %}>📦 مؤرشف</option>
            </select>
        </div>
    </div>
    
    <!-- المورد مع بحث متقدم (Tom Select) - تم إصلاح التنسيق -->
    <div class="col-md-6">
        <div class="form-group">
            <label for="supplierId" class="form-label">
                <i class="fas fa-store text-gold me-1"></i> المورد
            </label>
            <!-- ✅ تم إزالة التنسيق المخفي القاسي، Tom Select سيتولى الأمر -->
            <select id="supplierSelect" name="supplier_id" class="form-select form-select-lg custom-input" 
                    placeholder="ابحث عن المورد هنا...">
                <option value="">-- غير مرتبط --</option>
                {% for supplier in suppliers %}
                <option value="{{ supplier.id }}" {% if assigned_supplier_id == supplier.id %}selected{% endif %}>
                    {{ supplier.trade_name }}
                </option>
                {% endfor %}
            </select>
        </div>
    </div>
</div>

<!-- ... سكربت Tom Select كما هو ... -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof TomSelect !== 'undefined') {
        const supplierSelect = document.getElementById('supplierSelect');
        if (supplierSelect) {
            new TomSelect(supplierSelect, {
                plugins: ['remove_button'],
                placeholder: 'ابحث عن المورد هنا...',
                searchField: ['text'],
                maxOptions: 10
            });
            console.log('✅ Tom Select (المورد) تم تفعيله بنجاح');
        }
    } else {
        console.warn('⚠️ تنبيه: مكتبة Tom Select غير محملة. تأكد من إضافتها في base.html');
    }
});
</script>
