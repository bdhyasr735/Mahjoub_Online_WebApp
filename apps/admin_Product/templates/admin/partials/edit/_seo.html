<!-- apps/admin_Product/templates/admin/partials/edit/_seo.html -->

<!-- ============================================================
   🔍 تحسين محركات البحث (SEO)
   ============================================================ -->
<div class="form-section seo-card shadow-sm">
    <div class="form-section-title d-flex align-items-center justify-content-between">
        <div>
            <i class="fas fa-code text-gold me-2"></i> 
            <span>تحسين محركات البحث (SEO)</span>
        </div>
        <span class="badge badge-gold-soft">
            <i class="fas fa-search me-1"></i> محركات البحث
        </span>
    </div>
    
    <div class="row g-3">
        <!-- عنوان SEO -->
        <div class="col-md-6">
            <div class="form-group">
                <label class="form-label fw-bold text-dark-purple">
                    <i class="fas fa-heading text-gold me-1"></i> عنوان SEO
                    <span class="text-muted fw-normal" style="font-size: 0.75rem;">(موصى به: 50-60 حرفاً)</span>
                </label>
                <input type="text" 
                       name="seo_title" 
                       class="form-control custom-input" 
                       value="{{ product.seo.title if product.seo and product.seo.title else '' }}" 
                       placeholder="عنوان تحسين محركات البحث (SEO Title)">
            </div>
        </div>
        
        <!-- وصف SEO -->
        <div class="col-md-6">
            <div class="form-group">
                <label class="form-label fw-bold text-dark-purple">
                    <i class="fas fa-align-left text-gold me-1"></i> وصف SEO
                    <span class="text-muted fw-normal" style="font-size: 0.75rem;">(موصى به: 150-160 حرفاً)</span>
                </label>
                <input type="text" 
                       name="seo_description" 
                       class="form-control custom-input" 
                       value="{{ product.seo.description if product.seo and product.seo.description else '' }}" 
                       placeholder="وصف تحسين محركات البحث (SEO Description)">
            </div>
        </div>
    </div>
    
    <div class="row g-3 mt-1">
        <!-- الكلمات المفتاحية -->
        <div class="col-12">
            <div class="form-group">
                <label class="form-label fw-bold text-dark-purple">
                    <i class="fas fa-tags text-gold me-1"></i> الكلمات المفتاحية
                </label>
                <input type="text" 
                       name="seo_keywords" 
                       class="form-control custom-input" 
                       value="{{ product.seo.keywords if product.seo and product.seo.keywords else '' }}" 
                       placeholder="كلمات مفتاحية مفصولة بفواصل (مثال: متجر, تسوق, منتج)">
                <small class="text-muted mt-1 d-block">
                    <i class="fas fa-info-circle me-1"></i> تساعد هذه الكلمات محركات البحث في فهم محتوى المنتج بشكل أفضل.
                </small>
            </div>
        </div>
    </div>
</div>

}

    font-size: 1.1rem;

}

}

    border-color: #e2e8f0;
