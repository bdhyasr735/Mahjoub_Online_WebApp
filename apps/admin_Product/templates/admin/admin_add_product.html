{% extends "admin/base.html" %}

{% block title %}إضافة منتج جديد{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">➕ إضافة منتج جديد</h1>
        <a href="{{ url_for('admin_product_bp.manage_products') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-right"></i> العودة
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('admin_product_bp.add_product') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <!-- معلومات المنتج الرئيسية -->
                <div class="row">
                    <!-- الاسم -->
                    <div class="col-md-6 mb-3">
                        <label for="productName" class="form-label fw-bold">
                            <i class="fas fa-tag text-primary me-1"></i> اسم المنتج *
                        </label>
                        <input type="text" 
                               id="productName" 
                               name="title" 
                               class="form-control form-control-lg" 
                               placeholder="أدخل اسم المنتج..."
                               required>
                    </div>
                    
                    <!-- السعر -->
                    <div class="col-md-3 mb-3">
                        <label for="productPrice" class="form-label fw-bold">
                            <i class="fas fa-dollar-sign text-success me-1"></i> السعر *
                        </label>
                        <div class="input-group">
                            <input type="number" 
                                   id="productPrice" 
                                   name="price" 
                                   class="form-control" 
                                   step="0.01" 
                                   min="0"
                                   placeholder="0.00"
                                   required>
                            <span class="input-group-text">ر.س</span>
                        </div>
                    </div>
                    
                    <!-- SKU -->
                    <div class="col-md-3 mb-3">
                        <label for="productSku" class="form-label fw-bold">
                            <i class="fas fa-barcode text-info me-1"></i> SKU
                        </label>
                        <input type="text" 
                               id="productSku" 
                               name="sku" 
                               class="form-control" 
                               placeholder="رمز المنتج">
                    </div>
                </div>

                <div class="row">
                    <!-- الوصف -->
                    <div class="col-12 mb-3">
                        <label for="productDescription" class="form-label fw-bold">
                            <i class="fas fa-align-left text-secondary me-1"></i> الوصف
                        </label>
                        <textarea id="productDescription" 
                                  name="description" 
                                  class="form-control" 
                                  rows="4"
                                  placeholder="وصف المنتج..."></textarea>
                    </div>
                </div>

                <div class="row">
                    <!-- الحالة -->
                    <div class="col-md-6 mb-3">
                        <label for="productStatus" class="form-label fw-bold">
                            <i class="fas fa-circle text-warning me-1"></i> الحالة
                        </label>
                        <select id="productStatus" name="status" class="form-select">
                            <option value="DRAFT" selected>
                                ⏳ مسودة
                            </option>
                            <option value="PUBLISHED">
                                ✅ منشور
                            </option>
                            <option value="ARCHIVED">
                                📦 مؤرشف
                            </option>
                        </select>
                    </div>
                    
                    <!-- المورد -->
                    <div class="col-md-6 mb-3">
                        <label for="supplierId" class="form-label fw-bold">
                            <i class="fas fa-store text-purple me-1"></i> المورد
                        </label>
                        <select id="supplierId" name="supplier_id" class="form-select">
                            <option value="">-- غير مرتبط --</option>
                            {% for supplier in suppliers %}
                            <option value="{{ supplier.id }}">
                                {{ supplier.trade_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                
                <!-- أزرار الإجراءات -->
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> حفظ المنتج
                    </button>
                    <a href="{{ url_for('admin_product_bp.manage_products') }}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> إلغاء
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.card {
    border: none;
    border-radius: 12px;
}
.form-label {
    font-weight: 600;
    color: #2d0b36;
}
.form-control, .form-select {
    border-radius: 8px;
}
.form-control:focus, .form-select:focus {
    border-color: #6c5ce7;
    box-shadow: 0 0 0 0.2rem rgba(108, 92, 231, 0.25);
}
</style>
{% endblock %}
