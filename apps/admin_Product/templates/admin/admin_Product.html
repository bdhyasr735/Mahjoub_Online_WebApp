{% extends "admin/base.html" %}

{% block title %}إدارة المنتجات{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">📦 إدارة المنتجات</h1>
        <div>
            <a href="{{ url_for('admin_product_bp.add_product') }}" class="btn btn-success me-2">
                <i class="fas fa-plus"></i> إضافة منتج
            </a>
            <button 
                class="btn btn-primary" 
                onclick="syncProducts()"
                id="syncButton"
            >
                <i class="fas fa-sync"></i> مزامنة الآن
            </button>
        </div>
    </div>

    <!-- شريط البحث -->
    <div class="card mb-4">
        <div class="card-body">
            <form method="GET" class="row g-3">
                <div class="col-md-8">
                    <input 
                        type="text" 
                        name="title" 
                        class="form-control" 
                        placeholder="🔍 بحث عن منتج..." 
                        value="{{ search_title or '' }}"
                    >
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-search"></i> بحث
                    </button>
                </div>
            </form>
        </div>
    </div>

    {% if error %}
    <div class="alert alert-danger">
        <strong>❌ خطأ:</strong> {{ error }}
    </div>
    {% endif %}

    <div class="card">
        <div class="card-body">
            <div id="productsTableContainer">
                {% include "admin/includes/_table_products.html" %}
            </div>
        </div>
    </div>
</div>

<!-- النافذة المنبثقة للمزامنة -->
{% include "admin/includes/_sync_modal.html" %}

<script>
function syncProducts() {
    const button = document.getElementById('syncButton');
    const modal = document.getElementById('syncModal');
    
    // تعطيل الزر وإظهار النافذة
    button.disabled = true;
    button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري المزامنة...';
    modal.style.display = 'block';
    
    // إرسال طلب المزامنة
    fetch('{{ url_for("admin_product_bp.sync_products") }}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // تحديث الجدول بالبيانات الجديدة
            showMessage('✅ ' + data.message, 'success');
            // إعادة تحميل الصفحة بعد 1.5 ثانية لعرض البيانات المحدثة
            setTimeout(() => {
                window.location.reload();
            }, 1500);
        } else {
            showMessage('❌ ' + data.message, 'danger');
        }
    })
    .catch(error => {
        showMessage('❌ حدث خطأ في الاتصال: ' + error, 'danger');
    })
    .finally(() => {
        // إعادة تفعيل الزر
        button.disabled = false;
        button.innerHTML = '<i class="fas fa-sync"></i> مزامنة الآن';
        // إخفاء النافذة بعد 2 ثانية
        setTimeout(() => {
            modal.style.display = 'none';
        }, 2000);
    });
}

function showMessage(text, type) {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
    alertDiv.role = 'alert';
    alertDiv.innerHTML = `
        ${text}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
    
    const container = document.querySelector('.container-fluid');
    container.insertBefore(alertDiv, container.firstChild);
    
    // إخفاء الرسالة بعد 5 ثوانٍ
    setTimeout(() => {
        if (alertDiv.parentNode) {
            alertDiv.remove();
        }
    }, 5000);
}

// تحديث الإحصائيات كل 30 ثانية (اختياري)
setInterval(() => {
    fetch('{{ url_for("admin_product_bp.get_stats") }}')
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // تحديث البادج في العنوان إذا وجد
                const badge = document.querySelector('.badge.bg-primary');
                if (badge) {
                    badge.textContent = data.stats.total;
                }
            }
        })
        .catch(() => {});
}, 30000);
</script>

<style>
#syncModal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 9999;
    backdrop-filter: blur(5px);
}

/* تنسيق شريط التقدم في المودال */
#syncModal .spinner-border {
    width: 3rem;
    height: 3rem;
}

#syncModal .progress {
    height: 10px;
    border-radius: 10px;
    overflow: hidden;
}

#syncModal .progress-bar {
    background: linear-gradient(90deg, #007bff, #00d4ff);
    animation: progressAnimation 1.5s ease-in-out infinite;
}

@keyframes progressAnimation {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

/* تنسيق الجدول */
.table th {
    background: #f8f9fa;
    border-bottom: 2px solid #dee2e6;
}

.table td {
    vertical-align: middle;
}

.table img {
    object-fit: cover;
    border-radius: 8px;
}

/* تنسيق البادج */
.badge {
    padding: 5px 12px;
    font-size: 12px;
}
</style>
{% endblock %}
