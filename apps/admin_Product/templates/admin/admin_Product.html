{% extends "admin/admin_base.html" %}

{% block title %}إدارة المنتجات{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">📦 إدارة المنتجات</h1>
        <div>
            <a href="{{ url_for('admin_product_bp.add_product') }}" class="btn btn-success me-2">
                <i class="fas fa-plus"></i> إضافة منتج
            </a>
            <button 
                class="btn btn-primary" 
                onclick="syncProducts()"
                id="syncButton"
            >
                <i class="fas fa-sync"></i> مزامنة الآن
            </button>
        </div>
    </div>

    <!-- شريط البحث -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form method="GET" class="row g-3">
                <div class="col-md-8">
                    <input 
                        type="text" 
                        name="title" 
                        class="form-control" 
                        placeholder="🔍 بحث عن منتج..." 
                        value="{{ search_title or '' }}"
                    >
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-search"></i> بحث
                    </button>
                </div>
            </form>
        </div>
    </div>

    {% if error %}
    <div class="alert alert-danger">
        <strong>❌ خطأ:</strong> {{ error }}
    </div>
    {% endif %}

    <div class="card shadow-sm">
        <div class="card-body">
            <div id="productsTableContainer">
                {% include "admin/includes/_table_products.html" %}
            </div>
        </div>
    </div>
</div>

<!-- النافذة المنبثقة للمزامنة -->
{% include "admin/includes/_sync_modal.html" %}

<script>
function syncProducts() {
    const button = document.getElementById('syncButton');
    const modal = document.getElementById('syncModal');
    
    // تعطيل الزر وإظهار النافذة
    button.disabled = true;
    button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري المزامنة...';
    modal.style.display = 'block';
    
    // ✅ تحديث التقدم
    if (typeof updateSyncProgress === 'function') {
        updateSyncProgress('جاري الاتصال بالخادم...', 25);
    }
    
    // ✅ الحصول على CSRF Token من input المخفي
    const csrfInput = document.querySelector('input[name="csrf_token"]');
    const csrfToken = csrfInput ? csrfInput.value : '';
    
    console.log('CSRF Token:', csrfToken); // للتحقق
    
    // ✅ إرسال طلب المزامنة مع credentials
    fetch('/admin/products/sync', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken,
            'X-Requested-With': 'XMLHttpRequest'
        },
        credentials: 'same-origin' // ✅ مهم! لإرسال الكوكيز
    })
    .then(response => {
        console.log('Status:', response.status);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
    })
    .then(data => {
        // ✅ تحديث التقدم
        if (typeof updateSyncProgress === 'function') {
            updateSyncProgress('جاري معالجة البيانات...', 75);
        }
        
        if (data.success) {
            // ✅ استخدام showSyncResult إذا كانت موجودة
            if (typeof showSyncResult === 'function') {
                showSyncResult(true, '✅ ' + (data.message || 'تمت المزامنة بنجاح'), 
                    `تمت مزامنة ${data.syncedCount || 0} منتج`);
            } else {
                showToast('success', '✅ ' + (data.message || 'تمت المزامنة بنجاح'));
            }
            
            setTimeout(() => {
                window.location.reload();
            }, 2000);
        } else {
            if (typeof showSyncResult === 'function') {
                showSyncResult(false, '❌ ' + (data.message || 'فشلت المزامنة'));
            } else {
                showToast('error', '❌ ' + (data.message || 'فشلت المزامنة'));
            }
        }
    })
    .catch(error => {
        console.error('Fetch Error:', error);
        if (typeof showSyncResult === 'function') {
            showSyncResult(false, '❌ حدث خطأ في الاتصال: ' + error.message);
        } else {
            showToast('error', '❌ حدث خطأ في الاتصال: ' + error.message);
        }
    })
    .finally(() => {
        // إعادة تفعيل الزر
        button.disabled = false;
        button.innerHTML = '<i class="fas fa-sync"></i> مزامنة الآن';
        setTimeout(() => {
            modal.style.display = 'none';
        }, 3000);
    });
}

// دالة showToast (متطابقة مع الموجودة في _table_products.html)
function showToast(type, message) {
    const colors = {
        success: '#28a745',
        error: '#dc3545',
        warning: '#ffc107',
        info: '#0d6efd'
    };
    
    const toast = document.createElement('div');
    toast.className = 'position-fixed bottom-0 end-0 p-3';
    toast.style.zIndex = '9999';
    toast.innerHTML = `
        <div class="toast show border-0 shadow-lg" role="alert" 
             style="border-right: 4px solid ${colors[type] || colors.info}; background: white; border-radius: 12px; min-width: 250px;">
            <div class="toast-body d-flex align-items-center gap-2">
                <span>${message}</span>
                <button type="button" class="btn-close btn-close-sm ms-2" data-bs-dismiss="toast"></button>
            </div>
        </div>
    `;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
}
</script>

<style>
#syncModal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 9999;
    backdrop-filter: blur(5px);
}

#syncModal .spinner-border {
    width: 3rem;
    height: 3rem;
}

#syncModal .progress {
    height: 8px;
    border-radius: 10px;
    overflow: hidden;
}

#syncModal .progress-bar {
    background: linear-gradient(90deg, #007bff, #00d4ff);
    animation: progressAnimation 1.5s ease-in-out infinite;
}

@keyframes progressAnimation {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

.card {
    border: none;
    border-radius: 12px;
}
</style>
{% endblock %}
