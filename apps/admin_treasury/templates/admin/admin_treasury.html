{% block extra_js %}
<script>
    function handleRowDblClick(ref, owner, amt, entryType, localizedType) {
        // تعبئة بيانات السند في النافذة المنبثقة
        document.getElementById('modal-ref-code').innerText = ref;
        document.getElementById('modal-owner').innerText = "الطرف المقابل: " + owner + " | النوع: " + localizedType;
        
        let isInflow = ['revenue_net', 'deposit'].includes(entryType);
        let formattedAmt = (isInflow ? '+' : '-') + Number(amt).toLocaleString(undefined, {minimumFractionDigits: 2}) + ' SAR';
        let amountEl = document.getElementById('modal-amount');
        amountEl.innerText = formattedAmt;
        amountEl.className = "fs-2 fw-black mb-4 font-monospace " + (isInflow ? 'text-success' : 'text-danger');
        
        // ربط زر عرض التفاصيل الكاملة بالرابط الصحيح
        document.getElementById('modal-detail-link').href = 'detail/' + ref;
        
        // استدعاء وعرض نافذة Bootstrap بأمان تام
        var modalElement = document.getElementById('quick-voucher-modal');
        if (modalElement) {
            // التحقق من توفر كلاس Bootstrap Modal وإظهاره
            var myModal = bootstrap.Modal.getInstance(modalElement) || new bootstrap.Modal(modalElement);
            myModal.show();
        } else {
            // حل بديل في حال تعذر تشغيل مكتبة bootstrap لضمان عدم تعطل المستخدم
            window.location.href = 'detail/' + ref;
        }
    }
</script>
{% endblock %}
