<!-- apps/suppliers_product/templates/suppliers/add_product.html -->
{% extends "suppliers/base.html" %}

{% block title %}إضافة منتج جديد | محجوب أونلاين{% endblock %}

{% block content %}
<style>
    .upload-area {
        border: 2px dashed #dee2e6;
        border-radius: 16px;
        padding: 40px;
        text-align: center;
        transition: all 0.3s ease;
        cursor: pointer;
        background: #f8f9fa;
    }
    .upload-area:hover {
        border-color: var(--dark-purple, #2d0b36);
        background: #f8f5fa;
    }
    .upload-area.dragover {
        border-color: var(--dark-purple, #2d0b36);
        background: #f0ecf3;
    }
    .upload-area img {
        max-width: 200px;
        max-height: 200px;
        border-radius: 12px;
        margin-top: 10px;
    }
    .image-preview {
        display: none;
        margin-top: 15px;
    }
    .image-preview.show {
        display: block;
    }
    .btn-remove-image {
        position: absolute;
        top: -10px;
        right: -10px;
        background: #dc3545;
        color: white;
        border: none;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .preview-container {
        position: relative;
        display: inline-block;
    }
    .form-control:focus {
        border-color: var(--dark-purple, #2d0b36);
        box-shadow: 0 0 0 0.2rem rgba(45, 11, 54, 0.15);
    }
    .btn-custom {
        background-color: var(--dark-purple, #2d0b36);
        color: #fff;
        border: none;
        transition: all 0.3s ease;
    }
    .btn-custom:hover {
        background-color: #4a1558;
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(45, 11, 54, 0.3);
    }
</style>

<div class="container-fluid py-4">
    
    <!-- ✅ رأس الصفحة -->
    <div class="d-flex align-items-center mb-4">
        <div class="bg-white p-3 rounded-circle shadow-sm me-3" style="border: 2px solid var(--dark-purple, #2d0b36);">
            <i class="fas fa-plus-circle fa-2x" style="color: var(--dark-purple, #2d0b36);"></i>
        </div>
        <div>
            <h3 class="fw-bold text-dark mb-0">إضافة منتج جديد</h3>
            <p class="text-muted mb-0">📦 أضف منتجاً جديداً ليتم ربطه بموردك</p>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-0 pt-4 pb-0">
                    <h5 class="fw-bold"><i class="fas fa-box me-2" style="color: var(--dark-purple, #2d0b36);"></i> بيانات المنتج</h5>
                </div>
                <div class="card-body p-4">

                    <form method="POST" action="{{ url_for('add_product_bp.api_add_product') }}" enctype="multipart/form-data" id="productForm">
                        
                        <!-- ✅ اسم المنتج -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark">
                                <i class="fas fa-tag text-muted me-1"></i> اسم المنتج <span class="text-danger">*</span>
                            </label>
                            <input type="text" name="title" id="productTitle"
                                   class="form-control form-control-lg" 
                                   placeholder="أدخل اسم المنتج..."
                                   required>
                        </div>

                        <!-- ✅ الوصف -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark">
                                <i class="fas fa-align-left text-muted me-1"></i> الوصف
                            </label>
                            <textarea name="description" id="productDescription"
                                      class="form-control" 
                                      rows="3"
                                      placeholder="وصف المنتج (اختياري)"></textarea>
                        </div>

                        <!-- ✅ السعر والكمية -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-dark">
                                    <i class="fas fa-money-bill-wave text-muted me-1"></i> السعر <span class="text-danger">*</span>
                                </label>
                                <input type="number" name="price" id="productPrice"
                                       class="form-control form-control-lg" 
                                       placeholder="مثال: 99.99"
                                       step="0.01"
                                       min="0"
                                       required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-dark">
                                    <i class="fas fa-boxes text-muted me-1"></i> الكمية
                                </label>
                                <input type="number" name="quantity" id="productQuantity"
                                       class="form-control form-control-lg" 
                                       placeholder="مثال: 10"
                                       min="0"
                                       value="0">
                            </div>
                        </div>

                        <!-- ✅ SKU والوزن -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-dark">
                                    <i class="fas fa-barcode text-muted me-1"></i> SKU
                                </label>
                                <div class="input-group">
                                    <input type="text" name="sku" id="productSku"
                                           class="form-control" 
                                           placeholder="SKU (اختياري)">
                                    <button type="button" class="btn btn-outline-secondary" id="generateSkuBtn">
                                        <i class="fas fa-sync"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-dark">
                                    <i class="fas fa-weight-scale text-muted me-1"></i> الوزن (كجم)
                                </label>
                                <input type="number" name="weight" id="productWeight"
                                       class="form-control" 
                                       placeholder="مثال: 0.5"
                                       step="0.01"
                                       min="0">
                            </div>
                        </div>

                        <!-- ✅ الحالة -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark">
                                <i class="fas fa-circle text-muted me-1"></i> الحالة
                            </label>
                            <select name="status" id="productStatus" class="form-select">
                                <option value="DRAFT">مسودة</option>
                                <option value="ACTIVE">نشط</option>
                                <option value="INACTIVE">غير نشط</option>
                            </select>
                        </div>

                        <!-- ✅ صورة المنتج -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark">
                                <i class="fas fa-image text-muted me-1"></i> صورة المنتج
                            </label>
                            <div class="upload-area" id="uploadArea">
                                <i class="fas fa-cloud-upload-alt fa-3x" style="color: var(--dark-purple, #2d0b36);"></i>
                                <h5 class="mt-3">اسحب الصورة هنا أو اضغط للاختيار</h5>
                                <p class="text-muted">jpg, png, gif, webp - حد أقصى 5MB</p>
                                <input type="file" name="image" id="imageInput" accept="image/*" style="display: none;">
                                <div class="image-preview" id="imagePreview">
                                    <div class="preview-container">
                                        <img id="previewImage" src="#" alt="معاينة الصورة">
                                        <button type="button" class="btn-remove-image" onclick="removeImage()">×</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ✅ أزرار الإجراء -->
                        <div class="d-flex gap-2 mt-3">
                            <button type="submit" class="btn btn-custom px-5 py-2" id="submitBtn">
                                <i class="fas fa-save me-2"></i> حفظ المنتج
                            </button>
                            <a href="{{ url_for('suppliers_product_bp.products') }}" class="btn btn-outline-secondary px-4 py-2">
                                <i class="fas fa-arrow-right me-1"></i> رجوع
                            </a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- ✅ JavaScript -->
<script>
    // ============================================================
    // ✅ رفع الصورة
    // ============================================================
    const uploadArea = document.getElementById('uploadArea');
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const previewImage = document.getElementById('previewImage');

    uploadArea.addEventListener('click', function(e) {
        if (!e.target.closest('.btn-remove-image')) {
            imageInput.click();
        }
    });

    imageInput.addEventListener('change', function(e) {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewImage.src = e.target.result;
                imagePreview.classList.add('show');
                uploadArea.querySelector('i').style.display = 'none';
                uploadArea.querySelector('h5').style.display = 'none';
                uploadArea.querySelector('p').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    });

    uploadArea.addEventListener('dragover', function(e) {
        e.preventDefault();
        this.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', function(e) {
        e.preventDefault();
        this.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', function(e) {
        e.preventDefault();
        this.classList.remove('dragover');
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            imageInput.files = files;
            imageInput.dispatchEvent(new Event('change'));
        }
    });

    function removeImage() {
        imageInput.value = '';
        imagePreview.classList.remove('show');
        previewImage.src = '#';
        uploadArea.querySelector('i').style.display = 'block';
        uploadArea.querySelector('h5').style.display = 'block';
        uploadArea.querySelector('p').style.display = 'block';
    }

    // ============================================================
    // ✅ توليد SKU تلقائي
    // ============================================================
    document.getElementById('generateSkuBtn').addEventListener('click', function() {
        const skuInput = document.getElementById('productSku');
        const prefix = 'PRD';
        const random = Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
        skuInput.value = `${prefix}-${random}`;
    });

    // ============================================================
    // ✅ إرسال النموذج (AJAX)
    // ============================================================
    document.getElementById('productForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> جاري الحفظ...';

        const formData = new FormData(this);

        fetch('{{ url_for("add_product_bp.api_add_product") }}', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showToast('✅ ' + data.message, 'success');
                setTimeout(() => {
                    window.location.href = '{{ url_for("suppliers_product_bp.products") }}';
                }, 1500);
            } else {
                showToast('❌ ' + data.message, 'danger');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-save me-2"></i> حفظ المنتج';
            }
        })
        .catch(error => {
            showToast('❌ خطأ في الاتصال بالخادم', 'danger');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-save me-2"></i> حفظ المنتج';
        });
    });

    // ✅ Toast notifications
    function showToast(message, type = 'info') {
        const colors = {
            success: 'bg-success text-white',
            danger: 'bg-danger text-white',
            warning: 'bg-warning text-dark',
            info: 'bg-info text-dark'
        };
        
        const toastContainer = document.querySelector('.toast-container') || (() => {
            const container = document.createElement('div');
            container.className = 'toast-container position-fixed top-0 end-0 p-3';
            document.body.appendChild(container);
            return container;
        })();
        
        const toast = document.createElement('div');
        toast.className = `toast align-items-center border-0 ${colors[type] || colors.info} show`;
        toast.role = 'alert';
        toast.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">${message}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        `;
        
        toastContainer.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }
</script>

{% endblock %}
