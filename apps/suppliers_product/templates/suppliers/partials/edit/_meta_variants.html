<!-- ============================================================
   📄 معلومات SEO والميتا - للمورد (قابلة للتعديل)
   ============================================================ -->
<div class="form-section meta-card shadow-sm">
    <div class="form-section-title d-flex align-items-center justify-content-between">
        <div>
            <i class="fas fa-code me-2" style="color: #2d0b36;"></i> 
            <span>تحسين محركات البحث (SEO)</span>
        </div>
        <span class="badge badge-purple-soft">
            <i class="fas fa-pen me-1"></i> قابل للتعديل
        </span>
    </div>
    
    <div class="row g-3">
        <!-- Meta Title -->
        <div class="col-md-6">
            <div class="form-group">
                <label class="form-label fw-bold" style="color: #2d0b36;">
                    <i class="fas fa-heading me-1" style="color: #2d0b36;"></i> عنوان SEO
                </label>
                <input type="text" name="seo_title" class="form-control" 
                       value="{{ product.seo.title if product.seo and product.seo.title else '' }}" 
                       placeholder="أدخل عنوان SEO">
            </div>
        </div>
        
        <!-- Meta Description -->
        <div class="col-md-6">
            <div class="form-group">
                <label class="form-label fw-bold" style="color: #2d0b36;">
                    <i class="fas fa-align-left me-1" style="color: #2d0b36;"></i> وصف SEO
                </label>
                <input type="text" name="seo_description" class="form-control" 
                       value="{{ product.seo.description if product.seo and product.seo.description else '' }}" 
                       placeholder="أدخل وصف SEO">
            </div>
        </div>
        
        <!-- Meta Keywords -->
        <div class="col-12">
            <div class="form-group">
                <label class="form-label fw-bold" style="color: #2d0b36;">
                    <i class="fas fa-tags me-1" style="color: #2d0b36;"></i> الكلمات المفتاحية
                </label>
                <input type="text" name="seo_keywords" class="form-control" 
                       value="{{ product.seo.keywords if product.seo and product.seo.keywords else '' }}" 
                       placeholder="كلمات مفتاحية مفصولة بفواصل">
                <small class="text-muted mt-1 d-block">
                    <i class="fas fa-info-circle me-1" style="color: #2d0b36;"></i> تساعد هذه الكلمات محركات البحث في فهم المنتج.
                </small>
            </div>
        </div>
    </div>
</div>

<style>
.meta-card {
    background: linear-gradient(135deg, #faf8f6, #ffffff);
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
}

.form-section-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #2d0b36;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid rgba(212, 175, 55, 0.15);
}

.badge-purple-soft {
    background: rgba(45, 11, 54, 0.1);
    color: #2d0b36;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
}

.form-group {
    margin-bottom: 0;
}
</style>
