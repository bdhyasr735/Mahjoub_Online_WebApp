<div class="row g-3">
    <!-- 1. عنوان المنتج و SKU -->
    <div class="col-md-6 col-12">
        <div class="form-group">
            <label class="form-label fw-bold"><i class="fas fa-heading me-1" style="color: #2d0b36;"></i> عنوان المنتج</label>
            <input type="text" name="title" class="form-control" value="{{ product.title or product.name or '' }}" placeholder="أدخل عنوان المنتج">
        </div>
    </div>
    <div class="col-md-6 col-12">
        <div class="form-group">
            <label class="form-label fw-bold"><i class="fas fa-barcode me-1" style="color: #2d0b36;"></i> SKU <span class="text-muted fw-normal small">(للقراءة فقط)</span></label>
            <input type="text" class="form-control" value="{{ product.sku or '' }}" readonly style="background-color: #f8f9fa;">
        </div>
    </div>

    <!-- 2. الرابط (Slug) -->
    <div class="col-12">
        <div class="form-group">
            <label class="form-label fw-bold"><i class="fas fa-link me-1" style="color: #2d0b36;"></i> الرابط (Slug)</label>
            <input type="text" name="slug" class="form-control" value="{{ product.slug or '' }}" placeholder="product-url-slug" dir="ltr">
            <small class="text-muted d-block">يُستخدم في الرابط الإلكتروني للمنتج.</small>
        </div>
    </div>

    <!-- 3. سعر التكلفة (قابل للتعديل) -->
    <div class="col-md-6 col-12">
        <div class="form-group">
            <label class="form-label fw-bold"><i class="fas fa-tag me-1" style="color: #2d0b36;"></i> سعر التكلفة (ر.س)</label>
            <div class="input-group">
                <span class="input-group-text" style="background: #2d0b36; color: #D4AF37; border: none;">ر.س</span>
                <!-- القيمة الافتراضية تكون سعر التكلفة الخاص بالمورد، فإن لم يكن موجودًا فالسعر الأصلي من قمرة -->
                <input type="text" name="cost_price" class="form-control" value="{{ mapping.price if mapping.price is not none else (product.pricing.originalPrice if product.pricing else 0) }}">
            </div>
        </div>
    </div>

    <!-- 4. الكمية المتاحة (للمورد) -->
    <div class="col-md-6 col-12">
        <div class="form-group">
            <label class="form-label fw-bold"><i class="fas fa-cubes me-1" style="color: #2d0b36;"></i> الكمية المتاحة (للمورد)</label>
            <!-- القيمة الافتراضية تكون كمية المورد، فإن لم تكن موجودة فكمية قمرة -->
            <input type="text" name="quantity" class="form-control" value="{{ mapping.quantity if mapping.quantity is not none else (product.quantity if product.quantity is not none else 0) }}">
        </div>
    </div>

    <!-- 5. الوزن -->
    <div class="col-12">
        <div class="form-group">
            <label class="form-label fw-bold"><i class="fas fa-weight me-1" style="color: #2d0b36;"></i> الوزن (كجم)</label>
            <input type="text" name="weight" class="form-control" value="{{ mapping.weight if mapping.weight is not none else 0.0 }}">
        </div>
    </div>
</div>
