<!-- ============================================================
   📄 معلومات SEO والميتا - للمورد (عرض فقط)
   ============================================================ -->
<div class="form-section meta-card shadow-sm">
    <div class="form-section-title d-flex align-items-center justify-content-between">
        <div>
            <i class="fas fa-code me-2" style="color: #2d0b36;"></i> 
            <span>معلومات SEO</span>
        </div>
        <span class="badge badge-purple-soft">
            <i class="fas fa-lock me-1"></i> للقراءة فقط
        </span>
    </div>
    
    <div class="row g-3">
        <!-- Meta Title -->
        <div class="col-md-6">
            <div class="form-group">
                <label class="form-label fw-bold" style="color: #2d0b36;">
                    <i class="fas fa-heading me-1" style="color: #2d0b36;"></i> عنوان SEO (Meta Title)
                </label>
                <input type="text" 
                       class="form-control" 
                       value="{{ product.seo.title if product.seo and product.seo.title else '' }}" 
                       readonly
                       style="background-color: #f8f9fa; cursor: default;">
                <small class="text-muted mt-1 d-block">
                    <i class="fas fa-lock me-1" style="color: #2d0b36;"></i> يُدار بواسطة الإدارة
                </small>
            </div>
        </div>
        
        <!-- Meta Description -->
        <div class="col-md-6">
            <div class="form-group">
                <label class="form-label fw-bold" style="color: #2d0b36;">
                    <i class="fas fa-align-left me-1" style="color: #2d0b36;"></i> وصف SEO (Meta Description)
                </label>
                <input type="text" 
                       class="form-control" 
                       value="{{ product.seo.description if product.seo and product.seo.description else '' }}" 
                       readonly
                       style="background-color: #f8f9fa; cursor: default;">
            </div>
        </div>
        
        <!-- Meta Keywords -->
        <div class="col-12">
            <div class="form-group">
                <label class="form-label fw-bold" style="color: #2d0b36;">
                    <i class="fas fa-tags me-1" style="color: #2d0b36;"></i> الكلمات المفتاحية (Keywords)
                </label>
                <input type="text" 
                       class="form-control" 
                       value="{{ product.seo.keywords if product.seo and product.seo.keywords else '' }}" 
                       readonly
                       style="background-color: #f8f9fa; cursor: default;">
                <small class="text-muted mt-1 d-block">
                    <i class="fas fa-lock me-1" style="color: #2d0b36;"></i> تُدار بواسطة الإدارة
                </small>
            </div>
        </div>
    </div>
</div>

    background: linear-gradient(135deg, #faf8f6, #ffffff);

}
