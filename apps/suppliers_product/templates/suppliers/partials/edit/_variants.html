<!-- ============================================================
   🔀 خيارات ومتغيرات المنتج (للمورد - إدارة كاملة)
   ============================================================ -->
<div class="form-section variants-card shadow-sm">
    <div class="form-section-title d-flex align-items-center justify-content-between">
        <div>
            <i class="fas fa-layer-group me-2" style="color: #2d0b36;"></i> 
            <span>خيارات ومتغيرات المنتج</span>
        </div>
        <span class="badge badge-gold-soft">
            <i class="fas fa-sliders-h me-1"></i> تعديل وإضافة
        </span>
    </div>

    <!-- ✅ إدارة الخيارات -->
    <div class="form-group mb-4">
        <label class="form-label fw-bold text-dark-purple mb-2">إدارة الخيارات (الألوان، المقاسات...)</label>
        <div id="optionsContainer" class="d-flex flex-column gap-3">
            <!-- يتم تحميل الخيارات الحالية عبر JavaScript من product.options -->
        </div>
        <button class="btn btn-outline-purple w-100 mt-3 py-2 fw-bold" type="button" onclick="addOptionRow()">
            <i class="fas fa-plus-circle me-1"></i> إضافة خيار جديد
        </button>
    </div>

    <!-- ✅ جدول المتغيرات -->
    <div class="form-group mb-0">
        <label class="form-label fw-bold text-dark-purple mb-2">تخصيص سعر التكلفة والكمية لكل متغير</label>
        <div id="variantsTableContainer" class="table-responsive">
            <!-- يتم توليد الجدول تلقائياً من product.variants -->
        </div>
    </div>
</div>

<style>
/* (نفس الـ Styles السابقة، أضف فقط هذا) */
.variants-card {
    background: linear-gradient(135deg, #faf8f6, #ffffff);
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
}
/* ... باقي الـ Styles كما هي ... */
</style>

<script>
// ============================================================
// دوال إدارة الخيارات (إضافة، حذف، إضافة قيم)
// ============================================================
function addOptionRow() {
    const container = document.getElementById('optionsContainer');
    const row = document.createElement('div');
    row.className = 'option-row p-3 rounded-3 bg-white';
    row.innerHTML = `
        <div class="option-header d-flex gap-2 mb-2 flex-wrap">
            <input type="text" class="form-control custom-input opt-name" placeholder="اسم الخيار (مثل: اللون)" style="flex: 1; min-width: 150px;">
            <button class="btn btn-outline-danger btn-sm px-3 delete-opt-btn" type="button" onclick="removeOptionRow(this)"><i class="fas fa-trash-alt"></i> حذف</button>
        </div>
        <label class="form-label text-muted" style="font-size: 0.85rem; margin-bottom: 6px;">القيم المتعددة:</label>
        <div class="values-container d-flex flex-wrap gap-2 mb-2"></div>
        <div class="add-value-group input-group input-group-sm">
            <input type="text" class="form-control custom-input val-input" placeholder="أدخل قيمة ثم اضغط إضافة (مثل: أحمر)">
            <button class="btn btn-gold-gradient" type="button" onclick="addValueToRow(this)"><i class="fas fa-plus me-1"></i> إضافة قيمة</button>
        </div>
    `;
    container.appendChild(row);
}

function removeOptionRow(btn) {
    if (!confirm('حذف هذا الخيار وجميع قيمه؟')) return;
    btn.closest('.option-row').remove();
    updateVariantsTable();
}

function addValueToRow(btn) {
    const input = btn.closest('.add-value-group').querySelector('.val-input');
    const val = input.value.trim();
    if (!val) return;
    const container = btn.closest('.option-row').querySelector('.values-container');
    const tag = document.createElement('div');
    tag.className = 'value-tag';
    tag.innerHTML = `${val} <span onclick="this.closest('.value-tag').remove(); updateVariantsTable();">&times;</span>`;
    container.appendChild(tag);
    input.value = '';
    updateVariantsTable();
}

function updateVariantsTable() {
    const rows = document.querySelectorAll('.option-row');
    const container = document.getElementById('variantsTableContainer');
    
    if (!rows.length || rows.length === 0) {
        container.innerHTML = `<div class="alert alert-light text-center p-4 rounded-3 border border-dashed"><i class="fas fa-info-circle me-2" style="color: #2d0b36;"></i> هذا المنتج لا يحتوي على خيارات أو متغيرات حالياً.</div>`;
        return;
    }

    // تجميع الخيارات والقيم
    let combinations = [];
    let firstRow = true;
    rows.forEach(row => {
        const name = row.querySelector('.opt-name').value.trim() || 'خيار';
        const values = [];
        row.querySelectorAll('.value-tag').forEach(tag => {
            const val = tag.textContent.replace('×', '').trim();
            if (val) values.push(val);
        });
        if (values.length === 0) {
            values.push('الافتراضي');
        }
        if (firstRow) {
            combinations = values.map(v => [{key: name, value: v}]);
            firstRow = false;
        } else {
            let newCombos = [];
            combinations.forEach(combo => {
                values.forEach(val => {
                    newCombos.push([...combo, {key: name, value: val}]);
                });
            });
            combinations = newCombos;
        }
    });

    // إنشاء الجدول
    let html = `<div class="table-responsive"><table class="table table-bordered align-middle"><thead class="bg-light"><tr><th>#</th><th>الصورة</th><th>الخيارات</th><th>السعر الحالي (ر.س)</th><th>الكمية الحالية</th><th>سعر التكلفة (للمورد)</th><th>الكمية (للمورد)</th></tr></thead><tbody>`;
    combinations.forEach((combo, index) => {
        let qid = `variant_${index}_${Date.now()}`;
        let optsHtml = combo.map(o => `<span class="badge bg-light text-dark border me-1">${o.key}: ${o.value}</span>`).join(' ');
        html += `
            <tr>
                <td>${index + 1}</td>
                <td><img src="" class="variant-img" alt="صورة"></td>
                <td>${optsHtml}</td>
                <td><span class="fw-bold text-dark">0.0</span></td>
                <td><span class="badge bg-light text-dark border">0</span></td>
                <td>
                    <div class="input-group input-group-sm">
                        <input type="number" step="0.01" name="variant_cost_${qid}" class="form-control text-center" value="0.0">
                        <span class="input-group-text" style="background: #2d0b36; color: #D4AF37; border: none;">ر.س</span>
                    </div>
                </td>
                <td>
                    <input type="number" name="variant_qty_${qid}" class="form-control text-center" value="0">
                </td>
            </tr>
        `;
    });
    html += `</tbody></table></div>`;
    container.innerHTML = html;
}

// تهيئة الصفحة عند التحميل
document.addEventListener('DOMContentLoaded', function() {
    const optionsContainer = document.getElementById('optionsContainer');
    const variantsContainer = document.getElementById('variantsTableContainer');

    // تحميل الخيارات الموجودة من product.options (القادم من قمرة)
    {% if product.options and product.options|length > 0 %}
        {% for opt in product.options %}
            (function() {
                const row = document.createElement('div');
                row.className = 'option-row p-3 rounded-3 bg-white';
                row.innerHTML = `
                    <div class="option-header d-flex gap-2 mb-2 flex-wrap">
                        <input type="text" class="form-control custom-input opt-name" value="{{ opt.name }}" placeholder="اسم الخيار" style="flex: 1; min-width: 150px;">
                        <button class="btn btn-outline-danger btn-sm px-3 delete-opt-btn" type="button" onclick="removeOptionRow(this)"><i class="fas fa-trash-alt"></i> حذف</button>
                    </div>
                    <label class="form-label text-muted" style="font-size: 0.85rem; margin-bottom: 6px;">القيم المتعددة:</label>
                    <div class="values-container d-flex flex-wrap gap-2 mb-2">
                        {% for val in opt.values %}
                            <div class="value-tag">
                                {{ val.label if val.label is defined else val }} 
                                <span onclick="this.closest('.value-tag').remove(); updateVariantsTable();">&times;</span>
                            </div>
                        {% endfor %}
                    </div>
                    <div class="add-value-group input-group input-group-sm">
                        <input type="text" class="form-control custom-input val-input" placeholder="أدخل قيمة ثم اضغط إضافة (مثل: أحمر)">
                        <button class="btn btn-gold-gradient" type="button" onclick="addValueToRow(this)"><i class="fas fa-plus me-1"></i> إضافة قيمة</button>
                    </div>
                `;
                optionsContainer.appendChild(row);
            })();
        {% endfor %}
    {% endif %}

    // إذا كانت المتغيرات موجودة بالفعل (من product.variants)، قم بإنشاء جدول منها
    {% if product.variants and product.variants|length > 0 %}
        let html = `<div class="table-responsive"><table class="table table-bordered align-middle"><thead class="bg-light"><tr><th>#</th><th>الصورة</th><th>الخيارات</th><th>السعر الحالي (ر.س)</th><th>الكمية الحالية</th><th>سعر التكلفة (للمورد)</th><th>الكمية (للمورد)</th></tr></thead><tbody>`;
        {% for variant in product.variants %}
            let optsHtml = '';
            {% if variant.options and variant.options|length > 0 %}
                {% for opt in variant.options %}
                    optsHtml += `<span class="badge bg-light text-dark border me-1">{{ opt.label if opt.label is defined else opt.value }}</span>`;
                {% endfor %}
            {% else %}
                optsHtml = '<span class="text-muted">—</span>';
            {% endif %}
            let imgUrl = '';
            {% if variant.images and variant.images|length > 0 %}
                {% for img in variant.images %}
                    {% if img.url or img.fileUrl %}
                        imgUrl = '{{ img.url if img.url else img.fileUrl }}';
                        break;
                    {% endif %}
                {% endfor %}
            {% endif %}
            let price = '{{ variant.pricing.price if variant.pricing else 0.0 }}';
            let qty = '{{ variant.quantity if variant.quantity is not none else 0 }}';
            let variantQid = '{{ variant.qid if variant.qid else '' }}';
            html += `
                <tr>
                    <td>{{ loop.index }}</td>
                    <td><img src="${imgUrl}" class="variant-img" alt="صورة" onerror="this.src='{{ url_for('static', filename='img/default-product.png') }}'"></td>
                    <td>${optsHtml}</td>
                    <td><span class="fw-bold text-dark">${price}</span></td>
                    <td><span class="badge bg-light text-dark border">${qty}</span></td>
                    <td>
                        <div class="input-group input-group-sm">
                            <input type="number" step="0.01" name="variant_cost_${variantQid}" class="form-control text-center" value="0.0">
                            <span class="input-group-text" style="background: #2d0b36; color: #D4AF37; border: none;">ر.س</span>
                        </div>
                    </td>
                    <td>
                        <input type="number" name="variant_qty_${variantQid}" class="form-control text-center" value="0">
                    </td>
                </tr>
            `;
        {% endfor %}
        html += `</tbody></table></div>`;
        variantsContainer.innerHTML = html;
    {% endif %}
});
</script>
