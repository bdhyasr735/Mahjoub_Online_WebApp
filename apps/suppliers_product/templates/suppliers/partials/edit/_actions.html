<div class="mb-3">
    <label class="form-label fw-bold">حالة المنتج</label>
    <select name="status" class="form-select" {% if prod_status == 'PUBLISHED' %}disabled{% endif %}>
        <option value="PENDING" {% if prod_status == 'PENDING' %}selected{% endif %}>قيد المراجعة</option>
        <option value="PUBLISHED" {% if prod_status == 'PUBLISHED' %}selected{% endif %}>منشور</option>
        <option value="REJECTED" {% if prod_status == 'REJECTED' %}selected{% endif %}>مرفوض</option>
        <option value="OUT_OF_STOCK" {% if prod_status == 'OUT_OF_STOCK' %}selected{% endif %}>نفد من المخزون</option>
    </select>
    {% if prod_status == 'PUBLISHED' %}
        <small class="text-danger d-block mt-1"><i class="fas fa-lock me-1"></i> لا يمكن تغيير الحالة لأن المنتج منشور بالفعل.</small>
    {% endif %}
</div>

<div class="d-grid gap-2 mt-3">
    <button type="submit" class="btn btn-custom btn-lg w-100 fw-bold"><i class="fas fa-save me-2"></i> حفظ التغييرات</button>
    <a href="{{ url_for('admin_product_bp.manage_products_view') }}" class="btn btn-outline-secondary w-100 mt-2">إلغاء والعودة</a>
</div>
