<div class="mb-3">
    <label class="form-label fw-bold">حالة المنتج</label>
    <select name="status" class="form-select">
        <option value="PUBLISHED" {% if prod_status == 'PUBLISHED' %}selected{% endif %}>منشور (متاح للبيع)</option>
        <option value="DRAFT" {% if prod_status == 'DRAFT' %}selected{% endif %}>مسودة (غير منشور)</option>
        <option value="OUT_OF_STOCK" {% if prod_status == 'OUT_OF_STOCK' %}selected{% endif %}>نفد من المخزون</option>
        <option value="INACTIVE" {% if prod_status == 'INACTIVE' %}selected{% endif %}>غير نشط</option>
    </select>
</div>

<div class="d-grid gap-2 mt-4">
    <button type="submit" form="productEditForm" class="btn btn-custom btn-lg fw-bold">
        <i class="fas fa-save me-2"></i> حفظ المنتج
    </button>
    <a href="{{ url_for('suppliers_product_bp.list_supplier_products') }}" class="btn btn-outline-secondary mt-2">
        <i class="fas fa-times me-1"></i> إلغاء والعودة
    </a>
</div>
