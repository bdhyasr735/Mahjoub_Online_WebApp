<div class="row g-3">
    <div class="col-md-6">
        <label class="form-label fw-bold">اسم المنتج <span class="text-danger">*</span></label>
        <input type="text" name="title" class="form-control" value="{{ prod_title }}" required>
    </div>
    <div class="col-md-6">
        <label class="form-label fw-bold">الرمز التعريفي (SKU)</label>
        <input type="text" name="sku" class="form-control bg-light" value="{{ prod_sku }}" readonly>
    </div>
    <div class="col-md-4">
        <label class="form-label fw-bold">السعر (ر.س) <span class="text-danger">*</span></label>
        <input type="number" step="0.01" name="price" class="form-control" value="{{ prod_price }}" required>
    </div>
    <div class="col-md-4">
        <label class="form-label fw-bold">الكمية المتاحة</label>
        <input type="number" name="quantity" class="form-control" value="{{ prod_qty }}">
    </div>
    <div class="col-md-4">
        <label class="form-label fw-bold">الوزن (كجم)</label>
        <input type="number" step="0.01" name="weight" class="form-control" value="{{ prod_weight }}">
    </div>
</div>
