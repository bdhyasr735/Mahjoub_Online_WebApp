<!-- ================= صور المنتج (للمورد - للقراءة فقط) ================= -->
<div class="form-section images-card">
    <div class="form-section-title">
        <i class="fas fa-images"></i>
        صور المنتج
        <span class="badge-count"><i class="fas fa-lock"></i> للقراءة فقط</span>
    </div>
    
    <!-- ✅ معرض الصور (عرض فقط) -->
    <div class="image-gallery" id="imagePreviewGrid">
        {% if prod_images and prod_images|length > 0 %}
            {% for image in prod_images %}
            <div class="gallery-item">
                <img src="{{ image.fileUrl if image.fileUrl else image }}" alt="صورة المنتج" loading="lazy">
            </div>
            {% endfor %}
        {% else %}
            <div class="gallery-empty">
                <i class="fas fa-image"></i>
                <p>لا توجد صور لهذا المنتج.</p>
            </div>
        {% endif %}
    </div>
    
    <!-- ✅ معلومات بسيطة -->
    <div class="gallery-footer">
        <div class="gallery-stats">
            <span><i class="fas fa-images"></i> <strong id="imagesCountDisplay">{{ prod_images|length if prod_images else 0 }}</strong> صورة</span>
        </div>
    </div>
</div>

<style>
.images-card {
    border: 1px solid rgba(212, 175, 55, 0.15);
    background: linear-gradient(135deg, #faf8f6, #ffffff);
    padding: 24px 28px !important;
    border-radius: 16px;
}
.images-card .badge-count {
    font-size: 0.65rem; font-weight: 400; padding: 2px 10px;
    border-radius: 12px; background: #f1f5f9; color: #64748b;
    margin-left: 8px; display: inline-flex; align-items: center; gap: 4px;
}
.image-gallery {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px; min-height: 80px;
}
.gallery-item {
    position: relative; border-radius: 10px; overflow: hidden;
    aspect-ratio: 1; background: #f8f9fa;
    border: 2px solid #e2e8f0;
}
.gallery-item img { width: 100%; height: 100%; object-fit: cover; }
.gallery-empty {
    grid-column: 1/-1; text-align: center; padding: 30px;
    color: #94a3b8; background: #f8fafc; border-radius: 10px;
}
.gallery-empty i { font-size: 2rem; color: #2d0b36; }
.gallery-footer {
    display: flex; flex-wrap: wrap; justify-content: flex-start;
    align-items: center; padding-top: 12px; margin-top: 12px;
    border-top: 1px solid #e2e8f0; gap: 8px;
}
.gallery-stats { display: flex; gap: 8px; font-size: 0.8rem; color: #64748b; }
.gallery-stats i { color: #2d0b36; margin-right: 4px; }
.gallery-stats strong { color: #0f172a; }
@media (max-width: 768px) {
    .images-card { padding: 16px 14px !important; }
    .image-gallery { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
}
</style>
