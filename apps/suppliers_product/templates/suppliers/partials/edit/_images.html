<div class="mb-3">
    <label class="form-label fw-bold">الصور الحالية</label>
    <div class="d-flex flex-wrap gap-2 mb-3">
        {% for img_url in prod_images %}
            <div class="position-relative border rounded-3 p-1" style="width: 70px; height: 70px; background: #f8f9fa;">
                <img src="{{ img_url }}" class="w-100 h-100 object-fit-contain rounded-2" alt="صورة المنتج">
            </div>
        {% else %}
            <p class="text-muted small mb-0">لا توجد صور مرفوعة لهذا المنتج.</p>
        {% endfor %}
    </div>

    <label class="form-label fw-bold mt-2">رفع صور جديدة</label>
    <input type="file" name="new_images" class="form-control" accept="image/*" multiple>
    <small class="text-muted">يمكنك اختيار عدة صور دفعة واحدة.</small>
</div>
