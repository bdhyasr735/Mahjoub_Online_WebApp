<!-- apps/suppliers_product/templates/suppliers/partials/edit/_images.html -->

<style>
    .image-preview {
        max-width: 150px;
        max-height: 150px;
        object-fit: cover;
        border-radius: 8px;
        border: 2px solid #e9ecef;
    }
    .preview-container {
        position: relative;
        display: inline-block;
    }
    .btn-remove-image {
        position: absolute;
        top: -10px;
        right: -10px;
        background: #dc3545;
        color: white;
        border: none;
        border-radius: 50%;
        width: 28px;
        height: 28px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }
    .btn-remove-image:hover {
        transform: scale(1.1);
        background: #c82333;
    }
    .upload-area {
        border: 2px dashed #dee2e6;
        border-radius: 12px;
        padding: 30px;
        text-align: center;
        cursor: pointer;
        background: #f8f9fa;
        transition: all 0.3s ease;
    }
    .upload-area:hover {
        border-color: var(--dark-purple, #2d0b36);
        background: #f8f5fa;
    }
</style>

<div class="mb-3">
    <label class="form-label fw-bold mb-3">
        <i class="fas fa-image text-muted me-1"></i> صور المنتج
    </label>

    {# ✅ الصورة الحالية #}
    {% if prod_images and prod_images|length > 0 %}
    <div class="mb-3" id="currentImageContainer">
        <label class="form-label text-muted small d-block mb-1">الصورة الحالية:</label>
        <div class="preview-container">
            {% set first_image = prod_images[0] %}
            <img src="{{ first_image.url or first_image.fileUrl or first_image }}" alt="صورة المنتج" class="image-preview">
            <button type="button" class="btn-remove-image" onclick="removeCurrentImage()" title="حذف الصورة">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <input type="hidden" name="current_image_id" value="{{ first_image.id or first_image._id or '' }}">
    </div>
    {% endif %}

    {# ✅ رفع صورة جديدة #}
    <div class="upload-area" id="uploadArea">
        <i class="fas fa-cloud-upload-alt fa-2x text-muted mb-2 upload-icon"></i>
        <p class="mb-0 fw-bold">اسحب صورة جديدة هنا أو اضغط للاختيار</p>
        <small class="text-muted">JPG, PNG, GIF, WEBP - حد أقصى 5MB</small>
        <input type="file" name="image" id="imageInput" accept="image/*" style="display: none;">
    </div>

    {# ✅ معاينة الصورة الجديدة #}
    <div class="mt-3" id="imagePreview" style="display: none;">
        <label class="form-label text-muted small d-block mb-1">معاينة الصورة الجديدة:</label>
        <div class="preview-container">
            <img id="previewImage" src="#" alt="معاينة" class="image-preview">
            <button type="button" class="btn-remove-image" onclick="removeNewImage()">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const previewImage = document.getElementById('previewImage');

        if (uploadArea && imageInput) {
            uploadArea.addEventListener('click', function(e) {
                if (!e.target.closest('.btn-remove-image')) {
                    imageInput.click();
                }
            });

            imageInput.addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    if (file.size > 5 * 1024 * 1024) {
                        if (typeof showToast === 'function') {
                            showToast('❌ حجم الصورة كبير جداً. الحد الأقصى 5MB', 'danger');
                        }
                        this.value = '';
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = function(e) {
                        previewImage.src = e.target.result;
                        imagePreview.style.display = 'block';
                        const currentContainer = document.getElementById('currentImageContainer');
                        if (currentContainer) {
                            currentContainer.style.display = 'none';
                        }
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        window.removeNewImage = function() {
            if (imageInput) imageInput.value = '';
            if (imagePreview) imagePreview.style.display = 'none';
            if (previewImage) previewImage.src = '#';
            const currentContainer = document.getElementById('currentImageContainer');
            if (currentContainer) {
                currentContainer.style.display = 'block';
            }
        };

        window.removeCurrentImage = function() {
            const container = document.getElementById('currentImageContainer');
            if (container) {
                container.style.display = 'none';
            }
        };
    });
</script>
