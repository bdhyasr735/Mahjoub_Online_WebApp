<div class="mb-3">
    <label class="form-label fw-bold">عنوان صفحة المنتج (Meta Title)</label>
    <input type="text" name="meta_title" class="form-control" value="{{ prod_title }}" placeholder="عنوان يظهر في جوجل">
</div>
<div class="mb-3">
    <label class="form-label fw-bold">الوصف الميتا (Meta Description)</label>
    <textarea name="meta_description" class="form-control" rows="2" placeholder="وصف مختصر للظهور في نتائج البحث">{{ prod_desc[:160] }}</textarea>
</div>
