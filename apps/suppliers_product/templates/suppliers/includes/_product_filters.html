<!-- 📂 apps/admin_Product/templates/admin/includes/_product_filters.html -->
<div class="card shadow-sm border-0 mb-4" style="border-radius: 16px; background: linear-gradient(145deg, #ffffff, #f8f5f0); border: 1px solid rgba(212, 175, 55, 0.2);">
    <div class="card-body p-4">
        <form method="GET" action="{{ url_for('admin_product_bp.manage_products_view') }}" class="row g-3 align-items-center">
            
            <!-- حقل البحث بالنص -->
            <div class="col-md-5">
                <label for="searchTitle" class="form-label fw-bold" style="color: #2d0b36; font-size: 0.9rem;">بحث عن منتج</label>
                <div class="input-group">
                    <span class="input-group-text" style="background: #2d0b36; color: #D4AF37; border: none;">
                        <i class="fas fa-search"></i>
                    </span>
                    <input type="text" id="searchTitle" name="title" value="{{ search_title or '' }}" 
                           class="form-control" placeholder="أدخل اسم المنتج للبحث..." 
                           style="border-color: #ced4da; box-shadow: none;">
                </div>
            </div>

            <!-- فلتر الحالة -->
            <div class="col-md-4">
                <label for="filterStatus" class="form-label fw-bold" style="color: #2d0b36; font-size: 0.9rem;">حالة المنتج</label>
                <select id="filterStatus" name="status" class="form-select" style="border-color: #ced4da; box-shadow: none;">
                    <option value="">جميع الحالات</option>
                    <option value="PUBLISHED" {{ 'selected' if current_status == 'PUBLISHED' }}>منشور</option>
                    <option value="DRAFT" {{ 'selected' if current_status == 'DRAFT' }}>قيد المراجعة / مسودة</option>
                    <option value="REJECTED" {{ 'selected' if current_status == 'REJECTED' }}>مرفوض</option>
                    <option value="ARCHIVED" {{ 'selected' if current_status == 'ARCHIVED' }}>مؤرشَف</option>
                </select>
            </div>

            <!-- أزرار التصفية -->
            <div class="col-md-3 d-flex align-items-end gap-2 mt-auto">
                <button type="submit" class="btn w-100" style="background: linear-gradient(135deg, #2d0b36, #1a0520); color: #D4AF37; border: none; font-weight: 600; border-radius: 8px; padding: 8px;">
                    <i class="fas fa-filter me-1"></i> تصفية
                </button>
                {% if search_title or current_status %}
                <a href="{{ url_for('admin_product_bp.manage_products_view') }}" class="btn btn-outline-secondary" title="إعادة ضبط الفلاتر" style="border-radius: 8px; padding: 8px 12px;">
                    <i class="fas fa-undo"></i>
                </a>
                {% endif %}
            </div>

        </form>
    </div>
</div>
