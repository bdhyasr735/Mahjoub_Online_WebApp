<!-- apps/suppliers_product/templates/suppliers/includes/_product_filters.html -->

<div class="row g-3 mb-4 align-items-center">
    <!-- ✅ شريط البحث المباشر -->
    <div class="col-md-6">
        <div class="search-box position-relative">
            <span class="position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">
                <i class="fas fa-search"></i>
            </span>
            <input type="text" id="searchInput" class="form-control ps-5 py-2 rounded-pill shadow-sm border-0" 
                   placeholder="ابحث عن منتج بالاسم، الكود، أو الوصف..." 
                   value="{{ request.args.get('search', '') }}"
                   style="background-color: #f8f9fa;">
        </div>
    </div>

    <!-- ✅ أزرار تصفية المنتجات (Filter Tabs) -->
    <div class="col-md-6">
        <div class="filter-tabs d-flex flex-wrap gap-2 justify-content-md-end align-items-center">
            {% set current_filter = request.args.get('filter', 'all') %}
            
            <button type="button" class="btn btn-sm filter-btn {% if current_filter == 'all' %}active{% endif %}" 
                    data-filter="all" onclick="applyFilter('all', this)">
                <i class="fas fa-list me-1"></i> الكل 
                <span class="badge bg-light text-dark ms-1">{{ counts.all|default(0) }}</span>
            </button>
            
            <button type="button" class="btn btn-sm filter-btn {% if current_filter == 'active' %}active{% endif %}" 
                    data-filter="active" onclick="applyFilter('active', this)">
                <i class="fas fa-check-circle me-1 text-success"></i> النشطة 
                <span class="badge bg-light text-dark ms-1">{{ counts.active|default(0) }}</span>
            </button>
            
            <button type="button" class="btn btn-sm filter-btn {% if current_filter == 'inactive' %}active{% endif %}" 
                    data-filter="inactive" onclick="applyFilter('inactive', this)">
                <i class="fas fa-pause-circle me-1 text-warning"></i> المتوقفة 
                <span class="badge bg-light text-dark ms-1">{{ counts.inactive|default(0) }}</span>
            </button>
            
            <button type="button" class="btn btn-sm filter-end {% if current_filter == 'out_of_stock' %}active{% endif %}" 
                    data-filter="out_of_stock" onclick="applyFilter('out_of_stock', this)">
                <i class="fas fa-exclamation-triangle me-1 text-danger"></i> نفاذ المخزون 
                <span class="badge bg-light text-dark ms-1">{{ counts.out_of_stock|default(0) }}</span>
            </button>
        </div>
    </div>
</div>

{# ✅ تنسيقات CSS الخاصة بالفلتر والبحث #}
<style>
    .filter-btn {
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 0.85rem;
        font-weight: 500;
        background-color: #f1f3f5;
        color: #495057;
        border: none;
        transition: all 0.2s ease;
    }
    
    .filter-btn:hover {
        background-color: rgba(45, 11, 54, 0.08);
        color: var(--dark-purple, #2d0b36);
        transform: translateY(-1px);
    }
    
    .filter-btn.active {
        background-color: var(--dark-purple, #2d0b36) !important;
        color: #fff !important;
        box-shadow: 0 4px 12px rgba(45, 11, 54, 0.25);
    }
    
    .filter-btn.active .badge {
        background-color: rgba(255, 255, 255, 0.2) !important;
        color: #fff !important;
    }

    #searchInput {
        transition: all 0.3s ease;
    }

    #searchInput:focus {
        background-color: #fff !important;
        box-shadow: 0 0 0 0.25rem rgba(45, 11, 54, 0.12) !important;
    }

    /* استجابة للشاشات الصغيرة */
    @media (max-width: 768px) {
        .filter-tabs {
            justify-content: flex-start !important;
            margin-top: 0.5rem;
        }
    }
</style>
