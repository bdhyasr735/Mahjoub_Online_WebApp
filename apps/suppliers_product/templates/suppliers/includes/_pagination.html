{% if pagination.total_pages > 1 %}
<nav class="mt-4" id="paginationNav">
    <ul class="pagination justify-content-center">
        <li class="page-item {{ 'disabled' if not pagination.has_prev else '' }}">
            <button class="page-link" onclick="fetchProducts({{ pagination.prev_num }})" {{ 'disabled' if not pagination.has_prev else '' }} style="background: none; border: none; color: #2d0b36; {{ 'opacity: 0.5; cursor: not-allowed;' if not pagination.has_prev else '' }}">السابق</button>
        </li>

        <!-- ✅ هنا نستخدم حلقة بسيطة جداً لرسم الأرقام -->
        {% for page_num in range(1, pagination.total_pages + 1) %}
            <li class="page-item {{ 'active' if page_num == pagination.current_page else '' }}">
                <button class="page-link" onclick="fetchProducts({{ page_num }})" 
                        style="{{ 'background: #2d0b36; color: #D4AF37; border-color: #2d0b36;' if page_num == pagination.current_page else 'color: #2d0b36; background: none; border: none;' }}">
                    {{ page_num }}
                </button>
            </li>
        {% endfor %}

        <li class="page-item {{ 'disabled' if not pagination.has_next else '' }}">
            <button class="page-link" onclick="fetchProducts({{ pagination.next_num }})" {{ 'disabled' if not pagination.has_next else '' }} style="background: none; border: none; color: #2d0b36; {{ 'opacity: 0.5; cursor: not-allowed;' if not pagination.has_next else '' }}">التالي</button>
        </li>
    </ul>
</nav>
{% endif %}
