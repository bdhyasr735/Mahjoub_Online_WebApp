<!-- 📂 apps/suppliers_product/templates/suppliers/includes/_sync_modal.html -->
<!-- نافذة المزامنة المنبثقة المتطورة للمورد -->

<div id="syncModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); z-index: 10000; align-items: center; justify-content: center;" dir="rtl">
    <div class="sync-modal-box" style="
        background: linear-gradient(145deg, #ffffff, #f8f5f0);
        padding: 45px 40px;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(45, 11, 54, 0.4);
        text-align: center;
        min-width: 360px;
        max-width: 92%;
        width: 420px;
        position: relative;
        border: 1px solid rgba(212, 175, 55, 0.15);
        transition: all 0.3s ease;
    ">
        <!-- ✅ أيقونة التحميل المتحركة -->
        <div class="sync-icon-wrapper" style="position: relative; display: inline-block;">
            <div class="spinner-border" style="width: 4rem; height: 4rem; color: #D4AF37; border-width: 4px;" role="status">
                <span class="visually-hidden">جاري التحميل...</span>
            </div>
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5rem;">
                🔄
            </div>
        </div>
        
        <h4 class="mt-3" style="color: #2d0b36; font-weight: 700; font-size: 1.4rem;">جاري المزامنة</h4>
        <p id="syncStatusText" class="text-muted" style="font-size: 0.95rem; margin-bottom: 20px;">يرجى الانتظار، جلب البيانات وتحديثها...</p>
        
        <!-- ✅ شريط التقدم المتطور -->
        <div class="progress" style="height: 10px; border-radius: 12px; overflow: hidden; background: #f0ebe5;">
            <div 
                id="syncProgressBar"
                class="progress-bar progress-bar-striped progress-bar-animated" 
                style="width: 0%; background: linear-gradient(90deg, #2d0b36, #D4AF37, #ffd700); background-size: 200% 100%;"
            ></div>
        </div>
        
        <!-- ✅ رسائل المزامنة (تظهر بعد الانتهاء) -->
        <div id="syncResult" style="display:none; margin-top: 20px; width: 100%;">
            <div id="syncMessage" class="alert" style="margin-bottom: 0; border-radius: 12px; font-weight: 600; border: none;"></div>
            <div id="syncDetails" style="font-size: 14px; color: #6c757d; margin-top: 10px;"></div>
        </div>
        
        <!-- ✅ زر إغلاق النافذة -->
        <button type="button" onclick="closeSyncModal()" style="
            position: absolute;
            top: 12px;
            left: 16px;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #999;
            cursor: pointer;
            transition: all 0.3s;
            padding: 4px 10px;
            border-radius: 8px;
            line-height: 1;
        " onmouseover="this.style.color='#dc3545'; this.style.background='rgba(220,53,69,0.1)'" 
           onmouseout="this.style.color='#999'; this.style.background='none'">
            ✕
        </button>

        <!-- ✅ زر إلغاء أثناء التحميل -->
        <button id="cancelSyncBtn" onclick="cancelSync()" style="
            margin-top: 15px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 8px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            color: #6c757d;
            display: none;
        ">إلغاء المزامنة</button>
    </div>
</div>

<script>
// ✅ متغيرات التحكم
let isSyncing = false;
let syncCancelled = false;

// ✅ فتح نافذة المزامنة وبدء المزامنة التدريجية صفحة بصفحة
async function openSyncModal() {
    const modal = document.getElementById('syncModal');
    if (!modal || isSyncing) return;

    resetSyncModalState();
    modal.style.display = 'flex';
    isSyncing = true;
    syncCancelled = false;

    // إظهار زر الإلغاء
    const cancelBtn = document.getElementById('cancelSyncBtn');
    if (cancelBtn) cancelBtn.style.display = 'inline-block';

    // الحصول على CSRF token
    const csrfToken = document.querySelector('input[name="csrf_token"]')?.value || 
                      document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || 
                      '';

    let currentPage = 1;
    let hasNext = true;
    let totalSynced = 0;
    let totalPages = 1;
    let totalProcessed = 0;

    try {
        while (hasNext && !syncCancelled) {
            totalPages = Math.max(totalPages, currentPage);
            let progressPercentage = Math.min(Math.round((currentPage / totalPages) * 95), 95);
            updateSyncProgress(`جاري مزامنة الصفحة ${currentPage}...`, progressPercentage);

            // ✅ استخدام نقطة النهاية الجديدة sync_batch_products
            const response = await fetch("{{ url_for('suppliers_product_bp.sync_batch_products') }}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                    'X-CSRF-Token': csrfToken
                },
                body: JSON.stringify({ 
                    page: currentPage,
                    limit: 12 
                })
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`الخادم استجاب بحالة خطأ: ${response.status} - ${errorText}`);
            }

            const data = await response.json();

            if (!data.success) {
                throw new Error(data.message || 'فشلت عملية المزامنة');
            }

            // تحديث المؤشرات من الرد
            totalSynced += data.syncedCount || 0;
            totalProcessed += (data.syncedCount || 0) + (data.updatedCount || 0);
            totalPages = data.total_pages || totalPages;
            hasNext = data.has_next || false;
            currentPage = data.next_page || (currentPage + 1);

            // تحديث تفاصيل التقدم
            let detailMsg = `تمت مزامنة ${totalSynced} منتج جديد`;
            if (data.updatedCount > 0) detailMsg += `، تحديث ${data.updatedCount} منتج`;
            document.getElementById('syncDetails').textContent = detailMsg;
        }

        // ✅ التحقق إذا تم الإلغاء
        if (syncCancelled) {
            showSyncResult(false, 'تم إلغاء المزامنة يدوياً.', `تمت معالجة ${totalProcessed} منتج قبل الإلغاء.`);
            setTimeout(() => { closeSyncModal(); isSyncing = false; }, 2000);
            return;
        }

        // ✅ اكتمال المزامنة بنجاح
        updateSyncProgress('اكتملت المزامنة بنجاح!', 100);
        showSyncResult(
            true, 
            'تمت مزامنة جميع المنتجات بنجاح.', 
            `تمت إضافة ${totalSynced} منتج جديد إلى حسابك. إجمالي المعالجة: ${totalProcessed} منتج.`
        );

        // إخفاء زر الإلغاء
        if (cancelBtn) cancelBtn.style.display = 'none';

        setTimeout(() => {
            closeSyncModal();
            isSyncing = false;
            // تحديث الصفحة الرئيسية
            if (typeof fetchProducts === 'function') {
                fetchProducts(1);
            } else {
                window.location.reload();
            }
        }, 1500);

    } catch (error) {
        console.error('Sync Error:', error);
        if (!syncCancelled) {
            showSyncResult(false, error.message || 'حدث خطأ في الاتصال بالخادم، حاول لاحقاً.');
        }
        if (cancelBtn) cancelBtn.style.display = 'none';
        setTimeout(() => {
            closeSyncModal();
            isSyncing = false;
        }, 3000);
    }
}

// ✅ دالة إلغاء المزامنة
function cancelSync() {
    syncCancelled = true;
    const statusText = document.getElementById('syncStatusText');
    if (statusText) statusText.textContent = 'جاري إلغاء المزامنة...';
    const cancelBtn = document.getElementById('cancelSyncBtn');
    if (cancelBtn) {
        cancelBtn.disabled = true;
        cancelBtn.textContent = 'جاري الإلغاء...';
    }
}

// ✅ تحديث شريط التقدم
function updateSyncProgress(message, percentage) {
    const progressBar = document.getElementById('syncProgressBar');
    const statusText = document.getElementById('syncStatusText');
    
    if (progressBar) {
        const validPercentage = Math.min(Math.max(percentage, 0), 100);
        progressBar.style.width = validPercentage + '%';
        progressBar.setAttribute('aria-valuenow', validPercentage);
        progressBar.textContent = validPercentage + '%';
    }
    if (statusText && message) {
        statusText.textContent = message;
    }
}

// ✅ عرض نتيجة المزامنة
function showSyncResult(success, message, details) {
    const resultDiv = document.getElementById('syncResult');
    const messageDiv = document.getElementById('syncMessage');
    const detailsDiv = document.getElementById('syncDetails');
    const progressBar = document.getElementById('syncProgressBar');
    const statusText = document.getElementById('syncStatusText');
    const spinnerWrapper = document.querySelector('.sync-icon-wrapper');
    
    if (progressBar) progressBar.style.display = 'none';
    if (statusText) statusText.style.display = 'none';
    if (spinnerWrapper) spinnerWrapper.style.display = 'none';
    
    if (resultDiv) resultDiv.style.display = 'block';
    if (messageDiv) {
        messageDiv.className = `alert alert-${success ? 'success' : 'danger'}`;
        messageDiv.innerHTML = success ? '✅ ' + message : '❌ ' + message;
    }
    
    if (details && detailsDiv) {
        detailsDiv.textContent = details;
        detailsDiv.style.display = 'block';
    } else if (detailsDiv) {
        detailsDiv.style.display = 'none';
    }
}

// ✅ إعادة ضبط الحالة
function resetSyncModalState() {
    const resultDiv = document.getElementById('syncResult');
    const progressBar = document.getElementById('syncProgressBar');
    const statusText = document.getElementById('syncStatusText');
    const spinnerWrapper = document.querySelector('.sync-icon-wrapper');
    const cancelBtn = document.getElementById('cancelSyncBtn');
    
    if (resultDiv) resultDiv.style.display = 'none';
    if (spinnerWrapper) spinnerWrapper.style.display = 'inline-block';
    if (progressBar) {
        progressBar.style.display = 'block';
        progressBar.style.width = '0%';
        progressBar.textContent = '0%';
    }
    if (statusText) {
        statusText.style.display = 'block';
        statusText.textContent = 'يرجى الانتظار، جاري بدء مزامنة المنتجات...';
    }
    if (cancelBtn) {
        cancelBtn.style.display = 'none';
        cancelBtn.disabled = false;
        cancelBtn.textContent = 'إلغاء المزامنة';
    }
    syncCancelled = false;
}

// ✅ إخفاء النافذة
function resetSyncModal() {
    const modal = document.getElementById('syncModal');
    resetSyncModalState();
    if (modal) modal.style.display = 'none';
    isSyncing = false;
}

function closeSyncModal() {
    if (isSyncing) {
        if (!confirm('المزامنة ما زالت قيد التنفيذ. هل تريد إلغاءها وإغلاق النافذة؟')) {
            return;
        }
        syncCancelled = true;
    }
    resetSyncModal();
}

// ✅ إغلاق بالضغط على ESC
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        const modal = document.getElementById('syncModal');
        if (modal && modal.style.display === 'flex') {
            closeSyncModal();
        }
    }
});

// ✅ إغلاق بالضغط خارج الصندوق
const syncModalEl = document.getElementById('syncModal');
if (syncModalEl) {
    syncModalEl.addEventListener('click', function(event) {
        if (event.target === this) {
            closeSyncModal();
        }
    });
}
</script>

<style>
/* ✅ تأثير حركة على شريط التقدم */
@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}
#syncProgressBar {
    background-size: 200% 100%;
    animation: shimmer 2s ease-in-out infinite;
}

/* ✅ تأثير دخول النافذة */
@keyframes modalFadeIn {
    from {
        opacity: 0;
        transform: scale(0.9) translateY(-20px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}
.sync-modal-box {
    animation: modalFadeIn 0.4s ease-out forwards;
}

.alert-success {
    background: linear-gradient(135deg, #d4edda, #c3e6cb) !important;
    color: #155724 !important;
    border: 1px solid #b8daff !important;
}
.alert-danger {
    background: linear-gradient(135deg, #f8d7da, #f5c6cb) !important;
    color: #721c24 !important;
    border: 1px solid #f5c6cb !important;
}
</style>
