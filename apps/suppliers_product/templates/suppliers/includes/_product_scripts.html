<script>
    /**
     * دالة عامة لإظهار الإشعارات (Toast Notifications) الموحدة في لوحة التحكم
     */
    function showToast(type, message) {
        const colors = {
            success: '#28a745',
            error: '#dc3545',
            warning: '#ffc107',
            info: '#0d6efd'
        };
        
        const toast = document.createElement('div');
        toast.className = 'position-fixed bottom-0 end-0 p-3';
        toast.style.zIndex = '99999';
        toast.innerHTML = `
            <div class="toast show border-0 shadow-lg" role="alert" 
                 style="border-right: 4px solid ${colors[type] || colors.info}; background: white; border-radius: 12px; min-width: 280px;">
                <div class="toast-body d-flex align-items-center justify-content-between py-3">
                    <span style="font-weight: 600; color: #2d0b36;">${message}</span>
                    <button type="button" class="btn-close btn-close-sm ms-2" data-bs-dismiss="toast" onclick="this.closest('.position-fixed').remove()"></button>
                </div>
            </div>
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    // تفعيل الـ Tooltips من Bootstrap بشكل عام في لوحة التحكم إن وجدت
    document.addEventListener("DOMContentLoaded", function() {
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        });
    });
</script>
