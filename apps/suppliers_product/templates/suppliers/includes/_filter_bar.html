<!-- ✅ شريط الفلاتر والبحث المتقدم -->
<div class="card mb-4 shadow-sm border-0 rounded-4">
    <div class="card-body p-3 p-md-4">
        <div class="row g-3 align-items-end">
            <!-- البحث -->
            <div class="col-md-4">
                <label for="searchInput" class="form-label fw-bold small text-muted">🔍 بحث</label>
                <input type="text" id="searchInput" class="form-control" placeholder="اسم المنتج أو SKU..." style="border-radius: 10px; height: 45px; border-color: #2d0b36;">
            </div>
            <!-- فلتر الحالة -->
            <div class="col-md-3">
                <label for="statusFilter" class="form-label fw-bold small text-muted">📌 الحالة</label>
                <select id="statusFilter" class="form-select" style="border-radius: 10px; height: 45px; border-color: #2d0b36;">
                    <option value="">الكل</option>
                    <option value="PUBLISHED">منشور</option>
                    <option value="REVIEW">قيد المراجعة</option>
                    <option value="DRAFT">مسودة</option>
                </select>
            </div>
            <!-- فلتر السعر -->
            <div class="col-md-3">
                <label class="form-label fw-bold small text-muted">💰 السعر (ر.س)</label>
                <div class="input-group">
                    <input type="number" id="minPrice" class="form-control" placeholder="من" style="height: 45px; border-radius: 10px 0 0 10px; border-color: #2d0b36;">
                    <span class="input-group-text" style="background: #2d0b36; color: #D4AF37; border: none;">إلى</span>
                    <input type="number" id="maxPrice" class="form-control" placeholder="إلى" style="height: 45px; border-radius: 0 10px 10px 0; border-color: #2d0b36;">
                </div>
            </div>
            <!-- زر إعادة تعيين -->
            <div class="col-md-2">
                <button onclick="clearAllFilters()" class="btn btn-outline-secondary w-100" style="border-radius: 10px; height: 45px;" title="إعادة تعيين">
                    <i class="fas fa-undo"></i>
                </button>
            </div>
        </div>
    </div>
</div>
