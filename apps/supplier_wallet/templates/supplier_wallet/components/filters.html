<!-- Filter Bar Component (apps/supplier_wallet/templates/supplier_wallet/components/filters.html) -->
<div class="card border-0 shadow-sm mb-4">
    <div class="card-body p-4">
        <div class="d-flex align-items-center justify-content-between pb-3 mb-3 border-bottom">
            <h6 class="mb-0 fw-bold" style="color: var(--royal-purple-light);">تصفية حركة الحساب (per_page=10)</h6>
        </div>
        <form method="GET" action="{{ url_for('wallet.wallet') }}" class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label fw-bold text-secondary" style="font-size: 0.82rem;">البحث</label>
                <input type="text" name="search" value="{{ request.args.get('search', '') }}" placeholder="رقم المرجع أو البيان..." class="form-control form-control-sm">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold text-secondary" style="font-size: 0.82rem;">نوع العملية</label>
                <select name="type" class="form-select form-select-sm">
                    <option value="all">جميع العمليات</option>
                    <option value="credit">إيداع مبيعات (+)</option>
                    <option value="debit">سحب تحويل (-)</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold text-secondary" style="font-size: 0.82rem;">حالة العملية</label>
                <select name="status" class="form-select form-select-sm">
                    <option value="all">جميع الحالات</option>
                    <option value="completed">مكتملة</option>
                    <option value="pending">قيد المعالجة</option>
                </select>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn text-white w-100 py-1.5" style="background-color: var(--royal-purple); font-size: 0.85rem; font-weight: 600; border-radius: var(--radius);">
                    <i class="fas fa-filter ms-1"></i> تطبيق الفلتر
                </button>
            </div>
        </form>
    </div>
</div>
