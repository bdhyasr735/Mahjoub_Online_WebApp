<!-- Filter Bar Component (apps/supplier_wallet/templates/supplier_wallet/components/filters.html) -->
<div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 space-y-3">
    <div class="flex items-center justify-between pb-2 border-b border-gray-100">
        <span class="text-xs font-bold text-gray-800">فلاتر كشف الحساب وتخصيص العرض (components/filters.html)</span>
        <a href="{{ url_for('wallet.wallet') }}" class="text-[11px] text-gray-500 hover:text-[#4A154B] transition-colors">إعادة ضبط الفلتر</a>
    </div>
    <form method="GET" action="{{ url_for('wallet.wallet') }}" class="grid grid-cols-1 sm:grid-cols-5 gap-3 items-end">
        <div>
            <label class="block text-xs text-gray-600 mb-1">البحث المباشر</label>
            <input type="text" name="search" value="{{ request.args.get('search', '') }}" placeholder="رقم المرجع أو البيان..." class="w-full px-2.5 py-1.5 text-xs rounded border border-gray-300 focus:outline-none focus:ring-1 focus:ring-[#4A154B]">
        </div>
        <div>
            <label class="block text-xs text-gray-600 mb-1">من تاريخ</label>
            <input type="date" name="date_from" value="{{ request.args.get('date_from', '') }}" class="w-full px-2.5 py-1.5 text-xs rounded border border-gray-300 focus:outline-none focus:ring-1 focus:ring-[#4A154B]">
        </div>
        <div>
            <label class="block text-xs text-gray-600 mb-1">إلى تاريخ</label>
            <input type="date" name="date_to" value="{{ request.args.get('date_to', '') }}" class="w-full px-2.5 py-1.5 text-xs rounded border border-gray-300 focus:outline-none focus:ring-1 focus:ring-[#4A154B]">
        </div>
        <div>
            <label class="block text-xs text-gray-600 mb-1">نوع الحركة</label>
            <select name="type" class="w-full px-2.5 py-1.5 text-xs rounded border border-gray-300 focus:outline-none focus:ring-1 focus:ring-[#4A154B]">
                <option value="all">جميع العمليات</option>
                <option value="credit" {% if request.args.get('type') == 'credit' %}selected{% endif %}>إيداع مبيعات (+)</option>
                <option value="debit" {% if request.args.get('type') == 'debit' %}selected{% endif %}>سحب تحويل (-)</option>
            </select>
        </div>
        <div>
            <label class="block text-xs text-gray-600 mb-1">حالة الحركة</label>
            <select name="status" class="w-full px-2.5 py-1.5 text-xs rounded border border-gray-300 focus:outline-none focus:ring-1 focus:ring-[#4A154B]">
                <option value="all">جميع الحالات</option>
                <option value="completed" {% if request.args.get('status') == 'completed' %}selected{% endif %}>مكتملة</option>
                <option value="pending" {% if request.args.get('status') == 'pending' %}selected{% endif %}>قيد المعالجة</option>
            </select>
        </div>
        <div class="sm:col-span-5 flex justify-end mt-2">
            <button type="submit" class="px-5 py-1.5 rounded bg-[#4A154B] text-white text-xs font-bold hover:bg-[#3d113e] transition-colors">
                تطبيق الفلتر
            </button>
        </div>
    </form>
</div>
