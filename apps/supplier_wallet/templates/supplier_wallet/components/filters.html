{# 📂 apps/supplier_wallet/templates/supplier_wallet/components/filters.html #}

<div class="bg-white p-5 rounded-2xl border border-gray-200/80 shadow-xs space-y-4">
    <div class="flex items-center justify-between border-b border-gray-100 pb-3">
        <h3 class="text-xs font-black text-gray-900">{{ filter_title|default('تصفية البيانات') }}</h3>
        <a href="{{ action_url }}" class="text-[11px] font-bold text-gray-400 hover:text-gray-600 transition-colors">إعادة ضبط الفلاتر</a>
    </div>

    <form method="GET" action="{{ action_url }}" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 items-end">
        
        <!-- 1. البحث المباشر -->
        <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-700">البحث المباشر</label>
            <input type="text" name="search" value="{{ request.args.get('search', '') }}" placeholder="رقم المرجع أو البيان..." class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-xs text-gray-800 placeholder-gray-400 focus:outline-none focus:border-[#4A154B] focus:ring-1 focus:ring-[#4A154B]">
        </div>

        <!-- 2. فلتر نوع الحركة (يظهر فقط إذا كان show_type == true) -->
        {% if show_type|default(true) %}
        <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-700">نوع الحركة</label>
            <select name="type" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-xs text-gray-800 focus:outline-none focus:border-[#4A154B] focus:ring-1 focus:ring-[#4A154B]">
                <option value="">جميع الحركات</option>
                <option value="credit" {% if request.args.get('type') == 'credit' %}selected{% endif %}>إيداع / إيراد</option>
                <option value="debit" {% if request.args.get('type') == 'debit' %}selected{% endif %}>سحب / خصم</option>
            </select>
        </div>
        {% endif %}

        <!-- 3. فلتر الحالة (مختفي في wallet.html لأن show_status = false) -->
        {% if show_status %}
        <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-700">الحالة</label>
            <select name="status" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-xs text-gray-800 focus:outline-none focus:border-[#4A154B] focus:ring-1 focus:ring-[#4A154B]">
                <option value="">جميع الحالات</option>
                <option value="pending" {% if request.args.get('status') == 'pending' %}selected{% endif %}>قيد المراجعة</option>
                <option value="completed" {% if request.args.get('status') == 'completed' %}selected{% endif %}>مكتمل</option>
                <option value="rejected" {% if request.args.get('status') == 'rejected' %}selected{% endif %}>مرفوض / ملغي</option>
            </select>
        </div>
        {% endif %}

        <!-- 4. نطاق التواريخ -->
        {% if show_dates|default(true) %}
        <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-700">من تاريخ</label>
            <input type="date" name="start_date" value="{{ request.args.get('start_date', '') }}" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-xs text-gray-800 focus:outline-none focus:border-[#4A154B] focus:ring-1 focus:ring-[#4A154B]">
        </div>
        <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-700">إلى تاريخ</label>
            <input type="date" name="end_date" value="{{ request.args.get('end_date', '') }}" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-xs text-gray-800 focus:outline-none focus:border-[#4A154B] focus:ring-1 focus:ring-[#4A154B]">
        </div>
        {% endif %}

        <!-- 5. زر التصفية -->
        <div class="flex items-center gap-2 md:col-span-1">
            <button type="submit" class="w-full py-2.5 px-4 rounded-xl bg-[#4A154B] hover:bg-[#3B113F] text-white font-black text-xs transition-all shadow-xs">
                تصفية
            </button>
        </div>
    </form>
</div>
