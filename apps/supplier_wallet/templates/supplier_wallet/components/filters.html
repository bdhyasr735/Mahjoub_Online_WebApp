<!-- Filter Bar Component (apps/supplier_wallet/templates/supplier_wallet/components/filters.html) -->
<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 space-y-5">
    <div class="flex items-center justify-between pb-4 border-b border-gray-50">
        <span class="text-xs font-bold text-gray-900 uppercase tracking-wider flex items-center gap-2">
            <i class="fas fa-filter text-[#1f0b38]"></i> فلاتر كشف الحساب وتخصيص العرض
        </span>
        <a href="{{ url_for('wallet.wallet') }}" class="text-xs font-semibold text-gray-400 hover:text-[#1f0b38] transition-colors">إعادة ضبط الفلتر</a>
    </div>
    
    <form method="GET" action="{{ url_for('wallet.wallet') }}" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 items-end">
        <div>
            <label class="block text-xs font-bold text-gray-600 mb-2 uppercase tracking-wide">البحث المباشر</label>
            <input type="text" name="search" value="{{ request.args.get('search', '') }}" placeholder="رقم المرجع أو البيان..." class="w-full px-4 py-3 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#1f0b38]/10 focus:border-[#1f0b38] bg-white transition-all">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-600 mb-2 uppercase tracking-wide">من تاريخ</label>
            <input type="date" name="date_from" value="{{ request.args.get('date_from', '') }}" class="w-full px-4 py-3 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#1f0b38]/10 focus:border-[#1f0b38] bg-white transition-all">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-600 mb-2 uppercase tracking-wide">إلى تاريخ</label>
            <input type="date" name="date_to" value="{{ request.args.get('date_to', '') }}" class="w-full px-4 py-3 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#1f0b38]/10 focus:border-[#1f0b38] bg-white transition-all">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-600 mb-2 uppercase tracking-wide">نوع الحركة</label>
            <select name="type" class="w-full px-4 py-3 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#1f0b38]/10 focus:border-[#1f0b38] bg-white transition-all">
                <option value="all">جميع العمليات</option>
                <option value="credit" {% if request.args.get('type') == 'credit' %}selected{% endif %}>إيداع مبيعات (+)</option>
                <option value="debit" {% if request.args.get('type') == 'debit' %}selected{% endif %}>سحب تحويل (-)</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-600 mb-2 uppercase tracking-wide">حالة الحركة</label>
            <select name="status" class="w-full px-4 py-3 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#1f0b38]/10 focus:border-[#1f0b38] bg-white transition-all">
                <option value="all">جميع الحالات</option>
                <option value="completed" {% if request.args.get('status') == 'completed' %}selected{% endif %}>مكتملة</option>
                <option value="pending" {% if request.args.get('status') == 'pending' %}selected{% endif %}>قيد المعالجة</option>
            </select>
        </div>
        
        <div class="lg:col-span-5 flex justify-end pt-2">
            <button type="submit" class="px-6 py-3 rounded-xl bg-[#1f0b38] hover:bg-[#2c104f] text-white text-xs font-bold shadow-lg shadow-[#1f0b38]/20 transition-all flex items-center gap-2">
                <i class="fas fa-search"></i> تطبيق الفلتر
            </button>
        </div>
    </form>
</div>
