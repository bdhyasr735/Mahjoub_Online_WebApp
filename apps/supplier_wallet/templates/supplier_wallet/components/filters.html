<!-- Filter Bar Component (filters.html) -->
<div class="bg-white rounded-2xl border border-gray-200/80 shadow-xs p-5 space-y-4">
    <div class="flex items-center justify-between pb-3 border-b border-gray-100">
        <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-[#4A154B]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
            <span class="text-xs font-bold text-gray-800">فلاتر كشف الحساب وتخصيص العرض</span>
        </div>
        <a href="{{ url_for('supplier_wallet.wallet') }}" class="text-[11px] font-medium text-gray-400 hover:text-[#4A154B] transition-colors">
            إعادة ضبط الفلاتر ↺
        </a>
    </div>

    <form method="GET" action="{{ url_for('supplier_wallet.wallet') }}" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
        <!-- البحث -->
        <div class="lg:col-span-1">
            <label class="block text-[11px] font-bold text-gray-600 mb-1">البحث المباشر</label>
            <input type="text" name="search" value="{{ request.args.get('search', '') }}" placeholder="رقم المرجع أو البيان..." class="w-full px-3 py-2 text-xs rounded-xl border border-gray-200 bg-gray-50/50 focus:bg-white focus:border-[#4A154B] focus:ring-1 focus:ring-[#4A154B] transition-all">
        </div>

        <!-- من تاريخ -->
        <div>
            <label class="block text-[11px] font-bold text-gray-600 mb-1">من تاريخ</label>
            <input type="date" name="from_date" value="{{ request.args.get('from_date', '') }}" class="w-full px-3 py-2 text-xs rounded-xl border border-gray-200 bg-gray-50/50 focus:bg-white focus:border-[#4A154B] transition-all">
        </div>

        <!-- إلى تاريخ -->
        <div>
            <label class="block text-[11px] font-bold text-gray-600 mb-1">إلى تاريخ</label>
            <input type="date" name="to_date" value="{{ request.args.get('to_date', '') }}" class="w-full px-3 py-2 text-xs rounded-xl border border-gray-200 bg-gray-50/50 focus:bg-white focus:border-[#4A154B] transition-all">
        </div>

        <!-- نوع الحركة -->
        <div>
            <label class="block text-[11px] font-bold text-gray-600 mb-1">نوع الحركة</label>
            <select name="type" class="w-full px-3 py-2 text-xs rounded-xl border border-gray-200 bg-gray-50/50 focus:bg-white focus:border-[#4A154B] transition-all">
                <option value="all" {% if request.args.get('type') == 'all' %}selected{% endif %}>جميع الحركات</option>
                <option value="credit" {% if request.args.get('type') == 'credit' %}selected{% endif %}>إيداع مبيعات (+)</option>
                <option value="debit" {% if request.args.get('type') == 'debit' %}selected{% endif %}>سحب تحويل (-)</option>
            </select>
        </div>

        <!-- زر التطبيق -->
        <div class="flex items-end">
            <button type="submit" class="w-full py-2 px-4 rounded-xl bg-[#4A154B] hover:bg-[#3B113F] text-white text-xs font-bold shadow-xs transition-all flex items-center justify-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span>تطبيق الفلتر</span>
            </button>
        </div>
    </form>
</div>
