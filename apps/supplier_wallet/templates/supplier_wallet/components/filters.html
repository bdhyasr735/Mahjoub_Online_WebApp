<!-- Filter Bar Component (apps/supplier_wallet/templates/supplier_wallet/components/filters.html) -->
<div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 space-y-3">
    <div class="flex items-center justify-between pb-2 border-b border-gray-100">
        <span class="text-xs font-bold text-gray-800">تصفية حركة الحساب (per_page=10)</span>
    </div>
    <form method="GET" action="{{ url_for('wallet.wallet') }}" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
        <div>
            <label class="block text-xs text-gray-600 mb-1">البحث</label>
            <input type="text" name="search" value="{{ request.args.get('search', '') }}" placeholder="رقم المرجع أو البيان..." class="w-full px-2.5 py-1.5 text-xs rounded border border-gray-300">
        </div>
        <div>
            <label class="block text-xs text-gray-600 mb-1">نوع العملية</label>
            <select name="type" class="w-full px-2.5 py-1.5 text-xs rounded border border-gray-300">
                <option value="all">جميع العمليات</option>
                <option value="credit">إيداع مبيعات (+)</option>
                <option value="debit">سحب تحويل (-)</option>
            </select>
        </div>
        <div>
            <label class="block text-xs text-gray-600 mb-1">حالة العملية</label>
            <select name="status" class="w-full px-2.5 py-1.5 text-xs rounded border border-gray-300">
                <option value="all">جميع الحالات</option>
                <option value="completed">مكتملة</option>
                <option value="pending">قيد المعالجة</option>
            </select>
        </div>
        <div class="flex items-end">
            <button type="submit" class="w-full py-1.5 rounded bg-[#4A154B] text-white text-xs font-bold">
                تطبيق الفلتر
            </button>
        </div>
    </form>
</div>
