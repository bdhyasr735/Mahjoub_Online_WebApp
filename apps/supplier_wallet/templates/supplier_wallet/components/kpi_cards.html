<!-- KPI Cards Component (apps/supplier_wallet/templates/supplier_wallet/components/kpi_cards.html) -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <!-- Card 1: إجمالي المبيعات -->
    <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col justify-between transition-all hover:shadow-md">
        <div class="flex justify-between items-center mb-4">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">إجمالي المبيعات</span>
            <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-sm">
                <i class="fas fa-chart-line"></i>
            </div>
        </div>
        <div>
            <div class="text-xl font-black text-gray-900 tabular-nums flex items-center gap-1.5" dir="ltr" style="justify-content: flex-end;">
                <span>{{ total_sales }}</span>
                <span class="text-xs font-semibold text-gray-400" dir="rtl">ج.م</span>
            </div>
            <p class="text-[11px] text-gray-400 mt-1.5 font-medium">المبالغ المحولة سابقاً</p>
        </div>
    </div>

    <!-- Card 2: المعاملات المعلقة -->
    <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col justify-between transition-all hover:shadow-md">
        <div class="flex justify-between items-center mb-4">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">المعاملات المعلقة</span>
            <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-sm">
                <i class="fas fa-clock"></i>
            </div>
        </div>
        <div>
            <div class="text-xl font-black text-gray-900 tabular-nums flex items-center gap-1.5" dir="ltr" style="justify-content: flex-end;">
                <span>{{ pending_amount }}</span>
                <span class="text-xs font-semibold text-gray-400" dir="rtl">ج.م</span>
            </div>
            <p class="text-[11px] text-gray-400 mt-1.5 font-medium">قيد المعالجة والتسوية</p>
        </div>
    </div>

    <!-- Card 3: الرصيد المتاح للسحب (مميز) -->
    <div class="bg-[#1f0b38] p-6 rounded-2xl shadow-xl shadow-[#1f0b38]/10 flex flex-col justify-between text-white transition-all hover:shadow-2xl">
        <div class="flex justify-between items-center mb-4">
            <span class="text-xs font-bold text-purple-200 uppercase tracking-wider">الرصيد المتاح للسحب</span>
            <div class="w-10 h-10 rounded-xl bg-white/10 text-white flex items-center justify-center text-sm">
                <i class="fas fa-wallet"></i>
            </div>
        </div>
        <div>
            <div class="text-xl font-black text-white tabular-nums flex items-center gap-1.5" dir="ltr" style="justify-content: flex-end;">
                <span>{{ available_balance }}</span>
                <span class="text-xs font-semibold text-purple-300" dir="rtl">ج.م</span>
            </div>
            <p class="text-[11px] text-purple-200/80 mt-1.5 font-medium">جاهز للتحويل الفوري</p>
        </div>
    </div>

    <!-- Card 4: إجمالي الرصيد -->
    <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col justify-between transition-all hover:shadow-md">
        <div class="flex justify-between items-center mb-4">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">إجمالي الرصيد</span>
            <div class="w-10 h-10 rounded-xl bg-gray-50 text-gray-600 flex items-center justify-center text-sm">
                <i class="fas fa-balance-scale"></i>
            </div>
        </div>
        <div>
            <div class="text-xl font-black text-gray-900 tabular-nums flex items-center gap-1.5" dir="ltr" style="justify-content: flex-end;">
                <span>{{ total_balance }}</span>
                <span class="text-xs font-semibold text-gray-400" dir="rtl">ج.م</span>
            </div>
            <p class="text-[11px] text-gray-400 mt-1.5 font-medium">الرصيد الإجمالي التراكمي</p>
        </div>
    </div>
</div>
