<!-- 📂 apps/admin_suppliers_wallets/templates/admin/components/reject_modal.html -->
<div id="rejectModal" class="fixed inset-0 z-[70] flex items-center justify-center bg-[#1a0b2e]/70 backdrop-blur-sm hidden p-4">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden transform transition-all border border-purple-100">
        <!-- ترويسة النافذة -->
        <div class="bg-gradient-to-r from-rose-900 to-[#1a0b2e] px-6 py-4 flex items-center justify-between text-white">
            <h3 class="text-sm font-black flex items-center gap-2">
                <span>❌</span> رفض طلب السحب المالي
            </h3>
            <button type="button" onclick="closeRejectModal()" class="text-rose-200 hover:text-white transition">
                ✕
            </button>
        </div>

        <!-- محتوى النموذج -->
        <form id="rejectForm" method="POST" class="p-6 space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="action" value="reject">

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-2">يرجى إدخال سبب رفض طلب السحب:</label>
                <textarea name="reason" id="rejectReason" rows="3" required
                          class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 bg-gray-50"
                          placeholder="اكتب سبب الرفض بوضوح ليتم إرساله للمورد..."></textarea>
            </div>

            <!-- الأزرار -->
            <div class="flex items-center justify-end gap-2.5 pt-2">
                <button type="button" onclick="closeRejectModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-bold transition">
                    إلغاء
                </button>
                <button type="submit" class="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition shadow-md shadow-rose-600/20">
                    تأكيد الرفض
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // دالة فتح نافذة الرفض وتعديل مسار الـ Form
    function openRejectModal(requestId) {
        const form = document.getElementById('rejectForm');
        if (form) {
            form.action = `/withdraw-requests/${requestId}/action`;
        }
        const modal = document.getElementById('rejectModal');
        if (modal) {
            modal.classList.remove('hidden');
        }
    }

    // دالة إغلاق نافذة الرفض
    function closeRejectModal() {
        const modal = document.getElementById('rejectModal');
        if (modal) {
            modal.classList.add('hidden');
        }
    }
</script>
