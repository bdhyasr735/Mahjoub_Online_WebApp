<!-- 📂 apps/admin_suppliers_wallets/templates/admin/components/approval_modal.html -->
<div id="approvalModal" class="fixed inset-0 z-50 flex items-center justify-center bg-[#1a0b2e]/60 backdrop-blur-md hidden p-4 transition-opacity duration-300">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-purple-100 transform transition-all scale-100">
        
        <!-- Header بنمط ملكي متناسق مع المنصة -->
        <div class="bg-gradient-to-r from-[#1a0b2e] to-[#632C8F] px-6 py-4 flex items-center justify-between text-white shadow-sm">
            <h3 class="font-black text-xs sm:text-sm flex items-center gap-2 tracking-wide">
                <span class="text-base">🛡️</span> توثيق اعتماد طلب السحب المالي
            </h3>
            <button type="button" onclick="closeApprovalModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-gray-200 hover:text-white text-lg font-bold transition">
                &times;
            </button>
        </div>

        <form id="approvalForm" method="POST" class="p-6 space-y-4">
            <!-- حقل الأمان CSRF -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="action" value="approve">

            <!-- اختيار النوع (بنك / شركة صرافة) -->
            <div class="space-y-1.5">
                <label class="block text-[11px] font-bold text-gray-700">نوع جهة التحويل</label>
                <select id="payoutType" onchange="filterOptions()" class="w-full px-3.5 py-3 text-xs border border-gray-200 rounded-xl bg-gray-50/50 focus:border-[#632C8F] focus:ring-2 focus:ring-[#632C8F]/20 outline-none transition font-medium text-gray-800">
                    <option value="">اختر نوع الجهة...</option>
                    <option value="bank">🏦 بنك محلي</option>
                    <option value="company">💸 شركة صرافة</option>
                </select>
            </div>

            <!-- القائمة الديناميكية للجهات -->
            <div class="space-y-1.5">
                <label class="block text-[11px] font-bold text-gray-700">الجهة المانحة / المحولة</label>
                <select id="payoutBankSelect" name="payout_bank" class="w-full px-3.5 py-3 text-xs border border-gray-200 rounded-xl bg-gray-50/50 focus:border-[#632C8F] focus:ring-2 focus:ring-[#632C8F]/20 outline-none transition font-medium text-gray-800" required>
                    <option value="">اختر النوع أولاً لعرض الجهات...</option>
                </select>
            </div>

            <!-- رقم الحوالة / الإيصال -->
            <div class="space-y-1.5">
                <label class="block text-[11px] font-bold text-gray-700">رقم الحوالة أو سند الإيصال</label>
                <input type="text" name="transfer_number" id="transferNumberField" placeholder="أدخل رقم الحوالة أو السند بدقة..." class="w-full px-3.5 py-3 text-xs border border-gray-200 rounded-xl bg-gray-50/50 focus:border-[#632C8F] focus:ring-2 focus:ring-[#632C8F]/20 outline-none transition font-mono font-bold text-gray-800" required>
            </div>

            <!-- أزرار الإجراءات -->
            <div class="pt-3 flex items-center gap-2.5">
                <button type="submit" class="flex-1 py-3 bg-[#632C8F] hover:bg-[#570575] text-white rounded-xl text-xs font-black shadow-lg shadow-purple-900/10 transition active:scale-[0.98]">
                    تأكيد الاعتماد المالي
                </button>
                <button type="button" onclick="closeApprovalModal()" class="px-5 py-3 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-xl text-xs font-bold transition">
                    إلغاء
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const approvalData = { 
        bank: {{ yemen_banks|tojson }}, 
        company: {{ financial_companies|tojson }} 
    };

    function filterOptions() {
        const type = document.getElementById('payoutType').value;
        const select = document.getElementById('payoutBankSelect');
        select.innerHTML = '<option value="">اختر الجهة المحددة...</option>';
        if (approvalData[type]) {
            approvalData[type].forEach(item => {
                select.innerHTML += `<option value="${item.name}">${item.name}</option>`;
            });
        }
    }
</script>
