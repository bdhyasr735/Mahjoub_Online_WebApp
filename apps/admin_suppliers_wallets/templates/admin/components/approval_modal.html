<!-- 📂 apps/admin_suppliers_wallets/templates/admin/components/approval_modal.html -->
<div id="approvalModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden p-3 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-purple-100 transform transition-all scale-100">
        
        <!-- Header -->
        <div class="bg-[#1a0b2e] px-5 py-4 flex items-center justify-between text-white">
            <h3 class="font-bold text-xs sm:text-sm flex items-center gap-2">
                <span>🛡️</span> توثيق اعتماد طلب السحب
            </h3>
            <button type="button" onclick="closeApprovalModal()" class="text-gray-300 hover:text-white text-xl font-bold transition">×</button>
        </div>

        <form id="approvalForm" method="POST" class="p-4 sm:p-6 space-y-4">
            <input type="hidden" name="action" value="approve">

            <!-- اختيار النوع (بنك / شركة صرافة) -->
            <div class="space-y-1">
                <label class="block text-[11px] font-bold text-gray-600">نوع جهة التحويل</label>
                <select id="payoutType" onchange="filterOptions()" class="w-full px-3 py-2.5 text-xs border border-gray-200 rounded-xl bg-gray-50 focus:border-[#632C8F] focus:ring-1 focus:ring-[#632C8F] outline-none transition">
                    <option value="">اختر نوع الجهة...</option>
                    <option value="bank">🏦 بنك محلي</option>
                    <option value="company">💸 شركة صرافة</option>
                </select>
            </div>

            <!-- القائمة الديناميكية للجهات -->
            <div class="space-y-1">
                <label class="block text-[11px] font-bold text-gray-600">الجهة المانحة / المحولة</label>
                <select id="payoutBankSelect" name="payout_bank" class="w-full px-3 py-2.5 text-xs border border-gray-200 rounded-xl bg-gray-50 focus:border-[#632C8F] focus:ring-1 focus:ring-[#632C8F] outline-none transition" required>
                    <option value="">اختر النوع أولاً لعرض الجهات...</option>
                </select>
            </div>

            <!-- رقم الحوالة / الإيصال -->
            <div class="space-y-1">
                <label class="block text-[11px] font-bold text-gray-600">رقم الحوالة أو سند الإيصال</label>
                <input type="text" name="transfer_number" placeholder="أدخل رقم الحوالة بدقة..." class="w-full px-3 py-2.5 text-xs border border-gray-200 rounded-xl bg-gray-50 focus:border-[#632C8F] focus:ring-1 focus:ring-[#632C8F] outline-none transition" required>
            </div>

            <!-- أزرار الإجراءات -->
            <div class="pt-2 flex items-center gap-2">
                <button type="submit" class="flex-1 py-2.5 bg-[#632C8F] hover:bg-[#1a0b2e] text-white rounded-xl text-xs font-bold shadow-md transition">تأكيد الاعتماد المالي</button>
                <button type="button" onclick="closeApprovalModal()" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-xl text-xs font-bold transition">إلغاء</button>
            </div>
        </form>
    </div>
</div>

<script>
    const approvalData = { 
        bank: {{ yemen_banks|tojson }}, 
        company: {{ financial_companies|tojson }} 
    };

    function filterOptions() {
        const type = document.getElementById('payoutType').value;
        const select = document.getElementById('payoutBankSelect');
        select.innerHTML = '<option value="">اختر الجهة المحددة...</option>';
        if (approvalData[type]) {
            approvalData[type].forEach(item => {
                select.innerHTML += `<option value="${item.name}">${item.name}</option>`;
            });
        }
    }
</script>
