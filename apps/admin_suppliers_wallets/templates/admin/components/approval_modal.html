<!-- 🪟 نافذة اعتماد طلب السحب (المكون المستقل) -->
<div id="approvalModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
    <div class="bg-white w-full max-w-md mx-4 rounded-2xl shadow-2xl overflow-hidden border border-[#632C8F]">
        
        <!-- الترويسة -->
        <div class="bg-[#1a0b2e] px-6 py-4 flex items-center justify-between text-white">
            <h3 class="font-bold text-sm flex items-center gap-2">
                <span>🛡️</span> اعتماد وتوثيق العملية
            </h3>
            <button type="button" onclick="closeApprovalModal()" class="text-purple-300 hover:text-white font-bold text-xl">×</button>
        </div>

        <form id="approvalForm" method="POST" class="p-6 space-y-4">
            <input type="hidden" name="action" value="approve">

            <!-- 1. اختيار النوع أولاً (لتحسين تجربة المستخدم) -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">نوع الجهة:</label>
                <select id="payoutType" onchange="filterPayoutOptions()" class="w-full px-3 py-2 text-xs border border-gray-300 rounded-xl focus:outline-none focus:border-[#632C8F] bg-gray-50">
                    <option value="">اختر نوع الجهة (بنك / شركة صرافة)...</option>
                    <option value="bank">🏦 بنك محلي</option>
                    <option value="company">💸 شركة صرافة / تحويل</option>
                </select>
            </div>

            <!-- 2. قائمة الجهات التي ستتحدث ديناميكياً -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">جهة الصرف:</label>
                <select id="payoutBankSelect" name="payout_bank" class="w-full px-3 py-2 text-xs border border-gray-300 rounded-xl focus:outline-none focus:border-[#632C8F] bg-gray-50" required>
                    <option value="">يجب اختيار نوع الجهة أولاً...</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">رقم الحوالة / الإيصال:</label>
                <input type="text" name="transfer_number" placeholder="أدخل رقم الإيصال..." class="w-full px-3 py-2 text-xs border border-gray-300 rounded-xl focus:outline-none focus:border-[#632C8F] bg-gray-50 font-mono" required>
            </div>

            <!-- أزرار الإجراء -->
            <div class="flex items-center justify-end gap-2 pt-4 border-t border-gray-100">
                <button type="button" onclick="closeApprovalModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-bold transition">إلغاء</button>
                <button type="submit" class="px-5 py-2 bg-[#1a0b2e] hover:bg-[#632C8F] text-white rounded-xl text-xs font-bold transition shadow-sm">تأكيد الاعتماد</button>
            </div>
        </form>
    </div>
</div>

<script>
    // بيانات الجهات الممررة من الكنترولر (تستخدم في الجافاسكريبت)
    const yemenBanks = {{ yemen_banks|tojson }};
    const financialCompanies = {{ financial_companies|tojson }};

    function filterPayoutOptions() {
        const type = document.getElementById('payoutType').value;
        const select = document.getElementById('payoutBankSelect');
        
        select.innerHTML = '<option value="">اختر الجهة...</option>';
        
        let options = [];
        if (type === 'bank') options = yemenBanks;
        else if (type === 'company') options = financialCompanies;

        options.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.id;
            opt.textContent = item.name;
            select.appendChild(opt);
        });
    }
</script>
