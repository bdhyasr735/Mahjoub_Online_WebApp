<!-- 📂 apps/admin_suppliers_wallets/templates/admin/components/approval_modal.html -->
<div id="approvalModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl overflow-hidden border border-gray-200">
        
        <!-- Header -->
        <div class="bg-[#1a0b2e] px-5 py-3 flex items-center justify-between text-white">
            <h3 class="font-bold text-xs">🛡️ توثيق الاعتماد</h3>
            <button onclick="closeApprovalModal()" class="text-white hover:text-red-300 text-lg">×</button>
        </div>

        <form id="approvalForm" method="POST" class="p-5 space-y-4">
            <input type="hidden" name="action" value="approve">

            <!-- اختيار النوع -->
            <div>
                <select id="payoutType" onchange="filterOptions()" class="w-full px-3 py-2 text-xs border rounded-lg bg-gray-50 focus:border-[#632C8F] outline-none">
                    <option value="">نوع الجهة (بنك/صرافة)...</option>
                    <option value="bank">🏦 بنك محلي</option>
                    <option value="company">💸 شركة صرافة</option>
                </select>
            </div>

            <!-- القائمة الديناميكية -->
            <select id="payoutBankSelect" name="payout_bank" class="w-full px-3 py-2 text-xs border rounded-lg bg-gray-50 outline-none" required>
                <option value="">اختر الجهة بعد تحديد النوع...</option>
            </select>

            <input type="text" name="transfer_number" placeholder="رقم الحوالة / الإيصال..." class="w-full px-3 py-2 text-xs border rounded-lg focus:border-[#632C8F] outline-none" required>

            <button type="submit" class="w-full py-2 bg-[#632C8F] hover:bg-black text-white rounded-lg text-xs font-bold transition">تأكيد العملية</button>
        </form>
    </div>
</div>

<script>
    const data = { bank: {{ yemen_banks|tojson }}, company: {{ financial_companies|tojson }} };

    function filterOptions() {
        const type = document.getElementById('payoutType').value;
        const select = document.getElementById('payoutBankSelect');
        select.innerHTML = '<option value="">اختر الجهة...</option>';
        if (data[type]) {
            data[type].forEach(item => {
                select.innerHTML += `<option value="${item.id}">${item.name}</option>`;
            });
        }
    }
</script>
