<div class="bg-white p-5 rounded-3xl shadow-xl border border-[#E5E2DC] space-y-4">
    <!-- أزرار تصفية الحالة السريعة -->
    <div class="flex flex-wrap items-center gap-2">
        <a href="?status=all" class="px-4 py-2 rounded-xl text-xs font-bold transition {% if status_filter == 'all' %}bg-[#1a0b2e] text-amber-300 shadow-md{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
            🏆 تصفية الحالة: الكل
        </a>
        <a href="?status=active" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 {% if status_filter == 'active' %}bg-emerald-600 text-white shadow-md{% else %}bg-emerald-50 text-emerald-700 hover:bg-emerald-100{% endif %}">
            <span>✓</span> نشطة (10)
        </a>
        <a href="?status=review" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 {% if status_filter == 'review' %}bg-amber-500 text-white shadow-md{% else %}bg-amber-50 text-amber-800 hover:bg-amber-100{% endif %}">
            <span>⏳</span> تحت المراجعة (1)
        </a>
        <a href="?status=frozen" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 {% if status_filter == 'frozen' %}bg-rose-600 text-white shadow-md{% else %}bg-rose-50 text-rose-700 hover:bg-rose-100{% endif %}">
            <span>🔒</span> مجمدة (1)
        </a>
    </div>

    <!-- حقول البحث والفلترة المتقدمة -->
    <form method="GET" action="" class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div class="relative">
            <input 
                type="text" 
                name="q" 
                value="{{ search_query }}"
                placeholder="... السجل التجاري، الـIban، أو المدينة (WEL) بحث باسم المورد، كود المحفظة" 
                class="w-full pl-4 pr-10 py-2.5 bg-[#F4F1EA] border border-[#E5E2DC] rounded-xl text-xs font-medium text-[#1E1B18] focus:outline-none focus:border-[#1a0b2e] transition"
            >
            <span class="absolute right-3.5 top-3 text-slate-400">🔍</span>
        </div>

        <div>
            <select name="bank" class="w-full px-3 py-2.5 bg-[#F4F1EA] border border-[#E5E2DC] rounded-xl text-xs font-medium text-[#1E1B18] focus:outline-none focus:border-[#1a0b2e]">
                <option value="">🏦 كل البنوك المعتمدة</option>
                <option value="Al Rajhi">مصرف الراجحي</option>
                <option value="SNB">البنك الأهلي السعودي (SNB)</option>
                <option value="Riyad">بنك الرياض</option>
            </select>
        </div>

        <div class="flex items-center gap-2">
            <select name="category" class="w-full px-3 py-2.5 bg-[#F4F1EA] border border-[#E5E2DC] rounded-xl text-xs font-medium text-[#1E1B18] focus:outline-none focus:border-[#1a0b2e]">
                <option value="">🏷️ كل الأنشطة التجارية</option>
                <option value="electronics">إلكترونيات وأجهزة</option>
                <option value="fashion">أزياء ومستلزمات</option>
            </select>
            <button type="submit" class="px-5 py-2.5 bg-[#1a0b2e] hover:bg-[#2d124a] text-amber-300 font-bold text-xs rounded-xl shadow transition whitespace-nowrap">
                بحث
            </button>
        </div>
    </form>
</div>
