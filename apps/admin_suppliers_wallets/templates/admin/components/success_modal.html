<!-- 📂 apps/admin_suppliers_wallets/templates/admin/components/success_modal.html -->
<div id="successModal" class="fixed inset-0 z-50 flex items-center justify-center bg-[#1a0b2e]/65 backdrop-blur-md hidden p-4 transition-all duration-300">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-emerald-100 transform transition-all scale-100 animate-fade-in-down">
        
        <!-- Header بنمط النجاح المكي -->
        <div class="bg-gradient-to-r from-emerald-800 to-emerald-600 px-6 py-4 flex items-center justify-between text-white shadow-sm">
            <h3 class="font-black text-xs sm:text-sm flex items-center gap-2 tracking-wide">
                <span class="text-base">✅</span> تم اعتماد الطلب وتوثيق الحوالة بنجاح
            </h3>
            <button type="button" onclick="closeSuccessModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-gray-100 text-lg font-bold transition">
                &times;
            </button>
        </div>

        <div class="p-6 space-y-4">
            <div class="bg-emerald-50/60 border border-emerald-100 rounded-2xl p-4 space-y-3">
                
                <!-- جهة التحويل -->
                <div class="flex items-center justify-between text-xs">
                    <span class="text-gray-500 font-bold">جهة التحويل:</span>
                    <div class="flex items-center gap-2">
                        <span id="successPayoutBank" class="font-black text-gray-800">---</span>
                        <button type="button" onclick="copyText('successPayoutBank')" class="p-1.5 bg-white hover:bg-emerald-100 text-emerald-700 rounded-lg border border-emerald-200 transition text-[10px]" title="نسخ الجهة">
                            📋 نسخ
                        </button>
                    </div>
                </div>

                <hr class="border-emerald-100/60">

                <!-- رقم الحوالة -->
                <div class="flex items-center justify-between text-xs">
                    <span class="text-gray-500 font-bold">رقم الحوالة / السند:</span>
                    <div class="flex items-center gap-2">
                        <span id="successTransferNumber" class="font-mono font-black text-emerald-900 bg-white px-2.5 py-1 rounded-lg border border-emerald-200">---</span>
                        <button type="button" onclick="copyText('successTransferNumber')" class="p-1.5 bg-white hover:bg-emerald-100 text-emerald-700 rounded-lg border border-emerald-200 transition text-[10px]" title="نسخ رقم الحوالة">
                            📋 نسخ
                        </button>
                    </div>
                </div>

            </div>

            <!-- زر الإغلاق -->
            <div class="pt-2">
                <button type="button" onclick="closeSuccessModal()" class="w-full py-3 bg-[#1a0b2e] hover:bg-[#2e134f] text-white rounded-xl text-xs font-black shadow-lg transition active:scale-[0.98]">
                    إتمام وعرض القائمة
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // وظيفة النسخ السريع إلى الحافظة (Clipboard)
    function copyText(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => {
            // إظهار تنبيه بسيط أو تغيير مؤقت لنص الزر
            event.target.innerText = '✨ تم النسخ';
            setTimeout(() => {
                event.target.innerText = '📋 نسخ';
            }, 2000);
        }).catch(err => {
            console.error('فشل النسخ:', err);
        });
    }

    function closeSuccessModal() {
        document.getElementById('successModal').classList.add('hidden');
        // إعادة تحميل الصفحة لتحديث الجدول وإزالة الحالات المعلقة
        window.location.reload();
    }
</script>
