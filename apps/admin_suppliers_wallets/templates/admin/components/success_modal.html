<!-- 📂 apps/admin_suppliers_wallets/templates/admin/components/success_modal.html -->
<div id="successModal" class="fixed inset-0 z-50 flex items-center justify-center bg-[#1a0b2e]/65 backdrop-blur-md hidden p-4 transition-all duration-300">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-emerald-100 transform transition-all scale-100">
        
        <!-- Header بنمط النجاح الملكي -->
        <div class="bg-gradient-to-r from-emerald-800 to-emerald-600 px-6 py-4 flex items-center justify-between text-white shadow-sm">
            <h3 class="font-black text-xs sm:text-sm flex items-center gap-2 tracking-wide">
                <span class="text-base">✅</span> تم اعتماد طلب السحب رقم (<span id="successReqId">---</span>) بنجاح
            </h3>
            <button type="button" onclick="closeSuccessModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-gray-100 text-lg font-bold transition">
                &times;
            </button>
        </div>

        <div class="p-6 space-y-4">
            <div class="bg-emerald-50/60 border border-emerald-100 rounded-2xl p-4 space-y-3">
                
                <!-- جهة التحويل -->
                <div class="flex items-center justify-between text-xs">
                    <span class="text-gray-500 font-bold">جهة التحويل:</span>
                    <span id="successPayoutBank" class="font-black text-gray-800">---</span>
                </div>

                <hr class="border-emerald-100/60">

                <!-- رقم الحوالة / السند -->
                <div class="flex items-center justify-between text-xs">
                    <span class="text-gray-500 font-bold">رقم الحوالة / السند:</span>
                    <span id="successTransferNumber" class="font-mono font-black text-emerald-900 bg-white px-2.5 py-1 rounded-lg border border-emerald-200">---</span>
                </div>

            </div>

            <!-- زر النسخ الموحد (الجهتان معاً) -->
            <div>
                <button type="button" onclick="copyAllDetails(event)" id="copyAllBtn" class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl text-xs font-black shadow-md transition flex items-center justify-center gap-2 active:scale-[0.98]">
                    <span>📋</span> نسخ تفاصيل الحوالة (الجهة والرقم)
                </button>
            </div>

            <!-- زر الإغلاق والإنهاء -->
            <div class="pt-1">
                <button type="button" onclick="closeSuccessModal()" class="w-full py-2.5 bg-[#1a0b2e] hover:bg-[#2e134f] text-white rounded-xl text-xs font-black shadow-lg transition active:scale-[0.98]">
                    إتمام وعرض القائمة
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function copyAllDetails(event) {
        const reqId = document.getElementById('successReqId').innerText;
        const bank = document.getElementById('successPayoutBank').innerText;
        const tnum = document.getElementById('successTransferNumber').innerText;
        
        // تنسيق النص المراد نسخه بشكل احترافي ومتكامل
        const textToCopy = `تم اعتماد طلب السحب رقم (${reqId})\nجهة التحويل: ${bank}\nرقم الحوالة: ${tnum}`;
        
        const btn = event.currentTarget;
        const originalHtml = btn.innerHTML;

        navigator.clipboard.writeText(textToCopy).then(() => {
            btn.innerHTML = '✨ تم نسخ تفاصيل الحوالة بنجاح';
            btn.classList.remove('bg-emerald-700', 'hover:bg-emerald-800');
            btn.classList.add('bg-emerald-900', 'text-emerald-200');
            
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.classList.remove('bg-emerald-900', 'text-emerald-200');
                btn.classList.add('bg-emerald-700', 'hover:bg-emerald-800');
            }, 2500);
        }).catch(err => {
            console.error('فشل النسخ:', err);
        });
    }

    function openSuccessModal(reqId, bankName, transferNum) {
        document.getElementById('successReqId').innerText = reqId;
        document.getElementById('successPayoutBank').innerText = bankName;
        document.getElementById('successTransferNumber').innerText = transferNum;
        document.getElementById('successModal').classList.remove('hidden');
    }

    function closeSuccessModal() {
        document.getElementById('successModal').classList.add('hidden');
        window.location.href = window.location.pathname; // تنظيف الرابط وإعادة التوجيه
    }

    // التقاط البارامترات عند تحميل الصفحة لعرض الـ Modal تلقائياً
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('modal') === 'success') {
            const reqId = urlParams.get('req_id') || '---';
            const bank = urlParams.get('bank') || '---';
            const tnum = urlParams.get('tnum') || '---';
            openSuccessModal(reqId, bank, tnum);
        }
    });
</script>
