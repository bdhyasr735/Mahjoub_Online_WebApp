<!-- 📂 apps/admin_suppliers_wallets/templates/admin/components/success_modal.html -->
<div id="successModal" class="fixed inset-0 z-[60] flex items-center justify-center bg-[#1a0b2e]/70 backdrop-blur-sm hidden p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden transform transition-all p-6 text-center">
        <!-- أيقونة النجاح -->
        <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <h3 class="text-lg font-black text-gray-800 mb-2">تمت العملية بنجاح</h3>
        <p id="successMessage" class="text-xs text-gray-500 mb-6 font-medium">
            تم اعتماد طلب السحب وإرسال الإشعار للمورد.
        </p>

        <button onclick="closeSuccessModal()" class="w-full py-3 bg-[#632C8F] hover:bg-[#570575] text-white rounded-xl text-xs font-bold transition">
            حسناً، إغلاق
        </button>
    </div>
</div>

<script>
    // دالة لإغلاق النافذة
    function closeSuccessModal() {
        document.getElementById('successModal').classList.add('hidden');
        // إزالة معاملات الـ URL بعد الإغلاق لمنع ظهور النافذة عند عمل Refresh
        window.history.replaceState({}, document.title, window.location.pathname + window.location.search.split('?')[0]);
    }

    // فحص الـ URL عند تحميل الصفحة لفتح النافذة تلقائياً إذا وُجدت إشارة نجاح
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('modal') === 'success') {
            document.getElementById('successModal').classList.remove('hidden');
        }
    };
</script>
