<div class="row g-3">
    {% if user_scope == 'admin' %}
    <div class="col-md-4">
        <div class="card border-0 shadow-sm rounded-4 bg-primary text-white">
            <div class="card-body p-3 d-flex align-items-center justify-content-between">
                <div>
                    <h6 class="mb-1 opacity-75">كادر الإدارة العليا</h6>
                    <h3 class="fw-bold mb-0">{{ admin_staffs|length }}</h3>
                </div>
                <div class="bg-white bg-opacity-25 p-3 rounded-circle fs-3">
                    <i class="fas fa-user-shield"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-0 shadow-sm rounded-4 bg-dark text-white">
            <div class="card-body p-3 d-flex align-items-center justify-content-between">
                <div>
                    <h6 class="mb-1 opacity-75">الموردين النشطين</h6>
                    <h3 class="fw-bold mb-0">{{ suppliers|length }}</h3>
                </div>
                <div class="bg-white bg-opacity-25 p-3 rounded-circle fs-3">
                    <i class="fas fa-store"></i>
                </div>
            </div>
        </div>
    </div>
    {% endif %}
    <div class="col-md-4">
        <div class="card border-0 shadow-sm rounded-4 bg-success text-white">
            <div class="card-body p-3 d-flex align-items-center justify-content-between">
                <div>
                    <h6 class="mb-1 opacity-75">موظفي الموردين</h6>
                    <h3 class="fw-bold mb-0">{{ supplier_staffs|length }}</h3>
                </div>
                <div class="bg-white bg-opacity-25 p-3 rounded-circle fs-3">
                    <i class="fas fa-users-cog"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- شريط البحث السريع -->
<div class="row mt-3">
    <div class="col-md-6">
        <div class="input-group">
            <span class="input-group-text bg-white border-0 shadow-sm rounded-start-4 pe-3">
                <i class="fas fa-search text-muted"></i>
            </span>
            <input type="text" id="searchStaffInput" class="form-borderless form-control shadow-sm rounded-end-4 py-2" placeholder="ابحث باسم الموظف، البريد، أو المسمى الوظيفي...">
        </div>
    </div>
</div>
