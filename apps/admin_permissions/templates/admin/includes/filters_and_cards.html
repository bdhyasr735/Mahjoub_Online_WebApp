<div class="row g-3">
    {% if user_scope == 'admin' %}
    <!-- بطاقة كادر الإدارة (بنفسجي ملكي) -->
    <div class="col-md-4">
        <div class="card border-0 shadow-sm rounded-4 text-white" style="background-color: #4A154B;">
            <div class="card-body p-3 d-flex align-items-center justify-content-between">
                <div>
                    <h6 class="mb-1 opacity-75">كادر الإدارة العليا</h6>
                    <h3 class="fw-bold mb-0">{{ admin_staffs|length }}</h3>
                </div>
                <div class="bg-white bg-opacity-25 p-3 rounded-circle fs-3">
                    <i class="fas fa-user-shield"></i>
                </div>
            </div>
        </div>
    </div>
    <!-- بطاقة الموردين النشطين (رمادي داكن/فحمي) -->
    <div class="col-md-4">
        <div class="card border-0 shadow-sm rounded-4 bg-dark text-white">
            <div class="card-body p-3 d-flex align-items-center justify-content-between">
                <div>
                    <h6 class="mb-1 opacity-75">الموردين النشطين</h6>
                    <h3 class="fw-bold mb-0">{{ suppliers|length }}</h3>
                </div>
                <div class="bg-white bg-opacity-25 p-3 rounded-circle fs-3">
                    <i class="fas fa-store"></i>
                </div>
            </div>
        </div>
    </div>
    {% endif %}
    <!-- بطاقة موظفي الموردين (بنفسجي فاتح/أرجواني للإشارة للفرعية) -->
    <div class="col-md-4">
        <div class="card border-0 shadow-sm rounded-4 text-white" style="background-color: #6C3483;">
            <div class="card-body p-3 d-flex align-items-center justify-content-between">
                <div>
                    <h6 class="mb-1 opacity-75">موظفي الموردين</h6>
                    <h3 class="fw-bold mb-0">{{ supplier_staffs|length }}</h3>
                </div>
                <div class="bg-white bg-opacity-25 p-3 rounded-circle fs-3">
                    <i class="fas fa-users-cog"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- شريط البحث السريع -->
<div class="row mt-3">
    <div class="col-md-6">
        <div class="input-group">
            <span class="input-group-text bg-white border-0 shadow-sm rounded-start-4 pe-3">
                <i class="fas fa-search" style="color: #4A154B;"></i>
            </span>
            <input type="text" id="searchStaffInput" class="form-control border-0 shadow-sm rounded-end-4 py-2" placeholder="ابحث باسم الموظف، البريد، أو المسمى الوظيفي...">
        </div>
    </div>
</div>

<!-- نموذج اختيار المورد التابع له (يتم وضعه داخل نافذة المودال Modal الخاصة بإضافة موظف) -->
<div class="mb-3 mt-3">
    <label for="supplierSelect" class="form-label fw-bold text-dark">المورد التابع له</label>
    <select id="supplierSelect" name="supplier_id" class="form-select rounded-3 shadow-sm" required>
        <option value="" disabled selected>ابحث واختار المورد التابع له...</option>
        {% if suppliers %}
            {% for sup in suppliers %}
                <option value="{{ sup.id }}">{{ sup.trade_name }} ({{ sup.username }})</option>
            {% endfor %}
        {% else %}
            <option value="" disabled>لا يوجد موردين متاحين حالياً</option>
        {% endif %}
    </select>
</div>

<!-- تضمين مكتبة Tom Select للبحث المباشر داخل القائمة المنسدلة -->
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function(){
        if(document.getElementById('supplierSelect')){
            new TomSelect("#supplierSelect",{
                create: false,
                sortField: {
                    field: "text",
                    direction: "asc"
                },
                placeholder: "اكتب للبحث عن اسم المورد..."
            });
        }
    });
</script>
