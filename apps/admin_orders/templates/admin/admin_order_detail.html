{% extends "admin/admin_base.html" %}

{% block title %}تفاصيل الطلب | محجوب أونلاين{% endblock %}

{% block content %}
<div class="container-fluid mb-5">
    
    <!-- رأس الصفحة -->
    {% include "admin/order/_order_header.html" ignore missing %}

    <div class="row">
        <!-- المنتجات (تظل جزءاً من الصفحة الأساسية للسرعة) -->
        <div class="col-xl-8 col-lg-7 mb-4">
            {% include "admin/order/_items_table_card.html" ignore missing %}
        </div>

        <!-- المنطقة المخصصة للبطاقات المحملة ديناميكياً -->
        <div class="col-xl-4 col-lg-5">
            <div id="status-card-container" hx-get="/api/orders/{{ order.id }}/status" hx-trigger="load">
                <div class="spinner-border"></div> <!-- مؤشر تحميل -->
            </div>
            <div id="customer-card-container" hx-get="/api/orders/{{ order.id }}/customer" hx-trigger="load"></div>
            <div id="financial-card-container" hx-get="/api/orders/{{ order.id }}/financials" hx-trigger="load"></div>
            <div id="supplier-card-container" hx-get="/api/orders/{{ order.id }}/supplier-stats" hx-trigger="load"></div>
        </div>
    </div>
</div>
{% endblock %}
