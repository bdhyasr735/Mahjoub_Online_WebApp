<!-- إضافة مكتبة Choices.js للبحث في القائمة المنسدلة -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
    <div class="row g-3 align-items-end">
        <!-- البحث -->
        <div class="col-md-3">
            <label class="form-label fw-bold small text-muted">بحث</label>
            <input type="text" id="searchInput" class="form-control" placeholder="معرف الطلب أو العميل..." onkeyup="handleFilterChange()">
        </div>

        <!-- فلاتر الحالة (تم ربطهم بـ handleFilterChange) -->
        <div class="col-md-2">
            <label class="form-label fw-bold small text-muted">الحالة</label>
            <select id="statusFilter" class="form-select" onchange="handleFilterChange()">
                <option value="">الكل</option>
                <option value="pending">قيد الانتظار</option>
                <option value="processing">جاري التجهيز</option>
                <option value="shipped">تم الشحن</option>
                <option value="delivered">تم التسليم</option>
                <option value="cancelled">ملغي</option>
            </select>
        </div>

        <!-- فلتر المورد (سيتم تحويله إلى بحث متطور) -->
        <div class="col-md-3">
            <label class="form-label fw-bold small text-muted">المورد</label>
            <select id="supplierFilter" class="form-select" onchange="handleFilterChange()">
                <option value="">اختر مورداً...</option>
                {% for supplier in suppliers %}
                <option value="{{ supplier._id }}">{{ supplier.trade_name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- زر مسح الفلاتر -->
        <div class="col-md-1">
            <button class="btn btn-outline-danger w-100" onclick="clearAllFilters()" title="مسح">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>
</div>

<script>
    // تفعيل البحث المتطور للمورد
    document.addEventListener('DOMContentLoaded', function() {
        new Choices('#supplierFilter', {
            searchEnabled: true,
            itemSelectText: '',
            placeholder: true,
        });
    });

    // دالة تحديث موحدة لكل الفلاتر
    function handleFilterChange() {
        // تأخير بسيط لتجنب كثرة طلبات السيرفر أثناء الكتابة (Debounce)
        clearTimeout(window.filterTimeout);
        window.filterTimeout = setTimeout(() => {
            fetchAdminOrders(1);
        }, 500);
    }

    window.clearAllFilters = function() {
        document.getElementById('searchInput').value = '';
        document.getElementById('statusFilter').value = '';
        document.getElementById('supplierFilter').value = '';
        // إعادة تفعيل القائمة بعد المسح
        fetchAdminOrders(1);
    };
</script>
