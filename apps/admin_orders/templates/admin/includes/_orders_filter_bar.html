<!-- ============================================================
     📂 apps/admin_orders/templates/admin/includes/_orders_filter_bar.html
     ============================================================ -->

<!-- مكتبة Choices.js للبحث المتطور في القوائم المنسدلة -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
    <div class="row g-3">
        <!-- الصف الأول: البحث، حالة الطلب، حالة الدفع، والمورد -->
        <div class="col-md-3">
            <label class="form-label fw-bold small text-muted">بحث سريع</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-search text-muted"></i></span>
                <input type="text" id="searchInput" class="form-control border-start-0" placeholder="رقم الطلب أو العميل...">
            </div>
        </div>

        <div class="col-md-3">
            <label class="form-label fw-bold small text-muted">حالة الطلب</label>
            <select id="orderStatusFilter" class="form-select">
                <option value="">الكل</option>
                <option value="pending">⏳ قيد الانتظار</option>
                <option value="processing">🔄 قيد التجهيز</option>
                <option value="shipped">🚚 تم الشحن</option>
                <option value="delivered">📦 تم التسليم</option>
                <option value="completed">✅ مكتمل</option>
                <option value="cancelled">❌ ملغي</option>
                <option value="refunded">↩️ مسترجع</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label fw-bold small text-muted">حالة الدفع</label>
            <select id="paymentStatusFilter" class="form-select">
                <option value="">الكل</option>
                <option value="true">💰 مدفوع</option>
                <option value="false">💳 غير مدفوع</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label fw-bold small text-muted">المورد</label>
            <select id="supplierFilter" class="form-select">
                <option value="">كل الموردين...</option>
                <option value="none">🏷️ بدون مورد (المتجر)</option>
                {% for supplier in suppliers %}
                <option value="{{ supplier.id }}">{{ supplier.trade_name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- الصف الثاني: الفترة الزمنية -->
        <div class="col-md-12">
            <label class="form-label fw-bold small text-muted">الفترة الزمنية</label>
            <div class="d-flex gap-2">
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 small">من</span>
                    <input type="date" id="dateFrom" class="form-control border-start-0">
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 small">إلى</span>
                    <input type="date" id="dateTo" class="form-control border-start-0">
                </div>
                <button class="btn btn-outline-danger" onclick="clearAllFilters()" title="إعادة تعيين">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // تفعيل البحث المتقدم للموردين
    const supplierSelect = new Choices('#supplierFilter', {
        searchEnabled: true,
        itemSelectText: '',
        shouldSort: false,
        placeholder: true
    });

    // ✅ ربط الكائن بالعنصر لكي تستطيع دالة getVal قراءته من الصفحة الرئيسية
    const supplierEl = document.getElementById('supplierFilter');
    if (supplierEl) {
        supplierEl.choicesInstance = supplierSelect;
        
        // مراقبة تغيير المورد عبر Choices.js
        supplierEl.addEventListener('choice', function() {
            clearTimeout(window.filterTimeout);
            window.filterTimeout = setTimeout(() => {
                if (typeof fetchOrders === 'function') {
                    fetchOrders(1);
                }
            }, 300);
        });
    }

    // قائمة الحقول الأخرى للمراقبة التلقائية
    const filterIds = [
        'searchInput', 'orderStatusFilter', 'paymentStatusFilter', 'dateFrom', 'dateTo'
    ];

    // إضافة مستمعين للأحداث لباقي الفلاتر
    filterIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            const eventType = (el.tagName === 'INPUT') ? 'input' : 'change';
            el.addEventListener(eventType, function() {
                clearTimeout(window.filterTimeout);
                window.filterTimeout = setTimeout(() => {
                    if (typeof fetchOrders === 'function') {
                        fetchOrders(1);
                    }
                }, 400);
            });
        }
    });

    // دالة مسح جميع الفلاتر
    window.clearAllFilters = function() {
        document.getElementById('searchInput').value = '';
        document.getElementById('orderStatusFilter').value = '';
        document.getElementById('paymentStatusFilter').value = '';
        document.getElementById('dateFrom').value = '';
        document.getElementById('dateTo').value = '';
        supplierSelect.setChoiceByValue('');
        
        if (typeof fetchOrders === 'function') {
            fetchOrders(1);
        }
    };
});
</script>
