<div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
    <div class="row g-3 align-items-end">
        <!-- 1. البحث -->
        <div class="col-md-3">
            <label class="form-label fw-bold small text-uppercase text-muted">
                <i class="fas fa-search me-1"></i> بحث
            </label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-search text-muted"></i></span>
                <input type="text" id="searchInput" class="form-control border-start-0" placeholder="رقم الطلب أو اسم العميل...">
            </div>
        </div>

        <!-- 2. فلتر الحالة -->
        <div class="col-md-2">
            <label class="form-label fw-bold small text-uppercase text-muted">
                <i class="fas fa-circle me-1" style="color: #D4AF37;"></i> الحالة
            </label>
            <select id="statusFilter" class="form-select">
                <option value="">الكل</option>
                <option value="pending">⏳ قيد الانتظار</option>
                <option value="confirmed">✅ مؤكد</option>
                <option value="processing">🔄 قيد المعالجة</option>
                <option value="shipped">📦 تم الشحن</option>
                <option value="delivered">✅ تم التسليم</option>
                <option value="cancelled">❌ ملغي</option>
                <option value="refunded">💸 مسترد</option>
                <option value="returned">↩️ مرتجع</option>
            </select>
        </div>

        <!-- 3. فلتر المورد (جديد) -->
        <div class="col-md-2">
            <label class="form-label fw-bold small text-uppercase text-muted">
                <i class="fas fa-store me-1"></i> المورد
            </label>
            <select id="supplierFilter" class="form-select" onchange="fetchAdminOrders(1)">
                <option value="">الكل</option>
                {% for supplier in suppliers %}
                <option value="{{ supplier.id }}">{{ supplier.trade_name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- 4. نطاق التاريخ -->
        <div class="col-md-3">
            <label class="form-label fw-bold small text-uppercase text-muted">
                <i class="fas fa-calendar-alt me-1"></i> الفترة الزمنية
            </label>
            <div class="d-flex gap-2">
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">من</span>
                    <input type="date" id="dateFrom" class="form-control border-start-0">
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">إلى</span>
                    <input type="date" id="dateTo" class="form-control border-start-0">
                </div>
            </div>
        </div>

        <!-- 5. عدد العناصر وأزرار التحكم -->
        <div class="col-md-2 d-flex gap-2 align-items-end">
            <div class="w-50">
                <label class="form-label fw-bold small text-uppercase text-muted">عدد</label>
                <select id="limitSelect" class="form-select">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
            </div>
            <button class="btn btn-primary w-50" style="background: #2d0b36; border: none;" onclick="fetchAdminOrders(1)">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    window.clearAllFilters = function() {
        document.getElementById('searchInput').value = '';
        document.getElementById('statusFilter').value = '';
        document.getElementById('supplierFilter').value = '';
        document.getElementById('dateFrom').value = '';
        document.getElementById('dateTo').value = '';
        document.getElementById('limitSelect').value = '10';
        fetchAdminOrders(1);
    };
});
</script>
