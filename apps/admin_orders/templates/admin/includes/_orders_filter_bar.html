<!-- مكتبة Choices.js للبحث المتطور في القوائم المنسدلة -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 1. تفعيل البحث المتطور على قائمة الموردين
    const supplierSelect = new Choices('#supplierFilter', {
        searchEnabled: true,
        itemSelectText: '',
        shouldSort: false,
        placeholder: true
    });

    // 2. ربط جميع الفلاتر بـ الأحداث لتحديث الجدول تلقائياً (AJAX)
    const filterElements = [
        'searchInput',
        'paymentStatusFilter',
        'orderStatusFilter',
        'fulfillmentStatusFilter',
        'supplierFilter'
    ];

    filterElements.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            const eventType = el.tagName === 'INPUT' ? 'input' : 'change';
            
            el.addEventListener(eventType, function() {
                // إذا كانت دالة الجلب موجودة (مثل fetchOrders) يتم استدعاؤها للصفحة الأولى
                if (typeof fetchOrders === 'function') {
                    clearTimeout(window.filterTimeout);
                    window.filterTimeout = setTimeout(() => fetchOrders(1), 400);
                }
            });
        }
    });
});
</script>
