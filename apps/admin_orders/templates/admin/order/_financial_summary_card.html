<!-- 📂 apps/admin_orders/templates/admin/order/_financial_summary_card.html -->
<div class="order-card p-4">
    <h5 class="fw-bold mb-3" style="color: #2d0b36;"><i class="fas fa-file-invoice-dollar me-2 text-success"></i> الملخص المالي</h5>

    <div class="d-flex justify-content-between py-2 border-bottom">
        <span class="text-muted small">إجمالي الطلب:</span>
        <span class="fw-bold">{{ order.total_price }} ر.س</span>
    </div>

    <div class="d-flex justify-content-between py-2 border-bottom">
        <span class="text-muted small">رسوم الشحن:</span>
        <span class="fw-bold">0.00 ر.س</span>
    </div>

    <div class="d-flex justify-content-between py-2 border-bottom">
        <span class="text-muted small">الخصم:</span>
        <span class="fw-bold">0.00 ر.س</span>
    </div>

    <div class="d-flex justify-content-between py-3">
        <span class="fw-bold">المبلغ المستحق:</span>
        <span class="fw-bold text-success fs-5">{{ order.total_price }} ر.س</span>
    </div>

    <div class="mt-2 p-2 rounded-3 bg-light">
        <span class="small text-muted">حالة الدفع:</span>
        <span class="badge {{ 'bg-success' if order.is_paid else 'bg-warning text-dark' }} ms-2">
            {{ 'مدفوع' if order.is_paid else 'غير مدفوع' }}
        </span>
    </div>
</div>
