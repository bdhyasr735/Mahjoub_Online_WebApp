{# 📂 apps/admin_orders/templates/admin/order/_customer_info_card.html #}
<div class="card shadow mb-4">
    <div class="card-header py-3 bg-primary text-white">
        <h6 class="m-0 font-weight-bold">معلومات العميل</h6>
    </div>
    <div class="card-body">
        <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>اسم العميل:</span>
                <strong>{{ order.customer_name or order.user_name or 'عميل متجر' }}</strong>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>رقم الهاتف:</span>
                <span dir="ltr">{{ order.phone or order.customer_phone or 'غير متوفر' }}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>عنوان الشحن:</span>
                <span class="text-truncate" style="max-width: 200px;" title="{{ order.address }}">
                    {{ order.address or 'غير متوفر' }}
                </span>
            </li>
        </ul>
    </div>
</div>
