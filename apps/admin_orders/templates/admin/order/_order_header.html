{# 📂 apps/admin_orders/templates/admin/order/_order_header.html #}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="h3 mb-0 text-gray-800">تفاصيل الطلب <span class="text-primary">#{{ order.id }}</span></h2>
        <p class="text-muted text-sm mt-1">تاريخ الإنشاء: {{ order.created_at or 'غير متوفر' }}</p>
    </div>
    <div class="d-flex gap-2">
        <a href="{{ url_for('admin_orders_bp.list_admin_orders') }}" class="btn btn-secondary btn-sm">
            <i class="fas fa-arrow-right ml-1"></i> العودة للقائمة
        </a>
        <a href="{{ url_for('admin_orders_bp.print_order_invoice', order_id=order.id) }}" target="_blank" class="btn btn-info btn-sm">
            <i class="fas fa-print ml-1"></i> طباعة الفاتورة
        </a>
    </div>
</div>
