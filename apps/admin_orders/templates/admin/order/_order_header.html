            تفاصيل الطلب <span class="text-muted">#{{ order.id or order.order_id or order._id or '----' }}</span>

    <div class="col-sm-6 text-sm-end mt-3 mt-sm-0">
        <a href="{{ url_for('admin_orders_bp.list_admin_orders') }}" class="btn btn-outline-secondary btn-sm me-2">

            <i class="fas fa-print me-1"></i> طباعة الفاتورة
        </button>
    </div>
</div>
