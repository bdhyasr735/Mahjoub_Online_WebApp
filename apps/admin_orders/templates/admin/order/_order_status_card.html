{# 📂 apps/admin_orders/templates/admin/order/_order_status_card.html #}
<div class="card shadow mb-4">
    <div class="card-header py-3 bg-dark text-white">
        <h6 class="m-0 font-weight-bold">حالة الطلب والدفع</h6>
    </div>
    <div class="card-body">
        <label class="form-label font-weight-bold">حالة الطلب:</label>
        <select id="orderStatusSelect" class="form-control mb-3" data-order-id="{{ order.id }}">
            <option value="pending" {% if order.status_code == 'pending' %}selected{% endif %}>قيد الانتظار</option>
            <option value="processing" {% if order.status_code == 'processing' %}selected{% endif %}>قيد التجهيز</option>
            <option value="shipped" {% if order.status_code == 'shipped' %}selected{% endif %}>تم الشحن</option>
            <option value="delivered" {% if order.status_code == 'delivered' %}selected{% endif %}>تم التسليم</option>
            <option value="completed" {% if order.status_code == 'completed' %}selected{% endif %}>مكتمل</option>
            <option value="cancelled" {% if order.status_code == 'cancelled' %}selected{% endif %}>ملغي</option>
            <option value="refunded" {% if order.status_code == 'refunded' %}selected{% endif %}>مسترجع</option>
        </select>

        <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" id="isPaidSwitch" {% if order.is_paid %}checked{% endif %} data-order-id="{{ order.id }}">
            <label class="form-check-label font-weight-bold mr-2" for="isPaidSwitch">الطلب مدفوع</label>
        </div>
    </div>
</div>
