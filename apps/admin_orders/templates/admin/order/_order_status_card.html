<!-- 📂 apps/admin_orders/templates/admin/order/_order_status_card.html -->
<div class="order-card p-4">
    <h5 class="fw-bold mb-4" style="color: #2d0b36;"><i class="fas fa-sliders-h me-2 text-primary"></i> إدارة حالات الطلب</h5>
    
    <!-- أ) حالة الطلب -->
    <div class="mb-3">
        <label class="form-label small fw-bold text-muted">حالة الطلب:</label>
        <select class="form-select rounded-3 py-2 fw-bold" id="orderStatusSelect" onchange="updateOrderStatus('{{ order._id }}')">
            <option value="pending" {% if order.status and order.status.name == 'pending' %}selected{% endif %}>⏳ قيد الانتظار (Pending)</option>
            <option value="processing" {% if order.status and order.status.name == 'processing' %}selected{% endif %}>⚙️ قيد التجهيز (Processing)</option>
            <option value="completed" {% if order.status and order.status.name == 'completed' %}selected{% endif %}>✅ مكتمل (Completed)</option>
            <option value="cancelled" {% if order.status and order.status.name == 'cancelled' %}selected{% endif %}>❌ ملغي (Cancelled)</option>
        </select>
    </div>

    <!-- ب) الحالة المالية (isPaid) -->
    <div class="mb-3">
        <label class="form-label small fw-bold text-muted">الحالة المالية (الدفع):</label>
        <select class="form-select rounded-3 py-2 fw-bold" id="paymentStatusSelect" onchange="updatePaymentStatus('{{ order._id }}')">
            <option value="false" {% if not order.isPaid %}selected{% endif %}>❌ غير مدفوع / عند الاستلام (COD: {{ 'نعم' if order.COD else 'لا' }})</option>
            <option value="true" {% if order.isPaid %}selected{% endif %}>💳 تم الدفع (Paid)</option>
        </select>
    </div>

    <div id="statusAlert" style="display: none;"></div>
</div>
