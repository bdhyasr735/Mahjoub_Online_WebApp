<!-- 📂 apps/admin_orders/templates/admin/order/_order_scripts.html -->
<script>
document.addEventListener('DOMContentLoaded', function () {

    // 1. تحديث مورد عنصر محدد ديناميكياً مع التفاعل الفوري للواجهة (القائمة المخصصة)
    const supplierOptions = document.querySelectorAll('.supplier-option');
    if (supplierOptions.length > 0) {
        supplierOptions.forEach(option => {
            option.addEventListener('click', function () {
                const orderId = this.dataset.orderId;
                const itemId = this.dataset.itemId;
                const supplierId = this.dataset.supplierId;
                const selectedOptionText = this.textContent.trim();

                if (!orderId || !itemId) return;

                const td = this.closest('td');
                const displayView = td.querySelector('.supplier-display-view');
                const editView = td.querySelector('.supplier-edit-view');

                // تعطيل مؤقت للتفاعل أثناء الإرسال
                editView.style.opacity = '0.6';
                editView.style.pointerEvents = 'none';

                fetch(`/admin/orders/${orderId}/item/${itemId}/assign-supplier`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ supplier_id: supplierId })
                })
                .then(res => res.json())
                .then(data => {
                    editView.style.opacity = '1';
                    editView.style.pointerEvents = 'auto';

                    if (data.success) {
                        // تحديث اسم المورد المعروض في الشاشة فوراً
                        const nameSpan = displayView.querySelector('span');
                        if (nameSpan) {
                            nameSpan.textContent = selectedOptionText;
                            nameSpan.setAttribute('title', selectedOptionText);
                        }

                        // تحديث شكل العنصر المختار داخل القائمة المخصصة
                        td.querySelectorAll('.supplier-option').forEach(opt => opt.classList.remove('bg-light', 'fw-bold'));
                        if (supplierId !== "") {
                            this.classList.add('bg-light', 'fw-bold');
                        }

                        // تبديل الواجهة وإخفاء قائمة التعديل والعودة لشكل العرض الثابت
                        editView.classList.add('d-none');
                        displayView.classList.remove('d-none');

                        console.log(data.message || 'تم تعيين المورد بنجاح');
                    } else {
                        alert('خطأ: ' + (data.message || 'فشل التعيين'));
                    }
                })
                .catch(err => {
                    editView.style.opacity = '1';
                    editView.style.pointerEvents = 'auto';
                    console.error('Error assigning supplier:', err);
                    alert('فشل الاتصال بالسيرفر أثناء تعيين المورد');
                });
            });
        });
    }

    // 2. تحديث حالة الطلب العام
    const btnUpdateStatus = document.getElementById('btn-update-status');
    if (btnUpdateStatus) {
        btnUpdateStatus.addEventListener('click', function () {
            const statusSelect = document.getElementById('order_status');
            const orderIdInput = document.querySelector('input[name="order_id"]');
            const orderId = orderIdInput ? orderIdInput.value : null;

            if (!statusSelect || !orderId) {
                console.warn('Order ID or Status element missing.');
                return;
            }

            fetch(`/admin/orders/${orderId}/update-status`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ status: statusSelect.value })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('تم تحديث حالة الطلب بنجاح');
                    window.location.reload();
                } else {
                    alert('حدث خطأ أثناء التحديث: ' + (data.message || 'فشل الأداء'));
                }
            })
            .catch(err => {
                console.error('Error updating status:', err);
                alert('فشل الاتصال بالسيرفر');
            });
        });
    }
});
</script>
