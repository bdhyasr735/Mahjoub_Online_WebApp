<!-- 📂 apps/admin_orders/templates/admin/order/_order_scripts.html -->
<script>
    // دالة تحديث مورد المنتج ضمن الطلب
    function updateItemSupplier(orderId, itemId, supplierId) {
        if (!supplierId) return;
        
        fetch(`/admin/orders/${orderId}/items/${itemId}/supplier`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify({ supplier_id: supplierId })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // إشعار نجاح خفيف أو تحديث بصري
                console.log("تم تحديث المورد بنجاح");
            } else {
                alert(data.message || 'حدث خطأ أثناء تحديث المورد.');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('حدث خطأ في الاتصال بالخادم.');
        });
    }

    // زر العودة أو التوجيه بعد العمليات
    document.addEventListener("DOMContentLoaded", function() {
        // أي سكربتات إضافية لإدارة تفاصيل الطلب تضاف هنا
    });
</script>
