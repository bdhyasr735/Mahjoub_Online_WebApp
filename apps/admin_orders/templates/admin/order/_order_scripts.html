<!-- 📂 apps/admin_orders/templates/admin/order/_order_scripts.html -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    
    // 1. تحديث مورد عنصر محدد (مع التأكد من وجود العناصر لتجنب توقف السكربت)
    const supplierSelects = document.querySelectorAll('.item-supplier-select');
    if (supplierSelects.length > 0) {
        supplierSelects.forEach(select => {
            select.addEventListener('change', function () {
                const orderId = this.dataset.orderId;
                const itemId = this.dataset.itemId;
                const supplierId = this.value;

                if (!orderId || !itemId) return;

                // إضافة مؤشر مرئي بسيط أو تعطيل مؤقت للقائمة أثناء الحفظ (اختياري لزيادة الاحترافية)
                this.disabled = true;

                fetch(`/admin/orders/${orderId}/item/${itemId}/assign-supplier`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ supplier_id: supplierId })
                })
                .then(res => res.json())
                .then(data => {
                    this.disabled = false;
                    if (data.success) {
                        // إشعار سريع أو تحديث خفيف إذا لزم الأمر
                        console.log(data.message || 'تم تعيين المورد بنجاح');
                    } else {
                        alert('خطأ: ' + (data.message || 'فشل التعيين'));
                    }
                })
                .catch(err => {
                    this.disabled = false;
                    console.error('Error assigning supplier:', err);
                    alert('فشل الاتصال بالسيرفر أثناء تعيين المورد');
                });
            });
        });
    }

    // 2. تحديث حالة الطلب العام
    const btnUpdateStatus = document.getElementById('btn-update-status');
    if (btnUpdateStatus) {
        btnUpdateStatus.addEventListener('click', function () {
            const statusSelect = document.getElementById('order_status');
            const orderIdInput = document.querySelector('input[name="order_id"]');
            const orderId = orderIdInput ? orderIdInput.value : null;

            if (!statusSelect || !orderId) {
                console.warn('Order ID or Status element missing.');
                return;
            }

            fetch(`/admin/orders/${orderId}/update-status`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ status: statusSelect.value })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('تم تحديث حالة الطلب بنجاح');
                    window.location.reload();
                } else {
                    alert('حدث خطأ أثناء التحديث: ' + (data.message || 'فشل الأداء'));
                }
            })
            .catch(err => {
                console.error('Error updating status:', err);
                alert('فشل الاتصال بالسيرفر');
            });
        });
    }
});
</script>
