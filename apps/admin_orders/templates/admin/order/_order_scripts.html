{# 📂 apps/admin_orders/templates/admin/order/_order_scripts.html #}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // تحديث حالة الطلب
    const statusSelect = document.getElementById('orderStatusSelect');
    if (statusSelect) {
        statusSelect.addEventListener('change', function() {
            const orderId = this.dataset.orderId;
            const newStatus = this.value;

            fetch(`/admin/orders/${orderId}/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    console.log('Success:', data.message);
                } else {
                    alert('خطأ: ' + data.message);
                }
            })
            .catch(err => console.error('Error:', err));
        });
    }

    // تحديث حالة الدفع
    const isPaidSwitch = document.getElementById('isPaidSwitch');
    if (isPaidSwitch) {
        isPaidSwitch.addEventListener('change', function() {
            const orderId = this.dataset.orderId;
            const isPaid = this.checked;

            fetch(`/admin/orders/${orderId}/payment-status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ isPaid: isPaid })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    console.log('Success:', data.message);
                } else {
                    alert('خطأ: ' + data.message);
                }
            })
            .catch(err => console.error('Error:', err));
        });
    }

    // تحديث مورد العنصر
    document.querySelectorAll('.item-supplier-select').forEach(select => {
        select.addEventListener('change', function() {
            const orderId = this.dataset.orderId;
            const itemId = this.dataset.itemId;
            const supplierId = this.value;

            fetch(`/admin/orders/${orderId}/items/supplier`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item_id: itemId, supplier_id: supplierId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    console.log('Success:', data.message);
                } else {
                    alert('خطأ: ' + data.message);
                }
            })
            .catch(err => console.error('Error:', err));
        });
    });
});
</script>
