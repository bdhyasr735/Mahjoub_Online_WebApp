<script>
document.addEventListener('DOMContentLoaded', function () {
    
    // 1. تحديث مورد عنصر محدد
    const supplierSelects = document.querySelectorAll('.item-supplier-select');
    supplierSelects.forEach(select => {
        select.addEventListener('change', function () {
            const orderId = this.dataset.orderId;
            const itemId = this.dataset.itemId;
            const supplierId = this.value;

            fetch(`/admin/orders/${orderId}/item/${itemId}/assign-supplier`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ supplier_id: supplierId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('تم تعيين المورد بنجاح');
                } else {
                    alert('خطأ: ' + (data.message || 'فشل التعيين'));
                }
            })
            .catch(err => {
                console.error('Error assigning supplier:', err);
            });
        });
    });

    // 2. تحديث حالة الطلب العام
    const btnUpdateStatus = document.getElementById('btn-update-status');
    if (btnUpdateStatus) {
        btnUpdateStatus.addEventListener('click', function () {
            const statusSelect = document.getElementById('order_status');
            const orderId = document.querySelector('input[name="order_id"]')?.value;

            if (!statusSelect || !orderId) return;

            fetch(`/admin/orders/${orderId}/update-status`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ status: statusSelect.value })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('تم تحديث حالة الطلب بنجاح');
                    window.location.reload();
                } else {
                    alert('حدث خطأ أثناء التحديث: ' + (data.message || 'فشل الأداء'));
                }
            })
            .catch(err => {
                console.error('Error updating status:', err);
                alert('فشل الاتصال بالسيرفر');
            });
        });
    }
});
</script>
