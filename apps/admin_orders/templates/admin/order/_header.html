<!-- 📂 apps/admin_orders/templates/admin/order/_order_header.html -->
<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3 bg-white p-3 rounded-4 shadow-sm">
    <div class="d-flex align-items-center gap-3">
        <a href="{{ url_for('admin_orders_bp.list_admin_orders') }}" class="btn btn-light rounded-circle p-2 border">
            <i class="fas fa-arrow-right"></i>
        </a>
        <div>
            <h4 class="fw-bold mb-0" style="color: #2d0b36;">
                📦 الطلب رقم #{{ order._id[:8] }}
            </h4>
            <small class="text-muted"><i class="far fa-clock me-1"></i> تاريخ الإنشاء: {{ order.createdAt or 'غير محدد' }}</small>
        </div>
    </div>

    <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary rounded-3 px-3" onclick="window.print()">
            <i class="fas fa-print me-1"></i> طباعة الفاتورة
        </button>
    </div>
</div>
