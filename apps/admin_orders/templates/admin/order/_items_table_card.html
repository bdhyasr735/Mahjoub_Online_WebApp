<!-- 📂 apps/admin_orders/templates/admin/order/_items_table_card.html -->
<div class="card shadow-sm">
    <div class="card-header bg-light">
        <h5 class="mb-0">عناصر الطلب</h5>
    </div>
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="thead-light">
                <tr>
                    <th>المنتج</th>
                    <th>الكمية</th>
                    <th>المورد</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items_list %}
                <tr>
                    <td>{{ item.productData.title if item.productData else 'منتج غير معروف' }}</td>
                    <td>{{ item.quantity }}</td>
                    <td>
                        <select class="form-select form-select-sm supplier-select" 
                                data-item-id="{{ item.id }}" 
                                data-order-id="{{ order_id }}">
                            <option value="">-- بدون مورد --</option>
                            {% for supplier in all_suppliers %}
                            <option value="{{ supplier.id }}" {% if item.supplier_id == supplier.id %}selected{% endif %}>
                                {{ supplier.trade_name or supplier.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script>
    // سكربت بسيط لتعيين المورد عند التغيير
    document.querySelectorAll('.supplier-select').forEach(select => {
        select.addEventListener('change', function() {
            const itemId = this.dataset.itemId;
            const orderId = this.dataset.orderId;
            const supplierId = this.value;

            fetch(`/admin/orders/${orderId}/item/${itemId}/assign-supplier`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({supplier_id: supplierId})
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert('تم التحديث بنجاح');
                } else {
                    alert('خطأ: ' + data.message);
                }
            });
        });
    });
</script>
