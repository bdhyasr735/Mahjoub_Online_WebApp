<!-- 📂 apps/admin_orders/templates/admin/order/_items_table_card.html -->
<div class="card shadow-sm mb-4">
    <div class="card-header bg-white py-3">
        <h5 class="mb-0 text-primary font-weight-bold">عناصر الطلب</h5>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width: 80px;" class="text-center">صورة المنتج</th>
                        <th>عنوان المنتج</th>
                        <th class="text-center" style="width: 100px;">الكمية</th>
                        <th style="width: 200px;">المورد</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in items_list %}
                    <tr>
                        <!-- 1. صورة المنتج (استخدام الحقل الصحيح product_image) -->
                        <td class="text-center">
                            <img src="{{ item.product_image if item.product_image else url_for('static', filename='img/default-product.png') }}" 
                                 alt="صورة المنتج" 
                                 class="rounded border" 
                                 style="width: 50px; height: 50px; object-fit: cover;">
                        </td>

                        <!-- 2. عنوان المنتج (استخدام الحقل الصحيح product_name) -->
                        <td>
                            <div class="fw-bold text-dark">
                                {{ item.product_name if item.product_name else 'منتج بدون اسم' }}
                            </div>
                        </td>

                        <!-- 3. الكمية -->
                        <td class="text-center">
                            <span class="badge bg-secondary px-2 py-1">{{ item.quantity }}</span>
                        </td>

                        <!-- 4. تعيين المورد -->
                        <td>
                            <select class="form-select form-select-sm supplier-select" 
                                    data-item-id="{{ item.id }}" 
                                    data-order-id="{{ order.id }}">
                                <option value="">-- بدون مورد --</option>
                                {% for supplier in suppliers %}
                                <option value="{{ supplier.id }}" {% if item.supplier_id == supplier.id %}selected{% endif %}>
                                    {{ supplier.trade_name or supplier.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="text-center py-4 text-muted">لا توجد عناصر مسجلة لهذا الطلب.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('.supplier-select').forEach(select => {
        select.addEventListener('change', function() {
            const itemId = this.dataset.itemId;
            const orderId = this.dataset.orderId;
            const supplierId = this.value;

            fetch(`/admin/orders/${orderId}/item/${itemId}/assign-supplier`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({supplier_id: supplierId})
            })
            .then(res => res.json())
            .then(data => {
                if(!data.success) {
                    alert('خطأ أثناء الحفظ: ' + data.message);
                }
            })
            .catch(err => console.error('Error:', err));
        });
    });
</script>
